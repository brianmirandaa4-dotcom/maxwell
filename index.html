<script>window.MAXWELL_DATA={"build":"2026-11-05 13:22","chapters":[{"id":"ch1","num":1,"title":"Time-Varying & Time-Harmonic Fields","short":"Maxwell","color":"#F2BF4C","lectures":"L1–L5","status":"coming","note":"Lectured · content arrives in batch 2"},{"id":"ch2","num":2,"title":"Electrical Properties of Matter","short":"Materials","color":"#FF7E6B","lectures":"L6–L8","status":"coming","note":"Lectured · content arrives in batch 2"},{"id":"ch3","num":3,"title":"Wave Equation & Its Solutions","short":"Wave eq.","color":"#B6E35C","lectures":"L8–L11","status":"coming","note":"Lectured · content arrives in batch 2"},{"id":"ch4","num":4,"title":"Propagation & Polarization","short":"Polarization","color":"#4FC8D8","lectures":"L12–L13","status":"coming","note":"Lectured · content arrives in batch 2"},{"id":"ch5","num":5,"title":"Reflection & Transmission","short":"Refl./Trans.","color":"#6FA8FF","lectures":"L13–L14","status":"coming","note":"Lectured · content arrives in batch 2"},{"id":"ch6","num":6,"title":"Auxiliary Vector Potentials","short":"Potentials","color":"#C7B6FF","lectures":"L15–L17","status":"coming","note":"Lectured · next batch (Exam 2)"},{"id":"ch8","num":8,"title":"Rectangular Waveguides","short":"Waveguides","color":"#FF9F5A","lectures":"L18–L19","status":"lectured","lessons":[{"id":"8.1","title":"What a waveguide is","lec":"L18","viz":"hero","hook":"A garden hose for fields.","intuition":"Prather's picture: a waveguide is \"nothing more than a little hose.\" You hook it to the spigot (a big amplifier, a TWT), and it routes the energy to wherever the nozzle is (an antenna). The difference from a hose: it's a rigid metal geometry, and the metal is what imposes the boundary conditions.¶He also told the story from his Navy days on LPD-25: an SPS-48 radar with megawatts of power had a huge back reflection nobody could find. Up the mast, a semi-rigid waveguide section had gotten so hot it bowed at the bolts, which threw off the impedance match, which made the reflection worse, which made it hotter. \"Impedance matching and back reflections and standing waves: it's all real stuff.\"","math":[{"t":"Convention (always, always, always)","tex":"a\\ \\text{(long side)}\\ \\text{along } x,\\qquad b\\ \\text{(short side)}\\ \\text{along } y,\\qquad \\text{propagation along } +z","note":"His words: \"If you want to do it the opposite way, that's fine with me. Just make sure I understand it on your exam.\""},{"t":"Walls are treated as PEC","tex":"\\hat n\\times\\mathbf E=0\\ \\text{on every wall}","note":"Real walls are excellent conductors with a small skin depth $\\delta=\\frac{1}{\\sqrt{\\pi f\\mu\\sigma}}$; that little bit of loss is what heats them (Lesson 8.10)."}],"aside":"He called this his least favorite part of the course: Balanis builds the guide modes from A and F, \"and quite honestly I don't know anybody that uses vector potentials to solve waveguides.\" We follow Balanis anyway, quickly."},{"id":"8.2","title":"TE$^z$ modes: $F_z$ and the walls","lec":"L18","viz":"modesTE","hook":"Start general, kill terms with physics, apply the walls.","intuition":"TE$^z$ means no $E_z$. In the general field expressions (6-41, 6-43), $E_z=0$ forces $A_x=A_y=A_z=F_x=F_y=0$, leaving only $F_z$. \"That's the whole point of these vector potentials: we start off with very general solutions and slowly eliminate terms based on the physics of the problem.\"¶Then the walls: $E_x$ is tangential to the bottom and top ($y=0,b$); $E_y$ is tangential to the side walls ($x=0,a$). Two field components, two pairs of walls, which is why TE takes a little more work than TM.","math":[{"t":"Fields from $F_z$ (6-71)","tex":"E_x=-\\frac{1}{\\varepsilon}\\frac{\\partial F_z}{\\partial y},\\quad E_y=\\frac{1}{\\varepsilon}\\frac{\\partial F_z}{\\partial x},\\quad H_z=-j\\frac{1}{\\omega\\mu\\varepsilon}\\left(\\frac{\\partial^2}{\\partial z^2}+\\beta^2\\right)F_z"},{"t":"Separation of variables (8-6)","tex":"F_z=(C_1\\cos\\beta_xx+D_1\\sin\\beta_xx)(C_2\\cos\\beta_yy+D_2\\sin\\beta_yy)\\,A_3e^{-j\\beta_zz}","note":"cos and sin in $x$ and $y$ because the guide is bounded there; a traveling wave in $z$ because it's unbounded. Only the $+z$ term is kept."},{"t":"Bottom wall: $E_x(y=0)=0$","tex":"\\sin 0=0,\\ \\cos 0=1\\ \\Rightarrow\\ D_2=0","note":"(8-10)"},{"t":"Top wall: $E_x(y=b)=0$","tex":"\\sin\\beta_yb=0\\Rightarrow\\beta_y=\\frac{n\\pi}{b},\\ n=0,1,2,\\dots","note":"You can't set $C_2=0$: that's the trivial solution. (8-12)"},{"t":"Side walls give the same with x","tex":"D_1=0,\\qquad \\beta_x=\\frac{m\\pi}{a},\\ m=0,1,2,\\dots","note":"(8-13)"},{"t":"Result","tex":"F_z^{+}=A_{mn}\\cos\\beta_xx\\cos\\beta_yy\\,e^{-j\\beta_zz},\\qquad m=n\\neq0","note":"$m=n=0$ makes $F_z$ a constant, so every transverse field (a derivative) is zero. $A_{mn}$ is set by how much power you launch."}],"example":{"title":"The TE$_{mn}$ fields (8-15)","steps":[["E from the curl","E_x=A_{mn}\\frac{\\beta_y}{\\varepsilon}\\cos\\beta_xx\\sin\\beta_yy\\,e^{-j\\beta_zz},\\qquad E_y=-A_{mn}\\frac{\\beta_x}{\\varepsilon}\\sin\\beta_xx\\cos\\beta_yy\\,e^{-j\\beta_zz}","The derivative turns cos into $-$sin and brings down $\\beta$."],["H from the gradient term","H_x=A_{mn}\\frac{\\beta_x\\beta_z}{\\omega\\mu\\varepsilon}\\sin\\beta_xx\\cos\\beta_yy,\\quad H_y=A_{mn}\\frac{\\beta_y\\beta_z}{\\omega\\mu\\varepsilon}\\cos\\beta_xx\\sin\\beta_yy,\\quad H_z=-jA_{mn}\\frac{\\beta_c^2}{\\omega\\mu\\varepsilon}\\cos\\beta_xx\\cos\\beta_yy","Each times $e^{-j\\beta_zz}$, with $\\frac{\\partial}{\\partial z}\\to-j\\beta_z$ and $\\beta_c^2=\\beta^2-\\beta_z^2$."]]}},{"id":"8.3","title":"TM$^z$ modes: the easy one","lec":"L18","viz":"modesTM","hook":"$E_z$ touches every wall, so one condition does it all.","intuition":"Prather: TM$^z$ is \"the easiest one to solve, because $E_z$ is always tangential to the boundaries.\" One field component, zero on all four walls. That forces sines in both directions, so neither index can be zero.","math":[{"t":"Potential","tex":"\\mathbf A=\\hat zA_z,\\quad E_z=-j\\frac{1}{\\omega\\mu\\varepsilon}\\left(\\frac{\\partial^2}{\\partial z^2}+\\beta^2\\right)A_z\\propto A_z"},{"t":"Walls → sines (8-25)","tex":"A_z=B_{mn}\\sin\\beta_xx\\sin\\beta_yy\\,e^{-j\\beta_zz},\\qquad \\beta_x=\\frac{m\\pi}{a},\\ \\beta_y=\\frac{n\\pi}{b},\\ m,n=1,2,3,\\dots"},{"t":"Fields (8-24)","tex":"H_x=\\frac1\\mu\\frac{\\partial A_z}{\\partial y},\\quad H_y=-\\frac1\\mu\\frac{\\partial A_z}{\\partial x},\\quad E_x=-B\\frac{\\beta_x\\beta_z}{\\omega\\mu\\varepsilon}\\cos\\beta_xx\\sin\\beta_yy,\\quad E_y=-B\\frac{\\beta_y\\beta_z}{\\omega\\mu\\varepsilon}\\sin\\beta_xx\\cos\\beta_yy"}],"aside":"Memory hook (Supplemental): TE is cos·cos because the walls zero the slope of $F_z$; TM is sin·sin because they zero $A_z$ itself."},{"id":"8.4","title":"Cutoff: what fits in the pipe","lec":"L18","viz":"zig","hook":"The longest wavelength that still satisfies the walls.","intuition":"From the separation equation, $\\beta_z=\\sqrt{\\beta^2-\\beta_x^2-\\beta_y^2}$. If the wall-imposed $\\beta_x,\\beta_y$ are too big compared with $\\beta$, the root goes imaginary, $e^{-j\\beta_zz}$ becomes a real decay, and \"I don't propagate any longer, I attenuate.\"¶Prather's picture: the first mode starts at zero on one wall, peaks in the middle, and comes back to zero on the other: half a wavelength across $a$. That's the longest wavelength (lowest frequency) you can fit. Anything longer can't satisfy the walls, so it won't propagate. \"In free space I can have any frequency go any direction. In a waveguide I don't have that freedom.\"","math":[{"t":"The constraint (8-14c)","tex":"\\beta_x^2+\\beta_y^2+\\beta_z^2=\\beta^2=\\omega^2\\mu\\varepsilon"},{"t":"Cutoff (8-16)","tex":"(f_c)_{mn}=\\frac{1}{2\\pi\\sqrt{\\mu\\varepsilon}}\\sqrt{\\left(\\frac{m\\pi}{a}\\right)^2+\\left(\\frac{n\\pi}{b}\\right)^2}"},{"t":"Three regimes (8-17)","tex":"\\beta_z=\\beta\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}:\\quad f>f_c\\ \\text{real};\\quad f=f_c\\ 0;\\quad f<f_c\\ \\beta_z=-j\\alpha_z\\ \\text{(evanescent)}"}],"aside":"Bands he listed: L 1–2, S 2–4, C 4–8, X 8–12, Ku 12–18, K 18–24 (absorbed by the atmosphere, so used for short-range car radar), now 77 GHz car radar. His merry-go-round analogy for absorption: push at the resonant rate and the energy goes into spinning the molecule instead of propagating."},{"id":"8.5","title":"Ordering the modes","lec":"L18","viz":"ladder","hook":"Divide every cutoff by TE$_{10}$'s.","intuition":"Tables 8-1 and 8-2 list each mode's cutoff relative to the dominant TE$_{10}$. The ratio depends only on $a/b$, so one table covers every guide of that shape. Example 8-2 (WR-90, $a/b=2.25$) is the canonical use.","math":[{"t":"Ratio (8-23)","tex":"\\frac{(f_c)_{mn}}{(f_c)_{10}}=\\sqrt{m^2+\\left(n\\frac ab\\right)^2}"},{"t":"Dominant mode","tex":"(f_c)_{10}=\\frac{1}{2a\\sqrt{\\mu\\varepsilon}}=\\frac{c}{2a\\sqrt{\\varepsilon_r}}"}],"example":{"title":"Example 8-2: first 10 modes of WR-90 ($a=2.286$ cm, $b=1.016$ cm, air)","steps":[["Dominant cutoff","(f_c)_{10}=\\frac{3\\times10^8}{2(0.02286)}=6.562\\ \\text{GHz}",""],["Ratios with a/b = 2.25","\\text{TE}_{20}:2,\\ \\text{TE}_{01}:2.25,\\ \\text{TE/TM}_{11}:2.462,\\ \\text{TE}_{30}:3,\\ \\text{TE/TM}_{21}:3.010,\\ \\text{TE/TM}_{31}:3.75",""],["Multiply","13.123,\\ 14.764,\\ 16.156\\ (\\times2),\\ 19.685,\\ 19.753\\ (\\times2),\\ 24.606\\ (\\times2)\\ \\text{GHz}","TE$_{mn}$ and TM$_{mn}$ with $m,n\\ge1$ share a cutoff: degenerate."]]}},{"id":"8.6","title":"Wave impedance","lec":"L18","viz":"zw","hook":"TE sits above $\\eta$, TM below.","intuition":"The ratio of the transverse E to the transverse H: $E_x/H_y$ (equivalently $-E_y/H_x$), the pair whose cross product points down $+z$. All the mode-shape factors cancel, leaving only $\\beta_z$.","math":[{"t":"TE (8-19, 8-20)","tex":"Z_w^{TE}=\\frac{\\omega\\mu}{\\beta_z}=\\frac{\\eta}{\\sqrt{1-(f_c/f)^2}}"},{"t":"TM (8-29)","tex":"Z_w^{TM}=\\frac{\\beta_z}{\\omega\\varepsilon}=\\eta\\sqrt{1-(f_c/f)^2}"}],"aside":"At cutoff TE goes to ∞ and TM to 0; below cutoff both are purely reactive, so no real power flows."},{"id":"8.7","title":"Two plane waves bouncing","lec":"L19","tag":"L19 slides (no transcript)","viz":"zig","hook":"Why $v_p>v$ and $v_g<v$ at the same time.","intuition":"TE$_{10}$ is two uniform plane waves bouncing between the side walls at angle $\\psi$ from the $z$ axis (8-43 to 8-47). As $f$ drops toward $f_c$, $\\psi\\to90^\\circ$: the waves bounce straight across and make no forward progress. Far above cutoff, $\\psi\\to0$ and the guide looks like free space.","math":[{"t":"Angle (8-48)","tex":"\\cos\\psi=\\frac{\\beta_z}{\\beta}=\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}"},{"t":"Velocities (8-52)","tex":"v_p=\\frac{v}{\\cos\\psi}=\\frac{\\omega}{\\beta_z},\\qquad v_g=v\\cos\\psi=\\frac{d\\omega}{d\\beta_z},\\qquad v_pv_g=v^2"},{"t":"Guide wavelength (8-50)","tex":"\\lambda_g=\\frac{2\\pi}{\\beta_z}=\\frac{\\lambda}{\\cos\\psi}"}],"aside":"The slide derivation of $v_g$ differentiates $\\omega^2=v^2(\\beta_z^2+\\beta_c^2)$: $2\\omega\\frac{d\\omega}{d\\beta_z}=2v^2\\beta_z$. Energy and signals move at $v_g$; nothing physical moves at $v_p$."},{"id":"8.8","title":"Designing a guide","lec":"L19","tag":"L19 slides (no transcript)","viz":"ladder","hook":"Put your frequency inside the single-mode band.","intuition":"Pick $a$ so the operating frequency sits safely above TE$_{10}$ cutoff, and $b$ so the next mode stays safely above it. Examples 8-3 and 8-4 are exactly this.","math":[{"t":"Single-mode band","tex":"(f_c)_{10}<f<\\min\\left[(f_c)_{20},(f_c)_{01}\\right]"}],"example":{"title":"Example 8-3: air guide, single TE$_{10}$ at 10 GHz","steps":[["25% above TE10 cutoff","10\\times10^9\\ge1.25\\frac{30\\times10^9}{2a}\\Rightarrow a\\ge1.875\\ \\text{cm}","$c=30\\times10^9$ cm/s."],["Below TE01 cutoff","10\\times10^9\\le0.75\\frac{30\\times10^9}{2b}\\Rightarrow b\\le1.125\\ \\text{cm}","<b>Flag:<\/b> the slide's text says \"35% below\" but its math uses 0.75 (25% below). With 0.65 you'd get $b\\le0.975$ cm. Follow the slide's math; ask him which he means."]]},"example2":{"title":"Example 8-4: TE$_{01}$ dominant ($b>a$), single mode 9–14 GHz","steps":[["TE01 cutoff at 9 GHz","\\frac{30\\times10^9}{2b}=9\\times10^9\\Rightarrow b=1.667\\ \\text{cm}",""],["Next mode TE10 at 14 GHz","\\frac{30\\times10^9}{2a}=14\\times10^9\\Rightarrow a=1.071\\ \\text{cm}","TE$_{02}$ would be at 18 GHz, so TE$_{10}$ is the next one up."]]}},{"id":"8.9","title":"Power carried by a mode","lec":"L19","tag":"L19 slides (no transcript)","viz":null,"hook":"Integrate the Poynting vector over the cross-section.","intuition":"Power down the guide is the $z$-component of $\\frac12\\text{Re}(\\mathbf E\\times\\mathbf H^*)$ integrated over $0\\le x\\le a$, $0\\le y\\le b$ (8-54 to 8-57). The $\\cos^2$ and $\\sin^2$ integrals each give half the side (or the full side when the index is 0), which is where $\\varepsilon_{0m}$, $\\varepsilon_{0n}$ come from.","math":[{"t":"TE power (8-57)","tex":"P_{mn}=|A_{mn}|^2\\frac{\\beta_c^2}{2|\\varepsilon|^2}\\sqrt{\\frac{\\varepsilon}{\\mu}}\\,\\frac{a}{\\varepsilon_{0m}}\\frac{b}{\\varepsilon_{0n}}\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2},\\qquad \\varepsilon_{0p}=\\begin{cases}1&p=0\\\\2&p\\neq0\\end{cases}"},{"t":"TE10 in terms of peak field","tex":"P_{10}=\\frac{E_0^2\\,ab}{4\\eta}\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2},\\qquad E_0=|E_y|_{max}=|A_{10}|\\frac{\\pi}{\\varepsilon a}"}],"example":{"title":"Example 8-5: max power in WR-90 before air breakdown ($3\\times10^6$ V/m) at 9 GHz","steps":[["Peak field sets A10","|E_y|_{max}=A_{10}\\frac{\\pi}{\\varepsilon_0a}=3\\times10^6\\Rightarrow A_{10}=1.933\\times10^{-7}",""],["Cutoff","(f_c)_{10}=6.562\\ \\text{GHz},\\quad \\sqrt{1-(6.562/9)^2}=0.6844",""],["Power","P_{10}=\\frac{(3\\times10^6)^2(0.02286)(0.01016)}{4(120\\pi)}(0.6844)=948.7\\ \\text{kW}","Checked in code: 948.7 kW (η = 120π or 377 Ω both give it).."]]}},{"id":"8.10","title":"Attenuation: walls and filling","lec":"L19","tag":"L19 slides (no transcript)","viz":"atten","hook":"Real walls have skin depth; real dielectrics have loss tangent.","intuition":"Conductor loss: the surface current $\\mathbf J_s=\\hat n\\times\\mathbf H$ flows through a surface resistance $R_s$, dissipating power per length $P_l$; then $\\alpha_c=\\frac{P_l}{2P}$ (8-64). Dielectric loss: let $\\dot\\varepsilon=\\varepsilon'-j\\varepsilon''$ and expand $\\dot\\beta_z$ for small loss (8-72 to 8-74). This is the heat that bowed his waveguide on the ship.","math":[{"t":"Conductor, TE10 (8-69)","tex":"\\alpha_c=\\frac{R_s\\left[1+\\frac{2b}{a}\\left(\\frac{f_c}{f}\\right)^2\\right]}{\\eta b\\sqrt{1-(f_c/f)^2}}\\ \\text{Np/m},\\qquad R_s=\\sqrt{\\frac{\\omega\\mu_0}{2\\sigma}}"},{"t":"Dielectric (8-74, 8-75)","tex":"\\alpha_d\\simeq\\frac{\\sigma_e}{2}\\frac{\\eta}{\\sqrt{1-(f_c/f)^2}}=\\frac{\\varepsilon''}{\\varepsilon'}\\frac{\\pi}{\\lambda}\\frac{\\lambda_g}{\\lambda}"},{"t":"Nepers to dB","tex":"\\text{dB}=8.68\\,\\alpha\\ell"}],"example":{"title":"Example 8-6: polystyrene-filled WR-90 at 6 GHz, $\\tan\\delta=2.55\\times10^{-4}$","steps":[["Wavelengths","\\lambda_0=5\\ \\text{cm},\\quad \\lambda=\\frac{5}{1.6}=3.125\\ \\text{cm}",""],["Cutoff and λg","(f_c)_{10}=\\frac{30\\times10^9}{2(2.286)(1.6)}=4.10\\ \\text{GHz},\\quad \\lambda_g=\\frac{3.125}{\\sqrt{1-(4.10/6)^2}}=4.28\\ \\text{cm}",""],["Attenuation","\\alpha_d=2.55\\times10^{-4}\\,\\frac{\\pi}{3.125}\\,\\frac{4.28}{3.125}=3.511\\times10^{-4}\\ \\text{Np/cm}=0.305\\ \\text{dB/m}","<b>Flags:<\/b> the slide says $b=1.106$ cm (should be 1.016), \"TE01\" where the numbers are TE$_{10}$, and the Np/cm exponent is garbled. The verified value is $3.511\\times10^{-4}$ Np/cm = 30.5×10⁻² dB/m."]]}}],"fm":[{"id":"fm8.1","src":"HW 8.1","topic":"velocities","prompt":"An air-filled WR-90 section is a delay line. Find the length for a 2 μs delay at 10 GHz (dominant mode).","opts":[["Find v_g = c√(1−(f_c/f)²) for TE₁₀, then ℓ = v_g·τ","Delay is distance over the speed of energy, which is v_g."],["Use ℓ = c·τ","Ignores dispersion: the guide is slower than free space for signals."],["Find v_p, then ℓ = v_p·τ","v_p is the phase speed; no energy or signal travels at v_p. Gives 795 m (wrong)."],["Find β_z, then ℓ = 2π/β_z","That's λ_g, a wavelength, not a delay length."]],"a":0,"prob":"8.1"},{"id":"fm8.2","src":"HW 8.2","topic":"cutoff","prompt":"WR-90 filled with polystyrene (ε_r = 2.56). Lowest mode at 10 GHz: f_c, λ_g, Z_w, v_p, v_g.","opts":[["Switch to the medium: v = c/√ε_r, η = η₀/√ε_r, then the TE₁₀ recipe","Every quantity uses the filled medium's v and η."],["Use c and 377 Ω with the filled cutoff","Mixes media; λ_g and Z_w come out wrong."],["Find TM₁₁ first","The lowest mode is TE₁₀ (a > b)."],["Compute √ε_r·(air answers) for everything","Cutoff scales by 1/√ε_r, but λ_g, Z_w don't simply scale."]],"a":0,"prob":"8.2"},{"id":"fm8.3","src":"HW 8.3","topic":"phase","prompt":"Ku-band TE₁₀ guide, 0.622 in × 0.311 in, as a phase shifter: length for 300° at 15 GHz; then the phase if filled with ε_r = 4.","opts":[["Convert a to meters, find β_z, then ℓ = φ/β_z with φ in radians","Phase accumulates as e^{−jβ_z z}."],["ℓ = φ/β with free-space β","The guide's β_z is smaller than β; uses the wrong constant."],["ℓ = (300/360)·λ₀","Same error: free-space wavelength instead of λ_g."],["Find f_c using b = 0.311 in","TE₁₀'s cutoff uses a only."]],"a":0,"prob":"8.3"},{"id":"fm8.4","src":"HW 8.4","topic":"velocities","prompt":"X-band guide (2.286 × 1.026 cm) filled with ε_r = 2.25 as a delay line: length for 2 μs at 10 GHz.","opts":[["v = c/1.5, f_c = v/2a, v_g = v√(1−(f_c/f)²), ℓ = v_g τ","Delay line → v_g, in the filled medium."],["v_g = c√(1−(f_c/f)²) with the filled cutoff","Must use v, not c, in front of the root."],["ℓ = v·τ","Ignores the guide's dispersion."],["Use b = 1.026 cm for the cutoff","TE₁₀ uses a."]],"a":0,"prob":"8.4"},{"id":"fm8.5","src":"HW 8.5","topic":"matching","prompt":"Match an empty X-band guide to a polystyrene-filled one with a quarter-wave section at 10 GHz: its Z_w, ε_r and length.","opts":[["Treat sections as lines with Z = Z_w; Z_Q = √(Z₁Z₃); invert Z_w = η₀/√(ε_r − (f_c0/f)²)","Quarter-wave transformer on wave impedances; the shortcut gives ε_r directly."],["ε_rQ = √(ε_r1 ε_r3) = 1.6","Right for plane waves only; dispersion changes it (correct is 1.532)."],["Z_Q = (Z₁ + Z₃)/2","Quarter-wave matching uses the geometric mean."],["Length = λ₀/4 = 0.75 cm","Use the guide wavelength in the section: λ_g/4 = 0.715 cm."]],"a":0,"prob":"8.5"},{"id":"fm8.6","src":"HW 8.6","topic":"matching","prompt":"Two-section binomial transformer from empty to ε_r = 2.56 X-band guide at 10 GHz.","opts":[["ln(Z_{n+1}/Z_n) = 2^{−N} C(N,n) ln(Z_L/Z₀) with weights 1:2:1, then invert for ε_r","Binomial steps in log impedance."],["Split Z linearly into thirds","Not binomial; poor bandwidth."],["Use one quarter-wave section twice","That's a different (Chebyshev-like) design, not binomial."],["Pick ε_r = 1.28 and 2.0 by eye","Must come from the impedance steps."]],"a":0,"prob":"8.6"},{"id":"fm8.8","src":"HW 8.8","topic":"derivation","prompt":"Parallel plates at y = 0, b. Show E_x = E₀ sin(β_y y)e^{−γz} gives TE_n modes; find eigenvalues, cutoffs, power per unit width.","opts":[["Plug into Helmholtz for γ; E_x = 0 at y = 0, b for β_y; Faraday for H; integrate the Poynting vector over 0 ≤ y ≤ b","The four moves in order."],["Start from F = ẑF_z","Possible, but the problem hands you E_x directly."],["Apply H_x = 0 at the plates","Walls zero tangential E, not H."],["Set n = 0 for the lowest mode","n = 0 makes E_x ≡ 0; lowest is n = 1."]],"a":0,"prob":"8.8"},{"id":"fm8.9","src":"HW 8.9","topic":"cutoff","prompt":"a = 2.25 cm, b = 1.125 cm. Dominant cutoff in air; ε_r to reduce it by 3.","opts":[["f_c = c/2a, then f_c ∝ 1/√ε_r so ε_r = 3² = 9","Cutoff scales with 1/√(με)."],["ε_r = 3","Frequency scales with √ε_r, not ε_r."],["ε_r = 1/3","Wrong direction; a dielectric lowers cutoff."],["Change a to 3a","Dimensions must stay the same."]],"a":0,"prob":"8.9"},{"id":"fm8.10","src":"HW 8.10","topic":"derivation","prompt":"Dielectric rod modeled with PMC walls (tangential H = 0). TE^z modes: BCs, potential, fields, cutoffs, lowest mode.","opts":[["F = ẑF_z; H_z ∝ F_z is tangential to every wall, so F_z itself vanishes: sin·sin, lowest TE₁₁","PMC with TE is the dual of PEC with TM."],["Reuse the PEC TE answer: cos·cos, lowest TE₁₀","PMC flips which field the walls zero."],["Apply E_x = 0 at y = 0, b","That's the PEC condition."],["Use A = ẑA_z","That's TM^z."]],"a":0,"prob":"8.10"},{"id":"fm8.11","src":"HW 8.11","topic":"derivation","prompt":"Repeat 8.10 (PMC walls) for TM^z modes.","opts":[["A = ẑA_z; H_x ∝ ∂A_z/∂y and H_y ∝ ∂A_z/∂x vanish at the walls, so zero slope: cos·cos, lowest TM₁₀","Dual of PEC TE."],["sin·sin, lowest TM₁₁","That's PEC TM."],["TM₁₀ can't exist","True only for metal walls."],["Set E_z = 0 on the walls","PMC doesn't zero tangential E."]],"a":0,"prob":"8.11"},{"id":"fmEx8.2","src":"Example 8-2 (lecture)","topic":"cutoff","prompt":"WR-90 (a = 2.286 cm, b = 1.016 cm), air. List the first 10 TE/TM modes by cutoff.","opts":[["Compute (f_c)₁₀ = c/2a once, then multiply by √(m² + (n·a/b)²) from Table 8-1/8-2","The ratio table does the sorting."],["Compute every mode from scratch in random order","Works but slow and error-prone."],["List TE₁₀, TE₁₁, TE₁₂, …","Sorting by index isn't sorting by frequency."],["Start with TM₁₀","TM₁₀ doesn't exist (PEC)."]],"a":0,"ex":"8.5"},{"id":"fmEx8.3","src":"Example 8-3 (lecture)","topic":"design","prompt":"Design an air guide (a > b) single-mode TE₁₀ at 10 GHz, 25% above TE₁₀ cutoff and below TE₀₁.","opts":[["Write the two inequalities: f ≥ 1.25 f_c10 gives a; f ≤ 0.75 f_c01 gives b","Each inequality pins one dimension."],["Set a = λ/2","That's exactly at cutoff, not 25% above."],["Use TE₂₀ to bound b","TE₂₀ depends on a; the problem names TE₀₁."],["Pick a = 2b and solve once","The two conditions are independent."]],"a":0,"ex":"8.8"},{"id":"fmEx8.5","src":"Example 8-5 (lecture)","topic":"power","prompt":"Max power in air-filled WR-90 at 9 GHz before breakdown at 3×10⁶ V/m.","opts":[["Peak |E_y| = A₁₀π/(εa) sets A₁₀ (or E₀); then P₁₀ = E₀²ab√(1−(f_c/f)²)/(4η)","Breakdown limits the peak field; power follows."],["P = E₀²/(2η)·ab","Ignores the sin² profile and dispersion."],["Use the TM₁₁ power formula","Dominant mode is TE₁₀."],["P = V²/R with V = E₀b","Not a circuit; integrate Poynting."]],"a":0,"ex":"8.9"},{"id":"fmEx8.6","src":"Example 8-6 (lecture)","topic":"attenuation","prompt":"Polystyrene-filled WR-90 at 6 GHz, tan δ = 2.55×10⁻⁴: dielectric attenuation.","opts":[["λ = λ₀/√ε_r, f_c and λ_g in the filling, then α_d = (ε''/ε')(π/λ)(λ_g/λ)","(8-75)."],["Use the conductor formula (8-69)","That's wall loss, not dielectric."],["α_d = tan δ · β","Missing the waveguide factor λ_g/λ."],["Use free-space λ₀ throughout","λ must be in the dielectric."]],"a":0,"ex":"8.10"},{"id":"fmTE","src":"Concept (L18)","topic":"derivation","prompt":"\"Derive the TE^z fields of a rectangular waveguide.\" First move?","opts":[["E_z = 0 ⇒ only F_z survives in (6-41)/(6-43); write E_x, E_y, H from F_z","Start general, kill terms, then separate variables."],["Assume E_y = sin(πx/a) and go","Skips the derivation he asks for."],["Use A = ẑA_z","That's TM^z."],["Apply BCs before writing any solution","You need the general solution first, then the walls give the coefficients."]],"a":0,"ex":"8.2","useMath":true}],"cards":[{"id":"c8.1","topic":"modes","q":"Which mode is dominant in a rectangular guide with a > b?","o":["TE₁₀","TM₁₁","TE₁₁","TE₀₁"],"a":0,"why":"Lowest cutoff uses the longest side: (f_c)₁₀ = 1/(2a√με)."},{"id":"c8.2","topic":"modes","q":"Why doesn't TM₁₀ exist (metal walls)?","o":["A_z ∝ sin(0·y) = 0, so every field vanishes","Its cutoff is infinite","E_z would be nonzero on the wall","It does exist"],"a":0,"why":"TM needs sines in both x and y for E_z = 0 on all walls."},{"id":"c8.3","topic":"modes","q":"Why is TE (metal walls) cos·cos?","o":["E_t is a derivative of F_z, so the walls force zero slope of F_z","H_z must vanish on the walls","Symmetry","Because F is magnetic"],"a":0,"why":"E_x ∝ ∂F_z/∂y vanishes at y = 0, b; E_y ∝ ∂F_z/∂x at x = 0, a."},{"id":"c8.4","topic":"cutoff","q":"Below cutoff, β_z is…","o":["purely imaginary: −jα_z","negative real","zero","equal real and imaginary parts"],"a":0,"why":"The square root of a negative number; the field decays as e^{−α_z z}."},{"id":"c8.5","topic":"impedance","q":"As f → f_c from above, Z_w^TE →","o":["∞","0","η","η/2"],"a":0,"why":"Z^TE = η/√(1−(f_c/f)²)."},{"id":"c8.6","topic":"impedance","q":"As f → ∞, both Z^TE and Z^TM →","o":["η","0","∞","2η"],"a":0,"why":"The waves bounce almost straight down the guide (ψ → 0)."},{"id":"c8.7","topic":"cutoff","q":"Filling the guide with ε_r = 4 makes every cutoff…","o":["halve","double","stay the same","quarter"],"a":0,"why":"f_c ∝ 1/√ε_r."},{"id":"c8.8","topic":"modes","q":"With a = 2b, which modes are degenerate?","o":["TE₂₀ and TE₀₁","TE₁₀ and TE₀₁","TE₁₁ and TM₁₀","none"],"a":0,"why":"Ratio √(m²+(2n)²) = 2 for both."},{"id":"c8.9","topic":"modes","q":"What does m count?","o":["half-cycles across a (along x)","full cycles along z","half-cycles across b","walls touched"],"a":0,"why":"m = 1: zero at a wall, max in the middle, zero at the other wall."},{"id":"c8.10","topic":"velocities","q":"v_p · v_g =","o":["v² of the filling","c² always","1","f λ_g"],"a":0,"why":"v_p = v/cos ψ, v_g = v cos ψ."},{"id":"c8.11","topic":"impedance","q":"Which pair defines Z_w for +z travel?","o":["E_x/H_y (= −E_y/H_x)","E_x/H_x","E_z/H_z","E_y/H_y"],"a":0,"why":"x̂ × ŷ = ẑ."},{"id":"c8.12","topic":"modes","q":"TE₁₀ has which E components?","o":["only E_y","E_x and E_y","E_y and E_z","only E_x"],"a":0,"why":"E_x ∝ β_y = 0 when n = 0; E_z = 0 for TE."},{"id":"c8.13","topic":"modes","q":"TE₁₀ has which H components?","o":["H_x and H_z","only H_y","H_x and H_y","only H_z"],"a":0,"why":"H loops lie flat in the x-z plane."},{"id":"c8.14","topic":"design","q":"WR-90 (a/b = 2.25) single-mode band runs from f_c10 to…","o":["2f_c10 (TE₂₀)","2.25f_c10 (TE₀₁)","2.46f_c10 (TE₁₁)","∞"],"a":0,"why":"Example 8-2: 6.56 to 13.12 GHz."},{"id":"c8.15","topic":"velocities","q":"A waveguide delay line's delay is set by…","o":["v_g","v_p","c","v_p v_g"],"a":0,"why":"τ = ℓ/v_g (HW 8.1, 8.4)."},{"id":"c8.16","topic":"matching","q":"A quarter-wave section between Z₁ and Z₃ needs…","o":["Z_Q = √(Z₁Z₃), length λ_g/4","(Z₁+Z₃)/2, length λ₀/4","ε_rQ = √(ε_r1ε_r3)","Z₁Z₃"],"a":0,"why":"Sections act like lines with Z = Z_w (HW 8.5)."},{"id":"c8.17","topic":"derivation","q":"PMC walls, TE^z modes use…","o":["sin·sin, lowest TE₁₁","cos·cos, lowest TE₁₀","the PEC answer","only m = 0"],"a":0,"why":"H_z ∝ F_z is tangential to every wall (HW 8.10)."},{"id":"c8.18","topic":"derivation","q":"Why is TM^z \"the easiest\" (Prather)?","o":["E_z is tangential to all four walls: one component, one condition","It has no cutoff","It has no H field","It uses F"],"a":0,"why":"TE needs E_x on two walls and E_y on the other two."},{"id":"c8.19","topic":"cutoff","q":"Physically, cutoff is the frequency where…","o":["half a wavelength just fits across a (for TE₁₀)","the walls start conducting","v_g = c","the power is maximum"],"a":0,"why":"The longest wavelength that satisfies the walls (L18)."},{"id":"c8.20","topic":"attenuation","q":"Converting attenuation: 1 Np →","o":["8.68 dB","20 dB","4.34 dB","10 dB"],"a":0,"why":"20 log₁₀ e = 8.686."},{"id":"c8.21","topic":"velocities","q":"At f = f_c, the bounce angle ψ (from z) is…","o":["90°","0°","45°","undefined"],"a":0,"why":"cos ψ = √(1−(f_c/f)²) = 0."},{"id":"c8.22","topic":"design","q":"To get a wide single-mode band you keep…","o":["b ≤ a/2","b = a","b > a","a = λ"],"a":0,"why":"Keeps TE₀₁ at or above TE₂₀."}],"vault":[{"id":"v8.1","name":"Separation constraint","eq":"(8-14c)","tex":"\\beta_x^2+\\beta_y^2+\\beta_z^2=\\beta^2=\\omega^2\\mu\\varepsilon","means":"The wall-quantized transverse wavenumbers and the forward wavenumber share the medium's β.","units":"rad/m","valid":"Source-free, homogeneous filling.","when":"Anytime you need β_z or a cutoff.","topic":"cutoff"},{"id":"v8.2","name":"TE^z potential (PEC)","eq":"(8-15)","tex":"F_z=A_{mn}\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}e^{-j\\beta_zz}","means":"Zero slope at the walls → cosines.","units":"","valid":"m, n = 0,1,2…, not both 0.","when":"\"Derive the TE fields\"; sketching TE patterns.","topic":"modes"},{"id":"v8.3","name":"TM^z potential (PEC)","eq":"(8-25)","tex":"A_z=B_{mn}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}e^{-j\\beta_zz}","means":"Zero value at the walls → sines.","units":"","valid":"m, n = 1,2,3…","when":"\"Derive the TM fields\".","topic":"modes"},{"id":"v8.4","name":"TE fields from F","eq":"(6-71)","tex":"E_x=-\\frac1\\varepsilon\\frac{\\partial F_z}{\\partial y},\\ E_y=\\frac1\\varepsilon\\frac{\\partial F_z}{\\partial x},\\ H_z=-j\\frac{1}{\\omega\\mu\\varepsilon}\\left(\\frac{\\partial^2}{\\partial z^2}+\\beta^2\\right)F_z","means":"E is the quarter-turned gradient of F_z.","units":"V/m, A/m","valid":"TE^z.","when":"Getting fields once F_z is known.","topic":"modes"},{"id":"v8.5","name":"TM fields from A","eq":"(8-24)","tex":"H_x=\\frac1\\mu\\frac{\\partial A_z}{\\partial y},\\ H_y=-\\frac1\\mu\\frac{\\partial A_z}{\\partial x},\\ E_z=-j\\frac{1}{\\omega\\mu\\varepsilon}\\left(\\frac{\\partial^2}{\\partial z^2}+\\beta^2\\right)A_z","means":"H is the quarter-turned gradient of A_z; E_z ∝ A_z.","units":"A/m, V/m","valid":"TM^z.","when":"Getting fields once A_z is known.","topic":"modes"},{"id":"v8.6","name":"Cutoff frequency","eq":"(8-16)","tex":"(f_c)_{mn}=\\frac{1}{2\\pi\\sqrt{\\mu\\varepsilon}}\\sqrt{\\left(\\frac{m\\pi}{a}\\right)^2+\\left(\\frac{n\\pi}{b}\\right)^2}","means":"Below it the mode can't satisfy the walls and propagate.","units":"Hz","valid":"Same for TE and TM; indices differ.","when":"First move on every numbers problem.","topic":"cutoff"},{"id":"v8.7","name":"Cutoff ratio","eq":"(8-23)","tex":"\\frac{(f_c)_{mn}}{(f_c)_{10}}=\\sqrt{m^2+\\left(n\\frac ab\\right)^2}","means":"Sort modes for any guide with the same a/b.","units":"—","valid":"Tables 8-1, 8-2.","when":"\"List the first N modes\".","topic":"cutoff"},{"id":"v8.8","name":"Propagation constant","eq":"(8-17)","tex":"\\beta_z=\\beta\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}","means":"Real above cutoff, −jα below.","units":"rad/m","valid":"Lossless.","when":"Phase shift, λ_g, evanescent decay.","topic":"cutoff"},{"id":"v8.9","name":"TE wave impedance","eq":"(8-20)","tex":"Z_w^{TE}=\\frac{\\omega\\mu}{\\beta_z}=\\frac{\\eta}{\\sqrt{1-(f_c/f)^2}}","means":"Above η; ∞ at cutoff.","units":"Ω","valid":"f > f_c (real).","when":"Matching, power, E/H ratios.","topic":"impedance"},{"id":"v8.10","name":"TM wave impedance","eq":"(8-29)","tex":"Z_w^{TM}=\\frac{\\beta_z}{\\omega\\varepsilon}=\\eta\\sqrt{1-(f_c/f)^2}","means":"Below η; 0 at cutoff.","units":"Ω","valid":"f > f_c.","when":"TM modes.","topic":"impedance"},{"id":"v8.11","name":"Guide wavelength","eq":"(8-50)","tex":"\\lambda_g=\\frac{2\\pi}{\\beta_z}=\\frac{\\lambda}{\\sqrt{1-(f_c/f)^2}}","means":"Always longer than λ in the medium.","units":"m","valid":"f > f_c.","when":"Quarter-wave sections, phase per length.","topic":"velocities"},{"id":"v8.12","name":"Phase and group velocity","eq":"(8-52)","tex":"v_p=\\frac{v}{\\sqrt{1-(f_c/f)^2}},\\quad v_g=v\\sqrt{1-(f_c/f)^2},\\quad v_pv_g=v^2","means":"Energy moves at v_g < v.","units":"m/s","valid":"Lossless, f > f_c.","when":"Delay lines (v_g).","topic":"velocities"},{"id":"v8.13","name":"Bounce angle","eq":"(8-48)","tex":"\\cos\\psi=\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}","means":"Angle of the two plane waves from the z axis.","units":"rad","valid":"TE₁₀ picture.","when":"Explaining cutoff physically.","topic":"velocities"},{"id":"v8.14","name":"Evanescent decay","eq":"(8-17c)","tex":"\\alpha_z=\\beta\\sqrt{\\left(\\frac{f_c}{f}\\right)^2-1}","means":"Field decays as e^{−α_z z} below cutoff.","units":"Np/m","valid":"f < f_c.","when":"Attenuation of a cutoff mode.","topic":"cutoff"},{"id":"v8.15","name":"TE10 power","eq":"(8-57)","tex":"P_{10}=\\frac{E_0^2ab}{4\\eta}\\sqrt{1-(f_c/f)^2}","means":"Peak E_y = E₀ at x = a/2.","units":"W","valid":"TE₁₀, lossless.","when":"Breakdown-limited power (Ex 8-5).","topic":"power"},{"id":"v8.16","name":"Conductor attenuation TE10","eq":"(8-69)","tex":"\\alpha_c=\\frac{R_s[1+\\frac{2b}{a}(f_c/f)^2]}{\\eta b\\sqrt{1-(f_c/f)^2}}","means":"Wall loss through surface resistance.","units":"Np/m","valid":"Good conductor walls, TE₁₀.","when":"Wall loss questions.","topic":"attenuation"},{"id":"v8.17","name":"Dielectric attenuation","eq":"(8-75)","tex":"\\alpha_d\\simeq\\frac{\\varepsilon''}{\\varepsilon'}\\frac{\\pi}{\\lambda}\\frac{\\lambda_g}{\\lambda}","means":"Loss tangent times a dispersion factor.","units":"Np/m","valid":"Small loss, λ in the dielectric.","when":"Lossy fillings (Ex 8-6).","topic":"attenuation"},{"id":"v8.18","name":"Wave impedance shortcut","eq":"Supplemental","tex":"Z_w^{TE}=\\frac{\\eta_0}{\\sqrt{\\varepsilon_r-(f_{c0}/f)^2}},\\quad \\lambda_g=\\frac{\\lambda_0}{\\sqrt{\\varepsilon_r-(f_{c0}/f)^2}}","means":"f_c0 = air cutoff; filling only changes ε_r under the root.","units":"Ω, m","valid":"TE₁₀, μ_r = 1.","when":"Matching sections (HW 8.5, 8.6).","topic":"matching","supp":true},{"id":"v8.19","name":"Binomial transformer","eq":"Supplemental","tex":"\\ln\\frac{Z_{n+1}}{Z_n}=2^{-N}\\binom Nn\\ln\\frac{Z_L}{Z_0}","means":"Steps in log impedance with binomial weights.","units":"","valid":"Small reflections.","when":"HW 8.6.","topic":"matching","supp":true}],"problems":[{"id":"8.1","src":"HW 8.1","tag":"delay line · v_g","st":"An air-filled section of an X-band (8.2–12.4 GHz) rectangular waveguide of length $\\ell$ is used as a delay line. The inside dimensions are 0.9 in. (2.286 cm) by 0.4 in. (1.016 cm) and it operates in its dominant mode. Determine its length so that the delay at 10 GHz is 2 μs.","pic":"A pulse rides down the guide at the <b>group velocity<\/b>, the speed of energy and signals. So the delay is just distance over speed: $\\tau=\\ell/v_g$. In the bouncing-plane-wave picture, $v_g=v\\cos\\psi$ is the forward part of the zigzag.","first":"Delay means $v_g$. Get $(f_c)_{10}$, form $\\sqrt{1-(f_c/f)^2}$, then $\\ell=v_g\\tau$.","steps":[["Dominant mode is TE$_{10}$; only $a$ matters","(f_c)_{10}=\\frac{c}{2a}=\\frac{3\\times10^8}{2(0.02286)}=6.562\\ \\text{GHz}","$b$ never enters TE$_{10}$'s cutoff. 10 GHz is above 6.562 GHz, so the mode propagates."],["The one number everything uses","\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}=\\sqrt{1-\\left(\\frac{6.562}{10}\\right)^2}=0.7546","Compute it once and reuse it."],["Group velocity (8-52)","v_g=c\\sqrt{1-(f_c/f)^2}=3\\times10^8(0.7546)=2.264\\times10^8\\ \\text{m/s}","$v_g<c$: signals slow down in a guide."],["Length from the delay","\\ell=v_g\\,\\tau=(2.264\\times10^8)(2\\times10^{-6})=\\boxed{452.8\\ \\text{m}}","A real delay line would be coiled up. The point is that the dispersion slows the signal."]],"ans":[["ℓ",452.8,"m"]],"trap":"Using $v_p$ gives 795 m, and using $c$ gives 600 m. Delay is always $v_g$.","topic":"delay line · v_g"},{"id":"8.2","src":"HW 8.2","tag":"dielectric-filled · all five","st":"A standard X-band rectangular waveguide, 0.9 in. (2.286 cm) by 0.4 in. (1.016 cm), is filled with lossless polystyrene ($\\varepsilon_r=2.56$). For the lowest-order mode, determine at 10 GHz: (a) cutoff frequency (GHz); (b) guide wavelength (cm); (c) wave impedance; (d) phase velocity (m/s); (e) group velocity (m/s).","pic":"Filling the guide slows light inside it: $v=c/\\sqrt{\\varepsilon_r}=c/1.6$. Every cutoff drops by the factor 1.6, and the medium's own impedance drops to $\\eta=120\\pi/1.6$.","first":"Swap $c\\to v=c/\\sqrt{\\varepsilon_r}$ and $\\eta_0\\to\\eta=\\eta_0/\\sqrt{\\varepsilon_r}$, then use the standard TE$_{10}$ recipe.","steps":[["Medium constants","v=\\frac{3\\times10^8}{\\sqrt{2.56}}=1.875\\times10^8\\ \\text{m/s},\\quad \\eta=\\frac{120\\pi}{1.6}=235.6\\ \\Omega,\\quad \\lambda=\\frac vf=1.875\\ \\text{cm}","$\\sqrt{2.56}=1.6$ exactly. Remember this, it shows up in 8.5 and 8.6 too."],["(a) Cutoff","(f_c)_{10}=\\frac{v}{2a}=\\frac{1.875\\times10^8}{2(0.02286)}=\\boxed{4.101\\ \\text{GHz}}","Same as the air value $6.562/1.6$."],["The square root","\\sqrt{1-(4.101/10)^2}=0.9120",""],["(b) Guide wavelength","\\lambda_g=\\frac{\\lambda}{\\sqrt\\cdot}=\\frac{1.875}{0.9120}=\\boxed{2.056\\ \\text{cm}}","Use the wavelength <i>in the dielectric<\/i>, not 3 cm."],["(c) Wave impedance (TE)","Z_w=\\frac{\\eta}{\\sqrt\\cdot}=\\frac{235.6}{0.9120}=\\boxed{258.3\\ \\Omega}","TE impedance is above the medium's $\\eta$ (235.6), not above 377."],["(d), (e) Velocities","v_p=\\frac{v}{\\sqrt\\cdot}=\\boxed{2.056\\times10^8\\ \\text{m/s}},\\qquad v_g=v\\sqrt\\cdot=\\boxed{1.710\\times10^8\\ \\text{m/s}}","Check: $v_pv_g=v^2=(1.875\\times10^8)^2$."]],"ans":[["f_c",4.101,"GHz"],["λ_g",2.056,"cm"],["Z_w",258.3,"Ω"],["v_p",2.056,"×10⁸ m/s"],["v_g",1.71,"×10⁸ m/s"]],"trap":"Mixing media: using $\\lambda_0=3$ cm or $\\eta_0=377$ Ω with the dielectric's cutoff.","topic":"dielectric-filled · all five"},{"id":"8.3","src":"HW 8.3","tag":"phase shifter · β_z ℓ","st":"A Ku-band (12.4–18 GHz) lossless rectangular waveguide, TE$_{10}$, inner dimensions 0.622 in. by 0.311 in., is used as a phase shifter at 15 GHz. (a) Air-filled: what length (cm) gives a total phase of 300°? (b) Same length, now completely filled with a lossless dielectric of dielectric constant 4: what is the total phase shift (degrees) at 15 GHz?","pic":"Phase accumulates as $e^{-j\\beta_zz}$, so a section of length $\\ell$ adds a phase $\\phi=\\beta_z\\ell$. Filling the guide raises $\\beta_z$ (the wave gets slower and shorter), so the same length gives more phase.","first":"Convert the inches to meters, find $\\beta_z$, then $\\ell=\\phi/\\beta_z$ with $\\phi$ in radians.","steps":[["Units first","a=0.622\\ \\text{in}=0.622(2.54)=1.580\\ \\text{cm}","The 0.311 in. side is irrelevant for TE$_{10}$."],["(a) Air: cutoff and β","(f_c)_{10}=\\frac{3\\times10^8}{2(0.0158)}=9.494\\ \\text{GHz},\\qquad \\beta=\\frac{2\\pi f}{c}=314.16\\ \\text{rad/m}",""],["(a) β_z","\\beta_z=\\beta\\sqrt{1-(9.494/15)^2}=314.16(0.7742)=243.2\\ \\text{rad/m}",""],["(a) Length","\\ell=\\frac{\\phi}{\\beta_z}=\\frac{300\\cdot\\pi/180}{243.2}=\\frac{5.236}{243.2}=\\boxed{2.153\\ \\text{cm}}","Degrees go to radians before you divide."],["(b) Filled, ε_r = 4","(f_c)_{10}=\\frac{9.494}{2}=4.747\\ \\text{GHz},\\quad \\beta=2(314.16)=628.3,\\quad \\beta_z=628.3\\sqrt{1-(4.747/15)^2}=596.0\\ \\text{rad/m}","$\\sqrt{\\varepsilon_r}=2$ halves the cutoff and doubles $\\beta$."],["(b) Phase","\\phi=\\beta_z\\ell=596.0(0.02153)=12.83\\ \\text{rad}=\\boxed{735.2^\\circ}","Equivalently $2(360^\\circ)+15.2^\\circ$. Give the total; mention the mod-360 value if you like."]],"ans":[["ℓ",2.153,"cm"],["φ (b)",735.2,"°"]],"trap":"Forgetting the inches-to-cm conversion, or leaving 300 in degrees.","topic":"phase shifter · β_z ℓ"},{"id":"8.4","src":"HW 8.4","tag":"delay line · filled","st":"An X-band rectangular waveguide, 2.286 cm by 1.026 cm, filled with a dielectric of dielectric constant 2.25, is used as a delay line. What length (m) gives a total delay of 2 μs at 10 GHz?","pic":"Same physics as 8.1, but slower: the dielectric drops $v$ to $c/1.5$, which lowers the cutoff and changes $v_g$.","first":"$v=c/\\sqrt{2.25}=2\\times10^8$, then $f_c$, then $v_g$, then $\\ell=v_g\\tau$.","steps":[["Medium","v=\\frac{3\\times10^8}{1.5}=2\\times10^8\\ \\text{m/s}",""],["Cutoff","(f_c)_{10}=\\frac{v}{2a}=\\frac{2\\times10^8}{2(0.02286)}=4.374\\ \\text{GHz}",""],["Group velocity","v_g=v\\sqrt{1-(4.374/10)^2}=2\\times10^8(0.8992)=1.798\\times10^8\\ \\text{m/s}",""],["Length","\\ell=v_g\\tau=(1.798\\times10^8)(2\\times10^{-6})=\\boxed{359.7\\ \\text{m}}","Shorter than 8.1's 452.8 m: the filled guide is slower, so less length gives the same delay."]],"ans":[["ℓ",359.7,"m"]],"trap":"Using $c$ instead of $v$ in $v_g=v\\sqrt\\cdot$.","topic":"delay line · filled"},{"id":"8.5","src":"HW 8.5","tag":"quarter-wave match","st":"An empty X-band guide (2.286 cm by 1.016 cm) is connected to an identical guide filled with polystyrene ($\\varepsilon_r=2.56$). To avoid reflections, a quarter-wavelength section of the same guide is inserted between them. Dominant mode, matching at 10 GHz. Find: (a) the wave impedance of the quarter-wave section; (b) the dielectric constant that must fill it; (c) its length (cm).","pic":"Treat each guide section as a transmission line whose characteristic impedance is its <b>wave impedance<\/b> $Z_w$. A $\\lambda_g/4$ section with $Z_Q=\\sqrt{Z_1Z_3}$ cancels the reflection, exactly like a quarter-wave transformer on a line.","first":"Find $Z_w$ on each side, take the geometric mean, then solve for the $\\varepsilon_r$ that gives that impedance.","steps":[["The shortcut that makes 8.5 and 8.6 easy","Z_w=\\frac{\\eta_0/\\sqrt{\\varepsilon_r}}{\\sqrt{1-\\frac{f_{c0}^2}{\\varepsilon_rf^2}}}=\\frac{\\eta_0}{\\sqrt{\\varepsilon_r-(f_{c0}/f)^2}},\\qquad \\lambda_g=\\frac{\\lambda_0}{\\sqrt{\\varepsilon_r-(f_{c0}/f)^2}}","$f_{c0}=6.562$ GHz is the <b>air<\/b> cutoff, so $(f_{c0}/f)^2=0.4306$ for every section. Filling just changes $\\varepsilon_r$ under the root."],["Both ends","Z_1=\\frac{377}{\\sqrt{1-0.4306}}=499.6\\ \\Omega,\\qquad Z_3=\\frac{377}{\\sqrt{2.56-0.4306}}=258.3\\ \\Omega","$Z_3$ matches 8.2(c)."],["(a) Quarter-wave impedance","Z_Q=\\sqrt{Z_1Z_3}=\\sqrt{(499.6)(258.3)}=\\boxed{359.3\\ \\Omega}",""],["(b) Solve for ε_r","\\varepsilon_r=\\left(\\frac{f_{c0}}{f}\\right)^2+\\left(\\frac{\\eta_0}{Z_Q}\\right)^2=0.4306+\\left(\\frac{377}{359.3}\\right)^2=\\boxed{1.532}","Invert the shortcut. Using $\\eta_0=120\\pi=376.99$."],["(c) Length","\\lambda_g=\\frac{3\\ \\text{cm}}{\\sqrt{1.532-0.4306}}=2.859\\ \\text{cm}\\ \\Rightarrow\\ \\frac{\\lambda_g}{4}=\\boxed{0.715\\ \\text{cm}}","The quarter wavelength is measured in the guide, $\\lambda_g$, not free space."]],"ans":[["Z_Q",359.3,"Ω"],["ε_r",1.532,""],["length",0.715,"cm"]],"trap":"Taking $\\sqrt{\\varepsilon_{r1}\\varepsilon_{r3}}=1.6$ as the answer. That would be right for plane waves, but the guide's dispersion makes it 1.532.","topic":"quarter-wave match"},{"id":"8.6","src":"HW 8.6","tag":"binomial transformer","st":"Design a two-section binomial impedance transformer to match an empty ($\\varepsilon_r=1$) X-band guide to a dielectric-filled ($\\varepsilon_r=2.56$) X-band guide, using two quarter-wave sections. Dominant mode, $f_0=10$ GHz, 2.286 cm by 1.016 cm. Find: (a) the wave impedance of each section; (b) their dielectric constants; (c) the length (cm) of each section.","pic":"Instead of one big step, take two smaller steps whose sizes follow the binomial coefficients 1 : 2 : 1. That flattens the reflection around $f_0$ (a wider band than one quarter-wave section).","first":"Binomial with $N=2$: $\\ln\\frac{Z_{n+1}}{Z_n}=2^{-N}\\binom Nn\\ln\\frac{Z_L}{Z_0}$. The weights are $\\tfrac14,\\tfrac24,\\tfrac14$.","steps":[["End impedances (from 8.5)","Z_0=499.6\\ \\Omega,\\quad Z_L=258.3\\ \\Omega,\\quad \\ln\\frac{Z_L}{Z_0}=-0.6595",""],["(a) First section","Z_1=Z_0\\,e^{-0.6595/4}=499.6(0.8480)=\\boxed{423.6\\ \\Omega}","Weight $\\binom20/4=\\tfrac14$."],["(a) Second section","Z_2=Z_1\\,e^{-0.6595/2}=423.6(0.7191)=\\boxed{304.6\\ \\Omega}","Weight $\\binom21/4=\\tfrac24$. Check: $Z_2e^{-0.6595/4}=258.3=Z_L$ ✓."],["(b) Dielectric constants","\\varepsilon_{r}=0.4306+\\left(\\frac{377}{Z}\\right)^2:\\quad \\varepsilon_{r1}=\\boxed{1.222},\\quad \\varepsilon_{r2}=\\boxed{1.962}","Same inversion as 8.5(b). They step up 1 → 1.22 → 1.96 → 2.56."],["(c) Lengths","\\frac{\\lambda_{g1}}{4}=\\frac{3/\\sqrt{1.222-0.4306}}{4}=\\boxed{0.843\\ \\text{cm}},\\qquad \\frac{\\lambda_{g2}}{4}=\\frac{3/\\sqrt{1.962-0.4306}}{4}=\\boxed{0.606\\ \\text{cm}}","Each section is a quarter of <i>its own<\/i> guide wavelength. (The figure's \"ε = 256\" is a typo for 2.56.)"]],"ans":[["Z₁",423.6,"Ω"],["Z₂",304.6,"Ω"],["ε_r1",1.222,""],["ε_r2",1.962,""],["ℓ₁",0.843,"cm"],["ℓ₂",0.606,"cm"]],"trap":"Splitting the impedances linearly or by thirds. Binomial means the logs go 1 : 2 : 1.","topic":"binomial transformer"},{"id":"8.8","src":"HW 8.8","tag":"parallel plate · derivation","st":"A parallel-plate waveguide is formed by infinite planar conductors at $y=0$ and $y=b$. (a) Show that $E_x=E_0\\sin(\\beta_yy)e^{-\\gamma z}$ defines a set of TE$_n$ modes where $\\gamma=\\sqrt{\\beta_y^2-\\beta_0^2}$, $\\beta_0=\\omega\\sqrt{\\mu_0\\varepsilon_0}$. (b) Find the allowable eigenvalues, cutoff frequencies, and power transmitted per unit width in the $x$ direction.","pic":"Two plates, no side walls. $E_x$ is parallel to both plates, so it must vanish at $y=0$ and $y=b$. That's the rectangular guide with $a\\to\\infty$: only $n$ survives.","first":"Plug $E_x$ into the Helmholtz equation to get $\\gamma$; apply $E_x=0$ at the plates to get $\\beta_y$; use Faraday for $H$; integrate the Poynting vector over $0\\le y\\le b$.","steps":[["(a) Helmholtz","\\frac{\\partial^2E_x}{\\partial y^2}+\\frac{\\partial^2E_x}{\\partial z^2}+\\beta_0^2E_x=(-\\beta_y^2+\\gamma^2+\\beta_0^2)E_x=0\\ \\Rightarrow\\ \\gamma=\\sqrt{\\beta_y^2-\\beta_0^2}","No $x$ dependence (infinite plates). $\\frac{\\partial}{\\partial z}\\to-\\gamma$."],["(a) Why TE","E_z=0\\ (\\text{only }E_x),\\quad \\text{so the field is transverse electric to }z","Only the index $n$ (from $y$) appears, hence TE$_n$."],["(b) Plate condition → eigenvalues","E_x(y=0)=0\\ \\checkmark,\\qquad E_x(y=b)=0\\Rightarrow\\sin\\beta_yb=0\\Rightarrow \\boxed{\\beta_y=\\frac{n\\pi}{b},\\ n=1,2,3,\\dots}","$n=0$ makes $E_x\\equiv0$, so it is not a mode."],["(b) Cutoff","\\gamma=0\\ \\Rightarrow\\ \\beta_0=\\frac{n\\pi}{b}\\ \\Rightarrow\\ \\boxed{(f_c)_n=\\frac{n}{2b\\sqrt{\\mu_0\\varepsilon_0}}=\\frac{nc}{2b}}","Above cutoff $\\gamma=j\\beta_z$, $\\beta_z=\\beta_0\\sqrt{1-(f_c/f)^2}$; below, $\\gamma$ is real and the mode decays."],["(b) H from Faraday","H_y=-\\frac{1}{j\\omega\\mu_0}\\frac{\\partial E_x}{\\partial z}=\\frac{\\gamma}{j\\omega\\mu_0}E_x\\ \\xrightarrow{\\gamma=j\\beta_z}\\ \\frac{\\beta_z}{\\omega\\mu_0}E_x,\\qquad H_z=\\frac{1}{j\\omega\\mu_0}\\frac{\\partial E_x}{\\partial y}","$\\nabla\\times\\mathbf E=-j\\omega\\mu_0\\mathbf H$ with $\\mathbf E=\\hat xE_x(y,z)$. Note $E_x/H_y=\\omega\\mu_0/\\beta_z=Z^{TE}$."],["(b) Power per unit width","\\frac{P}{w}=\\int_0^b\\tfrac12\\text{Re}(E_xH_y^*)\\,dy=\\frac{\\beta_z}{2\\omega\\mu_0}E_0^2\\int_0^b\\sin^2\\frac{n\\pi y}{b}dy=\\boxed{\\frac{\\beta_zb}{4\\omega\\mu_0}E_0^2=\\frac{bE_0^2}{4\\eta_0}\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}}","$\\int_0^b\\sin^2=b/2$. Below cutoff $H_y$ is 90° out of phase with $E_x$, so the real power is zero."]],"ans":[],"trap":"Including $n=0$ (it's the TEM mode only for $E_y$, not this $E_x$ family), or forgetting the $b/2$ from the $\\sin^2$ integral.","topic":"parallel plate · derivation"},{"id":"8.9","src":"HW 8.9","tag":"dielectric loading","st":"A rectangular waveguide with $a=2.25$ cm and $b=1.125$ cm operates in the dominant mode. (a) With free space inside, find the cutoff frequency of the dominant mode. (b) Keeping the dimensions, we want to reduce the dominant-mode cutoff by a factor of 3. What dielectric constant must fill the guide?","pic":"$f_c\\propto 1/\\sqrt{\\mu\\varepsilon}$. Shrinking the cutoff by 3 means slowing light inside by 3.","first":"$(f_c)_{10}=c/(2a)$, then $f_c'=f_c/\\sqrt{\\varepsilon_r}$.","steps":[["(a) Cutoff","(f_c)_{10}=\\frac{3\\times10^8}{2(0.0225)}=\\boxed{6.667\\ \\text{GHz}}","$a=2b$ here, so TE$_{20}$ and TE$_{01}$ would be degenerate at 13.33 GHz."],["(b) Scale","\\frac{f_c}{f_c'}=\\sqrt{\\varepsilon_r}=3\\ \\Rightarrow\\ \\boxed{\\varepsilon_r=9}","Factor 3 in frequency is factor 9 in $\\varepsilon_r$. New cutoff 2.222 GHz."]],"ans":[["f_c",6.667,"GHz"],["ε_r",9,""]],"trap":"Answering $\\varepsilon_r=3$. The cutoff scales with $\\sqrt{\\varepsilon_r}$.","topic":"dielectric loading"},{"id":"8.10","src":"HW 8.10","tag":"PMC walls · TE^z","st":"For a very high-permittivity dielectric rod, model the surface as a perfect magnetic conductor (PMC): tangential H vanishes. For a rectangular cross-section ($a\\times b$) and TE$^z$ modes: (a) write all boundary conditions on E and H; (b) derive simplified expressions for the vector potential, the fields, and the cutoff frequencies; (c) if $a>b$, identify the lowest-order mode.","pic":"PMC is the dual of PEC: instead of killing tangential E, the walls kill tangential H (and normal E). So TE$^z$ with PMC walls behaves like TM$^z$ with metal walls: <b>sin·sin<\/b>. Flip the wall switch in the Modes tab to see it.","first":"$\\mathbf F=\\hat zF_z$. Since $H_z\\propto F_z$ is tangential to every wall, $F_z$ itself must vanish there, so you get sines.","steps":[["(a) Boundary conditions","x=0,a:\\ H_y=H_z=0,\\ E_x=0\\qquad y=0,b:\\ H_x=H_z=0,\\ E_y=0","PMC: $\\hat n\\times\\mathbf H=0$ (tangential H) and $\\hat n\\cdot\\mathbf D=0$ (normal E). The dual of PEC's $\\hat n\\times\\mathbf E=0$, $\\hat n\\cdot\\mathbf B=0$."],["(b) Potential","H_z=-j\\frac{\\beta_c^2}{\\omega\\mu\\varepsilon}F_z=0\\text{ on all walls}\\Rightarrow \\boxed{F_z=A_{mn}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}e^{-j\\beta_zz},\\ m,n=1,2,\\dots}","A zero index makes $F_z\\equiv0$."],["(b) E fields","E_x=-\\frac1\\varepsilon\\frac{\\partial F_z}{\\partial y}=-A\\frac{\\beta_y}{\\varepsilon}\\sin\\beta_xx\\cos\\beta_yy\\,e^{-j\\beta_zz},\\quad E_y=\\frac1\\varepsilon\\frac{\\partial F_z}{\\partial x}=A\\frac{\\beta_x}{\\varepsilon}\\cos\\beta_xx\\sin\\beta_yy\\,e^{-j\\beta_zz},\\quad E_z=0","Check: $E_x$ (normal to $x$ walls) has $\\sin\\beta_xx$ → 0 at $x=0,a$ ✓."],["(b) H fields","H_x=-A\\frac{\\beta_x\\beta_z}{\\omega\\mu\\varepsilon}\\cos\\beta_xx\\sin\\beta_yy,\\quad H_y=-A\\frac{\\beta_y\\beta_z}{\\omega\\mu\\varepsilon}\\sin\\beta_xx\\cos\\beta_yy,\\quad H_z=-jA\\frac{\\beta_c^2}{\\omega\\mu\\varepsilon}\\sin\\beta_xx\\sin\\beta_yy","All times $e^{-j\\beta_zz}$, with $\\beta_x=m\\pi/a$, $\\beta_y=n\\pi/b$, $\\beta_c^2=\\beta_x^2+\\beta_y^2$. Verified against both curl equations."],["(b) Cutoff","(f_c)_{mn}=\\frac{1}{2\\pi\\sqrt{\\mu\\varepsilon}}\\sqrt{\\left(\\frac{m\\pi}{a}\\right)^2+\\left(\\frac{n\\pi}{b}\\right)^2},\\quad m,n=1,2,\\dots","Same formula; only the allowed indices change."],["(c) Lowest mode","\\boxed{\\text{TE}^z_{11}}","Both indices must be at least 1."]],"ans":[],"trap":"Reusing the PEC cos·cos answer. Ask which field the walls zero, then whether that's $F_z$ itself or its slope.","topic":"PMC walls · TE^z"},{"id":"8.11","src":"HW 8.11","tag":"PMC walls · TM^z","st":"Repeat Problem 8.10 for TM$^z$ modes.","pic":"The dual of the PEC TE case: TM$^z$ with PMC walls is <b>cos·cos<\/b>, and an index of 0 is allowed.","first":"$\\mathbf A=\\hat zA_z$. Now $H_x\\propto\\frac{\\partial A_z}{\\partial y}$ and $H_y\\propto\\frac{\\partial A_z}{\\partial x}$ must vanish, so the <b>slope<\/b> of $A_z$ is zero at the walls: cosines.","steps":[["(a) Boundary conditions","x=0,a:\\ H_y=0,\\ E_x=0\\qquad y=0,b:\\ H_x=0,\\ E_y=0\\qquad (H_z=0\\text{ everywhere for TM}^z)","Same PMC rules as 8.10."],["(b) Potential","\\frac{\\partial A_z}{\\partial x}\\Big|_{x=0,a}=0,\\ \\frac{\\partial A_z}{\\partial y}\\Big|_{y=0,b}=0\\Rightarrow\\boxed{A_z=B_{mn}\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}e^{-j\\beta_zz}}","$m,n=0,1,2,\\dots$, not both 0 (a constant $A_z$ gives no transverse H and $\\beta_c=0$ gives $E_z=0$)."],["(b) H fields","H_x=\\frac1\\mu\\frac{\\partial A_z}{\\partial y}=-B\\frac{\\beta_y}{\\mu}\\cos\\beta_xx\\sin\\beta_yy,\\qquad H_y=-\\frac1\\mu\\frac{\\partial A_z}{\\partial x}=B\\frac{\\beta_x}{\\mu}\\sin\\beta_xx\\cos\\beta_yy,\\qquad H_z=0",""],["(b) E fields","E_x=B\\frac{\\beta_x\\beta_z}{\\omega\\mu\\varepsilon}\\sin\\beta_xx\\cos\\beta_yy,\\quad E_y=B\\frac{\\beta_y\\beta_z}{\\omega\\mu\\varepsilon}\\cos\\beta_xx\\sin\\beta_yy,\\quad E_z=-jB\\frac{\\beta_c^2}{\\omega\\mu\\varepsilon}\\cos\\beta_xx\\cos\\beta_yy","From $E=-j\\frac{1}{\\omega\\mu\\varepsilon}\\nabla(\\nabla\\cdot\\mathbf A)-j\\omega\\mathbf A$, all times $e^{-j\\beta_zz}$. Verified against both curl equations."],["(b) Cutoff","(f_c)_{mn}=\\frac{1}{2\\pi\\sqrt{\\mu\\varepsilon}}\\sqrt{\\left(\\frac{m\\pi}{a}\\right)^2+\\left(\\frac{n\\pi}{b}\\right)^2},\\quad m,n=0,1,\\dots\\ (\\text{not both }0)",""],["(c) Lowest mode","a>b:\\quad\\boxed{\\text{TM}^z_{10}},\\quad f_c=\\frac{1}{2a\\sqrt{\\mu\\varepsilon}}","The exact dual of PEC's TE$_{10}$."]],"ans":[],"trap":"Saying TM$_{10}$ can't exist. That's true for metal walls only. With PMC the rules swap.","topic":"PMC walls · TM^z"}],"topics":{"cutoff":"Cutoff & propagation","modes":"Mode fields","impedance":"Wave impedance","velocities":"Velocities & delay","phase":"Phase","matching":"Matching sections","derivation":"Derivations","design":"Design","power":"Power","attenuation":"Attenuation"}},{"id":"ch11","num":11,"title":"Scattering","short":"Scattering","color":"#F2668A","lectures":"L17","status":"coming","note":"Partly lectured · next batch (Exam 2)"},{"id":"ant","num":"ANT","title":"Antenna Theory · Ch. 1–4, 6","short":"Antennas","color":"#78D58C","lectures":"Upcoming","status":"coming","note":"Not yet lectured"}],"events":[{"title":"HW 9 quiz","scope":"Ch. 8 rectangular waveguides · last 10 min of class","at":"2026-11-05T12:15:00-05:00"},{"title":"Exam 2","scope":"EM Ch. 6, 8, 11 + ANT 1–4, 6 (as lectured)","at":"2026-11-19T11:10:00-05:00"},{"title":"Final exam","scope":"All chapters · 6 questions · Gore 310","at":"2026-12-10T11:30:00-05:00"}]};</script>
<script>/* MAXWELL interactive widgets. Each widget: (el, ctx) => mounts into el. Animation loops are tracked so the
   app can stop them on navigation. Drawing is done in a 900-wide logical space scaled to the element, with
   px() converting real pixels (fonts, line widths) into logical units so text stays readable on a phone. */
const W8=(function(){
"use strict";
const PI=Math.PI,C0=3e8,ETA0=120*PI;
const COL={bg:"#07080C",e:"#4FC8D8",h:"#C7B6FF",acc:"#FF9F5A",good:"#78D58C",bad:"#F2668A",warn:"#F2BF4C",txt:"#C9CEDA",mut:"#8C92A4",grid:"#262A36"};
const RM=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const live=new Set();
function stopAll(){live.forEach(f=>{try{f()}catch(e){}});live.clear();}
function loop(fn){let id=0,on=true;const tick=t=>{if(!on)return;if(fn(t)!==false)id=requestAnimationFrame(tick);};id=requestAnimationFrame(tick);const stop=()=>{on=false;cancelAnimationFrame(id);};live.add(stop);return stop;}
function setup(cv,LW,LH){const cw=Math.max(280,cv.clientWidth||cv.parentElement.clientWidth||340);const s=cw/LW;const r=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cw*r);cv.height=Math.round(LH*s*r);cv.style.aspectRatio=LW+"/"+LH;const c=cv.getContext("2d");c.setTransform(r*s,0,0,r*s,0,0);
  c.px=n=>n/s;c.font_=(n,w)=>{c.font=`${w||500} ${n/s}px ui-monospace,"SF Mono",Menlo,monospace`;};return c;}
function arrow(c,x0,y0,x1,y1,col,w,hs){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=c.px(w||2);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();const a=Math.atan2(y1-y0,x1-x0),h=c.px(hs||6);c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-h*Math.cos(a-.45),y1-h*Math.sin(a-.45));c.lineTo(x1-h*Math.cos(a+.45),y1-h*Math.sin(a+.45));c.closePath();c.fill();}
const f3=(x,d=4)=>{if(!isFinite(x))return"∞";const a=Math.abs(x);return(a>=1e5||(a<1e-3&&x!==0))?x.toExponential(d-1).replace("e","×10^").replace(/\^\+?(-?\d+)/,(m,p)=>sup(p)):(+x.toPrecision(d)).toString();};
function sup(p){const m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};return p.split("").map(ch=>m[ch]||ch).join("");}
function fcOf(m,n,a,b,er){return C0/(2*Math.sqrt(er))*Math.sqrt((m/a)**2+(n/b)**2);}
function modeList(a,b,er,N){const L=[];for(let m=0;m<=8;m++)for(let n=0;n<=8;n++){if(!m&&!n)continue;L.push({m,n,fc:fcOf(m,n,a,b,er),tm:m>0&&n>0});}L.sort((p,q)=>p.fc-q.fc||p.n-q.n);return L.slice(0,N||10);}
const seg=(name,opts,cur)=>`<span class="seg" role="group">${opts.map(([v,l])=>`<button data-${name}="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</span>`;
const ro=list=>list.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("");
function press(el,name,btn){el.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",x===btn));}

/* ---------- 1. TE10 hero: 3D guide with animated fields ---------- */
function hero(el,ctx){
  el.innerHTML=`<canvas class="viz"></canvas>
  <div class="ctrl">${seg("hs",[["E","E only"],["H","H only"],["EH","both"]],"E")}<button class="btn sm" data-hp>${RM()?"Play":"Pause"}</button></div>
  <div class="legend"><span class="e">↕ E: only E<sub>y</sub>, peaks mid-guide, zero at the side walls</span><span class="h">→ H: H<sub>x</sub>, H<sub>z</sub> loops flat in the x–z plane</span><span class="a">▭ PEC walls · a along x (wide), b along y</span></div>`;
  const cv=el.querySelector("canvas");const LW=900,LH=380;const c=setup(cv,LW,LH);
  let play=!RM(),t0=performance.now(),tt=0,show="E";const a=1,b=.45,L=3.2,O=[70,330];
  const P=(x,y,z)=>[O[0]+z*205+x*150*.87,O[1]-x*150*.5-y*330];
  const ln=(p,q)=>{c.beginPath();c.moveTo(...P(...p));c.lineTo(...P(...q));c.stroke();};
  function box(back){if(back){c.strokeStyle="rgba(255,159,90,.32)";c.lineWidth=c.px(1);ln([a,0,0],[a,0,L]);ln([a,b,0],[a,b,L]);ln([a,0,0],[a,b,0]);ln([a,0,L],[a,b,L]);ln([0,0,0],[a,0,0]);ln([0,0,L],[a,0,L]);}
    else{c.strokeStyle="rgba(255,159,90,.95)";c.lineWidth=c.px(1.8);ln([0,0,0],[0,0,L]);ln([0,b,0],[0,b,L]);ln([0,0,0],[0,b,0]);ln([0,0,L],[0,b,L]);ln([0,b,0],[a,b,0]);ln([0,b,L],[a,b,L]);}}
  function frame(now){if(play)tt=(now-t0)/1000;c.fillStyle=COL.bg;c.fillRect(0,0,LW,LH);box(true);const bz=2*PI/1.6,wt=2.2*tt;
    const nz=c.px(1)>1.6?10:18,ni=c.px(1)>1.6?4:6;for(let i=1;i<ni;i++)for(let k=0;k<=nz;k++){const x=i/ni*a,z=k/nz*L,ph=wt-bz*z;
      if(show!=="H"){const Ey=Math.sin(PI*x/a)*Math.cos(ph);const p0=P(x,b/2-Ey*b*.44,z),p1=P(x,b/2+Ey*b*.44,z);if(Math.abs(Ey)>.08)arrow(c,p0[0],p0[1],p1[0],p1[1],`rgba(79,200,216,${((.3+.7*Math.abs(Ey))*(1-.4*x)).toFixed(2)})`,1.8,5);}
      if(show!=="E"){const Hx=-Math.sin(PI*x/a)*Math.cos(ph)*.8,Hz=(1/bz)*(PI/a)*Math.cos(PI*x/a)*Math.sin(ph)*.8;const s=.1;const p0=P(x-Hx*s,b/2,z-Hz*s*1.6),p1=P(x+Hx*s,b/2,z+Hz*s*1.6);if(Math.hypot(Hx,Hz)>.08)arrow(c,p0[0],p0[1],p1[0],p1[1],"rgba(199,182,255,.92)",1.8,5);}}
    box(false);c.fillStyle=COL.txt;c.font_(12);const q1=P(a/2,0,0),q2=P(0,b,0),q3=P(0,0,L*.5);
    c.font_(13,650);c.fillText("z → propagation",q3[0],q3[1]+40);
    return play;}
  let stop=loop(frame);if(!play)frame(performance.now());
  el.addEventListener("click",e=>{const p=e.target.closest("[data-hp]");if(p){play=!play;p.textContent=play?"Pause":"Play";if(play){t0=performance.now()-tt*1000;stop();stop=loop(frame);}}
    const s=e.target.closest("[data-hs]");if(s){show=s.dataset.hs;press(el,"hs",s);if(!play)frame(performance.now());}});}

/* ---------- 2. Zigzag: two plane waves, cutoff as bounce angle ---------- */
function zig(el,ctx){
  el.innerHTML=`<canvas class="viz"></canvas>
  <div class="ctrl"><label class="rng">f / f<sub>c</sub><input type="range" min="0.6" max="3" step="0.01" value="1.6" aria-label="frequency over cutoff"><output></output></label></div>
  <div class="readout"></div>`;
  const cv=el.querySelector("canvas"),inp=el.querySelector("input"),out=el.querySelector("output"),rd=el.querySelector(".readout");
  const LW=900,LH=270;const c=setup(cv,LW,LH);const y0=50,y1=215,x0=30,x1=LW-20;let t0=performance.now();let last=-1;
  function frame(now){const r=+inp.value;out.textContent=r.toFixed(2);c.fillStyle=COL.bg;c.fillRect(0,0,LW,LH);
    const above=r>1;const cosP=above?Math.sqrt(1-1/(r*r)):0,sinP=above?1/r:1;
    if(!above){const al=Math.sqrt(1/(r*r)-1);for(let x=x0;x<x1;x+=4){const A=Math.exp(-al*(x-x0)/45);c.fillStyle=`rgba(79,200,216,${(.5*A).toFixed(3)})`;c.fillRect(x,y0,4,y1-y0);}}
    c.strokeStyle=COL.acc;c.lineWidth=c.px(3);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y0);c.moveTo(x0,y1);c.lineTo(x1,y1);c.stroke();
    c.fillStyle=COL.txt;c.font_(11);c.fillText("wall x = a",x1-c.px(74),y0-c.px(8));c.fillText("wall x = 0",x1-c.px(74),y1+c.px(16));c.fillText("z →",x0,y1+c.px(16));
    const sp=140,tt=RM()?2:(now-t0)/1000,wid=y1-y0;
    if(above)for(let k=0;k<6;k++){const path=((tt*sp+k*wid*1.3)%(wid*6));const zz=x0+path*cosP;const yy=path*sinP%(2*wid);const yp=yy<wid?y1-yy:y0+(yy-wid);
      c.strokeStyle="rgba(79,200,216,.5)";c.lineWidth=c.px(1.5);c.beginPath();for(let q=0;q<60;q++){const ps=Math.max(0,path-q*6);const zq=x0+ps*cosP,yq=ps*sinP%(2*wid);const ypp=yq<wid?y1-yq:y0+(yq-wid);q?c.lineTo(Math.min(zq,x1),ypp):c.moveTo(Math.min(zq,x1),ypp);}c.stroke();
      if(zz<x1){c.fillStyle=COL.e;c.beginPath();c.arc(zz,yp,c.px(4),0,7);c.fill();}}
    else{c.fillStyle=COL.mut;c.font_(13);c.fillText(r===1?"at cutoff: bouncing straight across, no forward progress":"below cutoff: no traveling wave, the field just decays",x0+c.px(8),(y0+y1)/2);}
    if(r!==last){last=r;const psi=Math.asin(Math.min(1,sinP))*180/PI;
      rd.innerHTML=above?ro([["ψ from z axis",psi.toFixed(1)+"°"],["β_z / β = cos ψ",cosP.toFixed(3)],["v_p / v",(1/cosP).toFixed(3)],["v_g / v",cosP.toFixed(3)],["λ_g / λ",(1/cosP).toFixed(3)],["state","propagates"]])
        :ro([["state",r===1?"at cutoff":"evanescent"],["β_z","−jα_z"],["α_z / β",Math.sqrt(1/(r*r)-1).toFixed(3)],["field","e^(−α_z z)"]]);}
    return !RM();}
  loop(frame);inp.addEventListener("input",()=>{if(RM())frame(performance.now());});}

/* ---------- 3. Mode explorer (TE/TM, PEC/PMC) ---------- */
function modes(el,ctx,init){
  const MS=Object.assign({k:"TE",m:1,n:0,ab:2.25,wall:"PEC"},init||{});if(MS.k==="TM"&&init&&init.m==null){MS.m=1;MS.n=1;}
  let play=!RM();
  function ui(){el.innerHTML=`<div class="ctrl">${seg("mk",[["TE","TE<sup>z</sup>"],["TM","TM<sup>z</sup>"]],MS.k)}${seg("mm",[[0,"m 0"],[1,"1"],[2,"2"],[3,"3"]],MS.m)}${seg("mn",[[0,"n 0"],[1,"1"],[2,"2"]],MS.n)}</div>
    <div class="ctrl">${seg("mw",[["PEC","PEC walls"],["PMC","PMC (8.10–8.11)"]],MS.wall)}${seg("mab",[[1,"a/b 1"],[2,"2"],[2.25,"2.25"]],MS.ab)}</div>
    <canvas class="viz"></canvas>
    <div class="legend"><span>color = ${MS.k==="TE"?"H<sub>z</sub> ∝ F<sub>z</sub>":"E<sub>z</sub> ∝ A<sub>z</sub>"} (warm +, cool −)</span><span class="e">→ E<sub>t</sub></span><span class="h">→ H<sub>t</sub></span></div>
    <div class="mi"></div>`;draw();}
  let stop=null;
  function draw(){if(stop)stop();const cv=el.querySelector("canvas");const LW=900,LH=Math.round(900/Math.max(MS.ab,1.6))+44;const c=setup(cv,LW,LH);
    const pad=30,gw=LW-2*pad,gh=gw/MS.ab;const top=Math.max(30,(LH-gh)/2+8);const {k,m,n}=MS;const pmc=MS.wall==="PMC";const sinsin=(k==="TE")===pmc;const valid=sinsin?(m&&n):(m||n);
    const fcr=Math.sqrt(m*m+(n*MS.ab)**2);const T=ctx.tex;
    const mi=el.querySelector(".mi");
    if(!valid)mi.innerHTML=`<div class="flag"><b>${k}<sub>${m}${n}</sub> doesn't exist with ${MS.wall} walls.</b> ${!sinsin?ctx.M("With $m=n=0$ the potential is a constant, and every transverse field is a derivative of it, so all of them are zero."):ctx.M("This case needs $\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$. A zero index makes one factor $\\sin 0=0$, so every field vanishes.")}</div>`;
    else{const P=k==="TE"?`F_z=A_{${m}${n}}`:`A_z=B_{${m}${n}}`;const tf=sinsin?"\\sin":"\\cos";let F=`${P}${tf}\\frac{${m}\\pi x}{a}${tf}\\frac{${n}\\pi y}{b}\\,e^{-j\\beta_zz}`;
      F=F.replace(/\\cos\\frac\{0\\pi [xy]\}\{[ab]\}/g,"").replace(/\\frac\{1\\pi/g,"\\frac{\\pi");
      mi.innerHTML=`<div class="mathbox">${T(F,true)}</div><div class="mathbox">${T(`\\frac{(f_c)_{${m}${n}}}{(f_c)_{10}}=\\sqrt{${m}^2+\\left(${n}\\cdot\\frac ab\\right)^2}=${fcr.toFixed(3)}`,true)}</div>`;}
    const bx=m*PI,by=n*PI;
    function fld(x,y){const cx=Math.cos(bx*x),sx=Math.sin(bx*x),cy=Math.cos(by*y),sy=Math.sin(by*y);const kx=m,ky=n*MS.ab;
      if(!pmc){if(k==="TE")return{L:cx*cy,Ex:ky*cx*sy,Ey:-kx*sx*cy,Hx:kx*sx*cy,Hy:ky*cx*sy};return{L:sx*sy,Ex:-kx*cx*sy,Ey:-ky*sx*cy,Hx:ky*sx*cy,Hy:-kx*cx*sy};}
      if(k==="TE")return{L:sx*sy,Ex:-ky*sx*cy,Ey:kx*cx*sy,Hx:-kx*cx*sy,Hy:-ky*sx*cy};return{L:cx*cy,Ex:kx*sx*cy,Ey:ky*cx*sy,Hx:-ky*cx*sy,Hy:kx*sx*cy};}
    const NX=160,NY=Math.max(20,Math.round(160/MS.ab));const off=document.createElement("canvas");off.width=NX;off.height=NY;const oc=off.getContext("2d");const id=oc.createImageData(NX,NY);
    if(valid){for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const v=fld((i+.5)/NX,1-(j+.5)/NY).L;const a2=Math.min(1,Math.sqrt(Math.abs(v)));const q=(j*NX+i)*4;
      if(v>=0){id.data[q]=14+230*a2;id.data[q+1]=14+128*a2;id.data[q+2]=18+60*a2;}else{id.data[q]=14+50*a2;id.data[q+1]=16+150*a2;id.data[q+2]=22+190*a2;}id.data[q+3]=255;}oc.putImageData(id,0,0);}
    let mx=0;const nx=MS.ab>1.5?12:9,ny=Math.max(3,Math.round(nx/MS.ab));if(valid)for(let j=0;j<=2*ny;j++)for(let i=0;i<=2*nx;i++){const F=fld(i/(2*nx),j/(2*ny));mx=Math.max(mx,Math.hypot(F.Ex,F.Ey),Math.hypot(F.Hx,F.Hy));}
    let t0=performance.now(),tt=0;
    function frame(now){if(play)tt=(now-t0)/1000;const ct=Math.cos(1.6*tt);c.fillStyle=COL.bg;c.fillRect(0,0,LW,LH);
      if(valid){c.imageSmoothingEnabled=true;c.drawImage(off,pad,top,gw,gh);const cs=gw/nx;
        const dr=(x,y,vx,vy,col,w)=>{const l=Math.hypot(vx,vy)/mx*Math.abs(ct);if(l<.05)return;const Lh=cs*.42*Math.sqrt(l);const sg=Math.sign(ct)||1;const ux=vx/Math.hypot(vx,vy)*sg,uy=vy/Math.hypot(vx,vy)*sg;const X=pad+x*gw,Y=top+(1-y)*gh;arrow(c,X-ux*Lh,Y+uy*Lh,X+ux*Lh,Y-uy*Lh,col.replace("A",(.4+.6*Math.sqrt(l)).toFixed(2)),w,7);};
        for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const x=(i+.5)/nx,y=(j+.5)/ny;const F=fld(x,y);dr(x,y,F.Ex,F.Ey,"rgba(79,200,216,A)",2.4);}

      else{c.fillStyle=COL.mut;c.font_(14);c.fillText("no field: this mode does not exist",pad+c.px(16),top+gh/2);}

      c.fillStyle=COL.txt;c.font_(12,650);c.fillText(`${k}${m}${n} · ${MS.wall} · cross-section`,pad,top-c.px(10));c.font_(11);c.fillText("x →",pad+gw-c.px(26),top+gh+c.px(16));

  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if(d.mk){MS.k=d.mk;if(MS.k==="TM"&&MS.wall==="PEC"&&(!MS.m||!MS.n)){MS.m=1;MS.n=1;}ui();return;}

/* ---------- 4. Cutoff ladder + worked numbers ---------- */
function ladder(el,ctx){const S={a:2.286,b:1.016,er:1,f:10};

   <div class="ctrl"><button class="btn sm" data-pre="2.286,1.016,1,10">WR-90 (Ex 8-2)</button><button class="btn sm" data-pre="2.286,1.016,2.56,10">HW 8.2 fill</button><button class="btn sm" data-pre="2,1,1,12">a = 2b</button></div>

    c.fillStyle=COL.mut;c.font_(11);const st=fmax/1e9>40?10:fmax/1e9>15?5:2;for(let g=0;g<=fmax/1e9;g+=st)c.fillText(g+"",X(g*1e9)-c.px(4),132+c.px(15));c.fillText("GHz",LW-c.px(34),132+c.px(15));
    let lastX=-999,lvl=0;L.forEach(md=>{const x=X(md.fc);if(x>LW-30)return;lvl=(x-lastX<c.px(26))?lvl+1:0;lastX=x;c.strokeStyle=md.tm?COL.h:COL.e;c.lineWidth=c.px(2);c.beginPath();c.moveTo(x,132);c.lineTo(x,82-lvl*c.px(0));c.stroke();
      c.save();c.translate(x+c.px(2),78-lvl*c.px(14));c.rotate(-PI/4);c.fillStyle=md.tm?COL.h:COL.e;c.font_(11,650);c.fillText((md.tm?"TE/TM":"TE")+md.m+md.n,0,0);c.restore();});
    c.strokeStyle=COL.acc;c.lineWidth=c.px(2.5);c.beginPath();c.moveTo(X(f),20);c.lineTo(X(f),140);c.stroke();c.fillStyle=COL.acc;c.font_(12,700);c.fillText("f = "+S.f+" GHz",Math.min(X(f)+c.px(4),LW-c.px(110)),LH-c.px(8));
    const v=C0/Math.sqrt(er),eta=ETA0/Math.sqrt(er),T=ctx.tex;const s=Math.sqrt(1-(f10/f)**2);let w="";
    w+=`<div class="mathbox">${T(`(f_c)_{10}=\\frac{c}{2a\\sqrt{\\varepsilon_r}}=\\frac{3\\times10^8}{2(${f3(a,4)})\\sqrt{${er}}}=${f3(f10/1e9)}\\ \\text{GHz}`,true)}</div>`;
    if(f>f10){const beta=2*PI*f/v;w+=`<div class="mathbox">${T(`\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}=\\sqrt{1-\\left(\\frac{${f3(f10/1e9)}}{${S.f}}\\right)^2}=${f3(s)}`,true)}</div>`;
      w+=`<div class="readout">${ro([["β_z (rad/m)",f3(beta*s)],["λ_g (cm)",f3(200*PI/(beta*s))],["Z_w TE (Ω)",f3(eta/s)],["v_p (m/s)",f3(v/s)],["v_g (m/s)",f3(v*s)],["η medium (Ω)",f3(eta)]])}</div>`;}
    else w+=`<div class="mathbox">${T(`f<f_c:\\ \\alpha_z=\\beta\\sqrt{\\left(\\frac{f_c}{f}\\right)^2-1}=${f3(2*PI*f/v*Math.sqrt((f10/f)**2-1))}\\ \\text{Np/m}`,true)}</div>`;

  el.addEventListener("click",e=>{const p=e.target.closest("[data-pre]");if(!p)return;const v=p.dataset.pre.split(",");["a","b","er","f"].forEach((k,i)=>el.querySelector(`[data-k=${k}]`).value=v[i]);draw();});

/* ---------- 5. Wave impedance vs frequency ---------- */
function zw(el,ctx){
  el.innerHTML=`<canvas class="viz"></canvas><div class="ctrl"><label class="rng">f / f<sub>c</sub><input type="range" min="1.02" max="4" step="0.01" value="1.5"><output></output></label></div><div class="readout"></div>
  <div class="legend"><span class="e">— Z<sub>w</sub><sup>TE</sup> = η/√(1−(f<sub>c</sub>/f)²)</span><span class="h">— Z<sub>w</sub><sup>TM</sup> = η√(1−(f<sub>c</sub>/f)²)</span><span>- - η = 377 Ω</span></div>`;

    const XL=70,XR=LW-24,YT=20,YB=LH-40,xm=4,ym=4*ETA0;const X=q=>XL+(XR-XL)*q/xm,Y=z=>YB-(YB-YT)*Math.min(z,ym)/ym;

    [[q=>ETA0/Math.sqrt(1-1/q/q),COL.e],[q=>ETA0*Math.sqrt(1-1/q/q),COL.h]].forEach(([fn,col])=>{c.strokeStyle=col;c.lineWidth=c.px(2.5);c.beginPath();let st=0;for(let q=1.0005;q<=xm;q+=.005){const y=Y(fn(q));st++?c.lineTo(X(q),y):c.moveTo(X(q),y);}c.stroke();});
    c.fillStyle=COL.mut;c.font_(11);for(let g=0;g<=4;g++)c.fillText(g+"",X(g)-c.px(3),YB+c.px(15));c.fillText("f / f_c",XR-c.px(44),YB+c.px(30));c.fillText("η",XL-c.px(18),Y(ETA0)+c.px(4));c.fillText("cutoff",X(1)+c.px(4),YT+c.px(10));
    c.fillStyle="rgba(242,102,138,.08)";c.fillRect(XL,YT,X(1)-XL,YB-YT);c.fillStyle=COL.bad;c.fillText("evanescent",XL+c.px(4),YB-c.px(8));
    const s=Math.sqrt(1-1/r/r),zte=ETA0/s,ztm=ETA0*s;c.strokeStyle=COL.acc;c.lineWidth=c.px(1.5);c.beginPath();c.moveTo(X(r),YT);c.lineTo(X(r),YB);c.stroke();

    el.querySelector(".readout").innerHTML=ro([["Z TE (Ω)",zte.toFixed(1)],["Z TM (Ω)",ztm.toFixed(1)],["Z_TE · Z_TM",`η² ✓`],["√(1−(f_c/f)²)",s.toFixed(3)]]);}
  inp.addEventListener("input",draw);draw();}

/* ---------- 6. Attenuation: conductor + dielectric (Ex 8-6 setup) ---------- */
function atten(el,ctx){
  el.innerHTML=`<canvas class="viz"></canvas>
  <div class="ctrl"><label class="rng">tan δ ×10⁻⁴<input type="range" data-t min="0" max="20" step="0.05" value="2.55"><output data-to></output></label>
  <label class="rng">f (GHz)<input type="range" data-f min="4.2" max="12" step="0.05" value="6"><output data-fo></output></label></div><div class="readout"></div>
  <div class="legend"><span class="a">— α<sub>c</sub> copper walls (8-69)</span><span class="e">— α<sub>d</sub> filling (8-75)</span><span class="g">— total</span><span>WR-90 filled with polystyrene, ε<sub>r</sub> = 2.56 (Ex 8-6)</span></div>`;
  const cv=el.querySelector("canvas"),ti=el.querySelector("[data-t]"),fi=el.querySelector("[data-f]");
  const a=.02286,b=.01016,er=2.56,sig=5.8e7,mu0=4e-7*PI;const v=C0/Math.sqrt(er),eta=ETA0/Math.sqrt(er),fc=v/(2*a);
  const ac=f=>{const Rs=Math.sqrt(2*PI*f*mu0/(2*sig));const r=fc/f;return Rs*(1+2*b/a*r*r)/(eta*b*Math.sqrt(1-r*r));};
  const ad=(f,td)=>{const lam=v/f,lg=lam/Math.sqrt(1-(fc/f)**2);return td*PI/lam*lg/lam;};
  function draw(){const td=+ti.value*1e-4,f0=+fi.value*1e9;el.querySelector("[data-to]").textContent=(+ti.value).toFixed(2);el.querySelector("[data-fo]").textContent=(+fi.value).toFixed(2);
    const LW=900,LH=320;const c=setup(cv,LW,LH);c.fillStyle=COL.bg;c.fillRect(0,0,LW,LH);const XL=70,XR=LW-24,YT=20,YB=LH-40,fa=3.9e9,fb=12e9,ym=1.2;
    const X=f=>XL+(XR-XL)*(f-fa)/(fb-fa),Y=d=>YB-(YB-YT)*Math.min(d,ym)/ym;const dB=x=>8.686*x;
    c.strokeStyle=COL.grid;c.lineWidth=c.px(1);c.beginPath();c.moveTo(XL,YT);c.lineTo(XL,YB);c.lineTo(XR,YB);c.stroke();
    c.setLineDash([c.px(5),c.px(5)]);c.strokeStyle=COL.mut;c.beginPath();c.moveTo(X(fc),YT);c.lineTo(X(fc),YB);c.stroke();c.setLineDash([]);
    [[f=>dB(ac(f)),COL.acc],[f=>dB(ad(f,td)),COL.e],[f=>dB(ac(f)+ad(f,td)),COL.good]].forEach(([fn,col])=>{c.strokeStyle=col;c.lineWidth=c.px(2.4);c.beginPath();let s=0;for(let f=fc*1.003;f<=fb;f+=2e7){const y=Y(fn(f));s++?c.lineTo(X(f),y):c.moveTo(X(f),y);}c.stroke();});
    c.fillStyle=COL.mut;c.font_(11);for(let g=4;g<=12;g+=2)c.fillText(g+"",X(g*1e9)-c.px(4),YB+c.px(15));c.fillText("GHz",XR-c.px(26),YB+c.px(30));for(let d=0;d<=1.2;d+=.4)c.fillText(d.toFixed(1),XL-c.px(30),Y(d)+c.px(4));c.fillText("dB/m",XL+c.px(6),YT+c.px(10));c.fillText("f_c = "+(fc/1e9).toFixed(2)+" GHz",X(fc)+c.px(4),YT+c.px(24));
    c.strokeStyle=COL.warn;c.lineWidth=c.px(1.2);c.beginPath();c.moveTo(X(f0),YT);c.lineTo(X(f0),YB);c.stroke();
    const A=ac(f0),D=ad(f0,td);el.querySelector(".readout").innerHTML=ro([["α_c (dB/m)",dB(A).toFixed(3)],["α_d (dB/m)",dB(D).toFixed(3)],["α_d (Np/cm)",(D/100).toExponential(3)],["total dB/m",dB(A+D).toFixed(3)]]);}
  el.addEventListener("input",draw);draw();}

return {stopAll,hero,zig,modes,modesTE:(el,ctx)=>modes(el,ctx,{k:"TE",m:1,n:0}),modesTM:(el,ctx)=>modes(el,ctx,{k:"TM",m:1,n:1}),ladder,zw,atten,f3,fcOf};
})();
