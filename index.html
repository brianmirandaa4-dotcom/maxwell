<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAXWELL</title>
<meta name="description" content="ELEG 648 study app">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0C10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAXWELL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{
 --bg:#0D1022;--surface:#191E3F;--surface-2:#21274E;--line:rgba(178,186,255,.13);--line-2:rgba(178,186,255,.24);
 --fg:#F4F2FF;--muted:#A3A6CC;--faint:#6A6E9A;
 --cta:#C7B6FF;--cta-ink:#17121F;--good:#6EE7A8;--bad:#FF8B8B;--warn:#FFC857;
 --e:#4FC8D8;--h:#C7B6FF;--acc:#FF9F5A;
 --fd:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",system-ui,sans-serif;
 --fb:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
 --fn:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 --r:22px;--r-s:14px;--t-fast:150ms;--t-base:220ms;--ease-out:cubic-bezier(.2,.8,.2,1);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
 color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cta)}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 16px 10px;background:rgba(13,16,34,.8);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color var(--t-base)}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--fd);letter-spacing:.2em;background:none;border:0;padding:6px 0;min-height:44px}
.mark{width:34px;height:22px;flex:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.bars i{display:block;width:5px;border-radius:3px}
.bars i:nth-child(1){height:11px;background:var(--e)}.bars i:nth-child(2){height:20px;background:var(--h)}.bars i:nth-child(3){height:15px;background:var(--acc)}
.top .sp{flex:1}
.iconbtn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.iconbtn:active{transform:scale(.96)}
.back{display:none}.has-back .back{display:inline-grid}.has-back .brand span.word{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--fn);background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.hot{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--bg));border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}

/* ---------- layout ---------- */
main{max-width:760px;margin:0 auto;padding:12px 16px calc(96px + var(--sab))}
.view{animation:vin var(--t-base) var(--ease-out)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:800 34px/1.08 var(--fd);letter-spacing:-.02em;margin:14px 0 6px}
h2{font:750 24px/1.15 var(--fd);letter-spacing:-.01em;margin:22px 0 8px}
h3{font:700 18px/1.25 var(--fd);margin:18px 0 6px}
p{margin:.55em 0}
.sub{color:var(--muted);margin:0 0 14px}
.grad{background:linear-gradient(90deg,var(--e),var(--h));-webkit-background-clip:text;background-clip:text;color:transparent}
.lab{display:block;font:700 12px/1.2 var(--fn);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.card.tight{padding:14px}
.card.acc{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mut{color:var(--muted)}.faint{color:var(--faint)}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.big{font:800 56px/1 var(--fd);letter-spacing:-.03em;color:var(--acc)}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:650;transition:transform var(--t-fast) var(--ease-out),background var(--t-fast),border-color var(--t-fast)}
.btn:active{transform:scale(.97)}
.btn.cta{background:var(--cta);color:var(--cta-ink);border-color:transparent;font:750 17px/1 var(--fd)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.kbd{font:600 11px var(--fn);color:var(--faint);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;margin-left:6px}
@media(hover:none){.kbd{display:none}}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.seg button{min-height:40px;min-width:44px;padding:6px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:650}
.li .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.li .r{font:500 13px var(--fn);color:var(--muted);white-space:nowrap}
.li .chev{color:var(--faint)}
button.li:active{background:var(--surface-2)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--sab));background:rgba(18,22,50,.9);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 2px;border:0;background:none;color:var(--faint);font:600 11px/1 var(--fb);border-radius:12px;transition:color var(--t-fast)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--fg)}
.tabs button[aria-current=page] svg{color:var(--cta)}
.tabs button .badge{position:absolute;margin-left:22px;margin-top:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#160a0e;font:700 10px/16px var(--fn)}
@media(min-width:900px){.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:16px;border:1px solid var(--line);border-radius:20px;padding:6px;gap:4px;width:auto}.tabs button{min-width:92px}main{padding-bottom:120px}}

/* ---------- rings ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid transparent;background:none}
.rp{position:relative;display:inline-block;flex:none}
.rp svg{display:block;transform:rotate(-90deg)}
.rp circle{fill:none;stroke-width:7}
.rp .trk{stroke:var(--surface-2)}
.rp .val{stroke-linecap:round;transition:stroke-dashoffset 900ms var(--ease-out)}
.ring .rl{font:600 12px var(--fn);color:var(--muted);text-align:center;line-height:1.2}
.rp b{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--fn)}
.ring.off{opacity:.42}
button.ring:active{background:var(--surface-2)}

/* ---------- learning content ---------- */
.lesson-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font:650 11px/1.4 var(--fn);letter-spacing:.04em;border:1px solid var(--line-2);color:var(--muted);vertical-align:middle}
.tag.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.supp{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tag.nl{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.hook{font:700 20px/1.3 var(--fd);margin:6px 0 4px}
.intu p{font-size:17px}
.aside{border-left:3px solid var(--acc);padding:10px 14px;margin:14px 0;background:color-mix(in srgb,var(--acc) 6%,transparent);border-radius:0 12px 12px 0}
.aside .lab{color:var(--acc);margin-bottom:4px}
.flag{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.mstep{border-top:1px solid var(--line);padding:14px 0 6px}
.mstep:first-of-type{border-top:0;padding-top:4px}
.mstep .mt{font:650 14px var(--fn);color:var(--acc);margin-bottom:4px}
.mstep .note{color:var(--muted);font-size:15px}
.mathbox{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:4px 2px;margin:4px 0}
.mathbox.ans{border:1.5px solid var(--acc);border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--acc) 6%,transparent)}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math;font-size:1.08em}
math[display=block]{margin:.3em 0}
.katex-display{display:block;margin:0}
.katex{white-space:normal}
.steps .st{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);animation:vin var(--t-base) var(--ease-out)}
.steps .st:first-child{border-top:0}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--fn);background:var(--surface-2);color:var(--acc);border:1px solid var(--line-2)}
.steps .mv{font-weight:700}
.steps .why{color:var(--muted);font-size:15px;grid-column:2}
.steps .st .mathbox{grid-column:2}
.reveal-bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width var(--t-base) var(--ease-out)}

/* ---------- quiz ---------- */
.q{font:600 19px/1.4 var(--fd);margin:4px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:56px;padding:13px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);transition:transform var(--t-fast) var(--ease-out),border-color var(--t-fast),background var(--t-fast)}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--fn);background:var(--bg);color:var(--muted);border:1px solid var(--line-2)}
.opt .ot{flex:1;min-width:0}
.opt .ow{display:none;color:var(--muted);font-size:14px;margin-top:4px}
.opts.done .opt{pointer-events:none}
.opts.done .opt .ow{display:block}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface-2))}
.opt.right .k{background:var(--good);color:#0b1a0f;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface-2))}
.opt.wrong .k{background:var(--bad);color:#1c0a10;border-color:transparent}
.opts.done .opt:not(.right):not(.wrong){opacity:.62}
.verdict{display:flex;align-items:center;gap:10px;font:750 18px var(--fd);margin:14px 0 4px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.verdict svg{width:26px;height:26px}
.pop{animation:pop 420ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.shake{animation:shake 300ms var(--ease-out)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qhead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.qhead .progress{flex:1;margin:0}
.statement{font-size:17px}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.ansgrid div{border:1.5px solid var(--acc);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--acc) 7%,transparent)}
.ansgrid small{display:block;color:var(--muted);font:600 12px var(--fn)}
.ansgrid b{font:700 20px var(--fn)}
.ansgrid i{font-style:normal;color:var(--muted);font:500 13px var(--fn);margin-left:4px}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

/* ---------- vault ---------- */
.search{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;min-height:46px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600}
.chips button[aria-pressed=true]{color:var(--fg);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.eq h4{margin:0;font:700 16px var(--fd)}
.eq .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px}
.eq .meta dt{font:650 11px/1.9 var(--fn);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.eq .meta dd{margin:0;color:var(--muted)}
.eq .when{color:var(--fg)}

/* ---------- widgets ---------- */
.viz{display:block;width:100%;height:auto;border-radius:12px;background:#07080C;border:1px solid var(--line);touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--fn);color:var(--muted);margin:8px 0}
.legend .e{color:var(--e)}.legend .h{color:var(--h)}.legend .a{color:var(--acc)}.legend .g{color:var(--good)}
.rng{display:flex;align-items:center;gap:10px;width:100%;font:600 13px var(--fn);color:var(--muted)}
.rng input{flex:1;accent-color:var(--acc);min-height:44px}
.rng output{min-width:64px;text-align:right;color:var(--fg)}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.readout div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.readout small{display:block;font:600 11px var(--fn);color:var(--faint)}
.readout b{font:700 15px var(--fn)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font:600 12px var(--fn);color:var(--muted)}
.form input{min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);font:600 15px var(--fn)}
@media(max-width:420px){.form{grid-template-columns:1fr 1fr}}

/* ---------- exam ---------- */
.timer{font:700 15px var(--fn);color:var(--muted)}
.timer.low{color:var(--bad)}
.bars-h{display:flex;flex-direction:column;gap:10px}
.bh{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.bh .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bh .tr i{display:block;height:100%;border-radius:4px;transition:width 700ms var(--ease-out)}
.scorebig{font:800 64px/1 var(--fd);letter-spacing:-.03em}

/* ---------- toast / sheet ---------- */
.toast{position:fixed;left:50%;top:calc(70px + var(--sat));z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.5);font-weight:650;animation:tin 380ms var(--ease-out);max-width:calc(100% - 32px)}
.toast .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cta);color:var(--cta-ink);font:800 16px var(--fd);flex:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);animation:fade var(--t-base)}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab));animation:sup var(--t-base) var(--ease-out);max-height:85vh;overflow:auto}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badges span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;font-weight:600}
.empty{padding:20px;text-align:center;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (prefers-reduced-motion: reduce){
 *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}}

.mathbox{scrollbar-width:thin}
.mathbox.scrolls{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}

/* ================= GAME ================= */
.pcard{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#1B1E27,#13151B);border:1px solid var(--line-2)}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font:800 24px var(--fd);color:#0B0C10;background:conic-gradient(from 210deg,#4FC8D8,#C7B6FF,#FF9F5A,#4FC8D8);box-shadow:0 0 22px rgba(199,182,255,.25);flex:none}
.pinfo{flex:1;min-width:0}.pinfo small{display:block;font:650 11px var(--fn);letter-spacing:.08em;color:var(--muted)}
.xpbar{height:9px;border-radius:5px;background:var(--bg);overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#4FC8D8,#C7B6FF);border-radius:5px;transition:width 900ms var(--ease-out)}
.pstats{display:flex;flex-direction:column;gap:4px;font:700 14px var(--fn);align-items:flex-end}.pstats span{display:flex;align-items:center;gap:4px}
.evbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--acc) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));font-weight:650}
.evbar b{color:var(--acc)}
.contbtn{display:block;width:100%;text-align:left;margin-top:12px;padding:18px;border-radius:20px;border:0;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 85%,#000),color-mix(in srgb,var(--acc) 45%,#13151B));color:#0B0C10;position:relative;box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 25%,transparent);transition:transform var(--t-fast) var(--ease-out)}

/* ---------- special functions ---------- */
function besselJ(n,x){let s=0;const N=200;for(let i=0;i<=N;i++){const t=PI*i/N;const w=(i===0||i===N)?1:(i%2?4:2);s+=w*Math.cos(n*t-x*Math.sin(t));}return s*PI/N/3/PI;}
function besselY(n,x){if(x<=0)return -Infinity;let s1=0;const N=200;for(let i=0;i<=N;i++){const t=PI*i/N;const w=(i===0||i===N)?1:(i%2?4:2);s1+=w*Math.sin(x*Math.sin(t)-n*t);}s1*=PI/N/3/PI;
  const T=Math.asinh(40/x)+n*0.5+1;let s2=0;const M=600;for(let i=0;i<=M;i++){const t=T*i/M;const w=(i===0||i===M)?1:(i%2?4:2);s2+=w*(Math.exp(n*t)+(n%2?-1:1)*Math.exp(-n*t))*Math.exp(-x*Math.sinh(t));}s2*=T/M/3/PI;return s1-s2;}
function sphJY(n,x){let j0=Math.sin(x)/x,j1=Math.sin(x)/(x*x)-Math.cos(x)/x,y0=-Math.cos(x)/x,y1=-Math.cos(x)/(x*x)-Math.sin(x)/x;if(n===0)return[j0,y0];if(n===1)return[j1,y1];
  for(let k=1;k<n;k++){const j2=(2*k+1)/x*j1-j0,y2=(2*k+1)/x*y1-y0;j0=j1;j1=j2;y0=y1;y1=y2;}return[j1,y1];}
function legendre(n,m,x){let pmm=1;if(m>0){const s=Math.sqrt((1-x)*(1+x));let f=1;for(let i=1;i<=m;i++){pmm*=-f*s;f+=2;}}if(n===m)return pmm;let pm1=x*(2*m+1)*pmm;if(n===m+1)return pm1;let pn=0;for(let l=m+2;l<=n;l++){pn=(x*(2*l-1)*pm1-(l+m-1)*pmm)/(l-m);pmm=pm1;pm1=pn;}return pn;}
W.special={besselJ,besselY,sphJY,legendre};

const coachOf=(chId,k)=>{const c=(G.coach||{})[chId];return c?{voice:c.voice,L:c.levels&&c.levels[k]}:null;};
function playbookHTML(chId,k,compact){const c=coachOf(chId,k);if(!c||!c.L)return "";const L=c.L;

   ${L.traps&&L.traps.length?`<div class="pbsec trap"><span class="eyebrow">⚠️ Traps</span><ul>${L.traps.map(x=>`<li>${M(x)}</li>`).join("")}</ul></div>`:""}
   ${L.prather?`<div class="pbsec quote"><span class="eyebrow">🎙 Prather</span><p>${M(L.prather)}</p></div>`:""}</div>`;}
function pbSheet(chId,k){const h=playbookHTML(chId,k,false);if(!h)return;const bg=document.createElement("div");bg.className="sheet-bg";const sh=document.createElement("div");sh.className="sheet pbsheet";
  sh.innerHTML=`<div class="row between"><span class="eyebrow" style="color:var(--acc)">PLAYBOOK</span><button class="xbtn" aria-label="Close">×</button></div>${h}<button class="bigcta" data-close>Back to the round</button>`;
  sh.style.setProperty("--acc",A.chOf(chId).color);document.body.append(bg,sh);const close=()=>{bg.remove();sh.remove();};bg.onclick=close;sh.querySelector(".xbtn").onclick=close;sh.querySelector("[data-close]").onclick=close;}
G.playbookHTML=playbookHTML;
let RUN=null;
function startRun(chId,k){const ch=A.chOf(chId),W=WORLDS[chId];const rounds=[];const boss=k==="boss";
  const mk=(name,o)=>({name,...o});
  const miniR=(key,ro,hard,force)=>mk(G.mini[key].title,{run:(el,fin)=>G.mini[key].play(el,{ch,lesson:ch.lessons[0],round:ro,hard,force,sfx,M,tex,TX,scene3d:G.scene3d},fin)});
  const qR=id=>{const it=A.ITEMS[id];return mk(it.kind==="fm"?"First move":"Concept",{id,run:(el,fin)=>mcqRound(el,it,fin)});};
  const dR=l=>mk("Derivation",{run:(el,fin)=>derivRound(el,l,fin)});
  const pool=kind=>A.shuffle(A.ORDER.filter(id=>A.ITEMS[id].ch===chId&&A.ITEMS[id].kind===kind));
  const derivLs=A.shuffle(ch.lessons.filter(hasDeriv));
  let time=0;
  if(!boss&&k<=3){const key=(W.alt&&W.alt[k])||W.mini;const force=W.force&&W.force[k]&&key===W.mini?W.force[k]:undefined;for(let r=0;r<RPL;r++)rounds.push(miniR(key,k-1+(r>=3?1:0),k===3&&r>=3,force));}
  else if(k===4){const fm=pool("fm");for(let r=0;r<RPL;r++)rounds.push(r%2===1&&derivLs.length?dR(derivLs[(r>>1)%derivLs.length]):qR(fm[r%Math.max(1,fm.length)]));}
  else{time=boss?30:45;const fm=pool("fm"),cd=pool("card");const keys=[...new Set([W.mini,...Object.values(W.alt||{})])];
    const n=boss?8:RPL;for(let r=0;r<n;r++){const t=r%4;rounds.push(t===0?miniR(keys[r%keys.length],2,true):t===1&&fm.length?qR(fm[r%fm.length]):t===2&&derivLs.length&&boss?dR(derivLs[r%derivLs.length]):qR((cd.length?cd:fm)[r%(cd.length||fm.length)]));}
    if(!boss)rounds.forEach(x=>{if(x.name===G.mini[W.mini]?.title)x.time=90;});else rounds.forEach(x=>{if(x.name.length&&!x.id&&x.name!=="Derivation")x.time=90;});}
  RUN={ch:chId,k,boss,rounds,i:0,hearts:3,combo:0,best:0,score:0,wins:0,time,over:null};
  const g=gq();g.qWorlds=g.qWorlds||[];if(!g.qWorlds.includes(chId)){g.qWorlds.push(chId);bumpQuest("world2");}
  A.push({v:"run"});}
A.VIEWS.run=v=>{if(!RUN){A.back();return;}const ch=A.chOf(RUN.ch);A.setAcc(v,ch);if(RUN.over)return runEnd(v);
  if(!RUN.briefed&&coachOf(RUN.ch,RUN.k)&&coachOf(RUN.ch,RUN.k).L){const [nm,d]=RUN.boss?["Boss","8 rounds, 30 s each"]:lvName(RUN.ch,RUN.k);
    v.innerHTML=`<div class="eyebrow" style="color:var(--acc);margin-top:12px">${esc(WORLDS[RUN.ch].game.toUpperCase())} · ${RUN.boss?"BOSS":"LEVEL "+RUN.k}</div><h1 style="margin:2px 0 4px">${esc(nm)}</h1><p class="mut" style="margin:0 0 6px">${esc(d)}</p>

  const n=RUN.rounds.length,rd=RUN.rounds[RUN.i],[nm]=RUN.boss?["Boss"]:lvName(RUN.ch,RUN.k);const T=rd.time||RUN.time;
  v.innerHTML=`<div class="battle"><div class="hud"><button class="xbtn" data-quit aria-label="Leave">×</button><div class="hearts">${[0,1,2].map(i=>`<i class="${i<RUN.hearts?"on":""}">♥</i>`).join("")}</div>
   <div class="hudmid"><div class="progress"><i style="width:${100*RUN.i/n}%"></i></div><small>${esc(RUN.boss?`Boss · World ${ch.num}`:`${WORLDS[RUN.ch].game} · ${nm}`)} · ${RUN.i+1}/${n}</small></div><span class="combo2 ${RUN.combo>=2?"hot":""}">×${Math.max(1,RUN.combo)}</span>${coachOf(RUN.ch,RUN.k)&&coachOf(RUN.ch,RUN.k).L?`<button class="xbtn pbbtn" data-pb aria-label="Playbook">📖</button>`:""}</div>
   ${T?`<div class="timebar"><i data-tb></i></div>`:""}
   <section class="bub gcard" data-gcard><div class="eyebrow" style="color:var(--acc)">${esc(rd.name.toUpperCase())}</div><div data-stage></div></section><div data-fb></div>
   <p class="small mut" data-qm hidden style="text-align:center">Tap × again to leave. This run won't count.</p></div>`;
  const pbb=v.querySelector("[data-pb]");if(pbb)pbb.onclick=()=>pbSheet(RUN.ch,RUN.k);
  let qa=false;v.querySelector("[data-quit]").onclick=()=>{if(qa){clearInterval(RUN.tmr);RUN=null;A.back();}else{qa=true;v.querySelector("[data-qm]").hidden=false;}};
  let done=false;const t0=Date.now();
  const fin=(score,detail)=>{if(done)return;done=true;clearInterval(RUN.tmr);const ok=score>=0.7;if(rd.id)A.grade(rd.id,ok,true);
    const card=v.querySelector("[data-gcard]");card.classList.add(ok?"flash-ok":"flash-no");
    let head;if(ok){RUN.combo++;RUN.wins++;RUN.best=Math.max(RUN.best,RUN.combo);const mult=1+Math.min(RUN.combo-1,6)*0.25;let pts=Math.round(100*mult*(0.5+score/2));if(T)pts+=Math.round(Math.max(0,T*1000-(Date.now()-t0))/250);RUN.score+=pts;head=`+${pts}`;sfx.hit(RUN.combo);buzz(15);bumpQuest("rounds15");if(RUN.combo>=5)bumpQuest("combo5");if(rd.name==="Derivation"||rd.name==="First move")bumpQuest("moves3");}
    else{RUN.combo=0;RUN.hearts--;head=RUN.hearts>0?"−1 heart":"Out of hearts";sfx.miss();buzz([40,30,40]);document.body.classList.add("shakey");setTimeout(()=>document.body.classList.remove("shakey"),320);}
    v.querySelector(".hearts").innerHTML=[0,1,2].map(i=>`<i class="${i<RUN.hearts?"on":""}">♥</i>`).join("");const cb=v.querySelector(".combo2");cb.textContent="×"+Math.max(1,RUN.combo);cb.classList.toggle("hot",RUN.combo>=2);
    const last=RUN.hearts<=0||RUN.i+1>=n;
    v.querySelector("[data-fb]").innerHTML=`<div class="fbcard ${ok?"ok":"no"}"><b class="fbh">${head}</b>${detail?`<div class="fbw">${detail}</div>`:""}${!ok&&coachOf(RUN.ch,RUN.k)&&coachOf(RUN.ch,RUN.k).L?`<button class="btn block" data-pb2 style="margin-top:10px">📖 Show me how he solves this</button>`:""}<button class="bigcta" data-next>${last?"See results":"Next round"} ▸</button></div>`;
    v.querySelector("[data-next]").onclick=nxt;const p2=v.querySelector("[data-pb2]");if(p2)p2.onclick=()=>pbSheet(RUN.ch,RUN.k);v.querySelector("[data-fb]").scrollIntoView({block:"nearest",behavior:RM()?"auto":"smooth"});A.setKey(e=>{if(e.key==="Enter"||e.key==="ArrowRight"){nxt();return true;}});};
  const nxt=()=>{RUN.i++;if(RUN.hearts<=0||RUN.i>=n)finishRun();A.render();scrollTo(0,0);};
  if(T){const tb=v.querySelector("[data-tb]");RUN.tmr=setInterval(()=>{const f=1-(Date.now()-t0)/(T*1000);if(tb)tb.style.width=Math.max(0,f*100)+"%";if(f<=0.2&&tb)tb.classList.add("low");if(f<=0)fin(0,"⏱ Time's up.");},100);}
  rd.run(v.querySelector("[data-stage]"),fin);};
function finishRun(){const g=gq();const won=RUN.hearts>0;const stars=won?RUN.hearts:0;const xp=Math.round(RUN.score/10)+(won?40:0);let newBest=false;
  if(RUN.boss){if(won&&stars>(g.bossW[RUN.ch]||0)){g.bossW[RUN.ch]=stars;newBest=true;}if(won){bumpQuest("boss1");A.award("boss-"+RUN.ch,`World ${A.chOf(RUN.ch).num} boss defeated`,WORLDS[RUN.ch].game);}}
  else{const L=g.lv[RUN.ch]=g.lv[RUN.ch]||{};if(won&&stars>(L[RUN.k]||0)){L[RUN.k]=stars;newBest=true;}if(won){bumpQuest("clear2");if(stars===3)bumpQuest("perfect1");}}
  addXP(xp);A.markDay();A.save();RUN.over={won,stars,xp,newBest};if(won)sfx.win();else sfx.lose();if(won&&stars===3)A.confetti();}
function runEnd(v){const o=RUN.over,ch=A.chOf(RUN.ch);const nextK=!RUN.boss&&RUN.k<5&&o.won?RUN.k+1:null;
  v.innerHTML=`<section class="bub endcard ${o.won?"won":"lost"}"><div class="eyebrow">${esc(RUN.boss?`Boss · World ${ch.num}`:`${WORLDS[RUN.ch].game} · Level ${RUN.k}`)}</div>
   <h1 class="endh">${o.won?(o.stars===3?"Flawless!":"Level cleared!"):"Out of hearts"}</h1>
   <div class="bigstars">${[1,2,3].map(k=>`<span class="${k<=o.stars?"on":""}" style="animation-delay:${k*180}ms">★</span>`).join("")}</div>
   <div class="endstats"><div><b class="num" data-cnt="${RUN.score}">0</b><span>score</span></div><div><b class="num">×${RUN.best}</b><span>best combo</span></div><div><b class="num">+${o.xp}</b><span>XP</span></div></div>
   ${o.newBest?`<p class="small" style="text-align:center;color:var(--good)">New best on this level!</p>`:""}
   ${!o.won?`<p class="small mut" style="text-align:center">Every miss went to your review queue. Run it back.</p>`:""}
   <div class="grid2" style="margin-top:14px"><button class="btn" data-again>${o.won?"Play again":"Try again"}</button>${nextK?`<button class="bigcta" data-nextlv>Level ${nextK} ▸</button>`:`<button class="bigcta" data-map>World map</button>`}</div></section>`;
  const el=v.querySelector("[data-cnt]");const target=+el.dataset.cnt;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);})(t0);
  const chId=RUN.ch,k=RUN.k;const pop=()=>{const st=A.NAV.stack;while(st.length&&st[st.length-1].v==="run")st.pop();};

  A.setKey(e=>{if(e.key==="Enter"){(nx||mp).click();return true;}});}
G.unlockAll=on=>{gq().unlockAll=on;A.save();};

G.API=A;

/* Playbook (coach) for World 1 · Field Sculptor (sculptor.js). Ch. 1, L1–L5.
   Sources: transcripts 18d108b9 (L1), 6b4ee9bb (L2), 5f63d148 (L3), 7fd9142d (L4), 3141afb0 (L5); content/ch1.js; src/minis/sculptor.js.
   Convention (Balanis/Prather): n̂ points from medium 1 into medium 2; in the game medium 1 is on top, so n̂ = −ẑ. */
(function(G){ const R=String.raw; G.coach=G.coach||{}; G.coach.ch1={
 voice:R`Boundary conditions are the whole game for him. The curl-curl equations for E and H look identical, so the general solutions look identical; "the physics that makes them different" is how they meet a boundary. And because the derivative of a discontinuity blows up, he never lets you take them from the differential form: you go to the <b>integral form</b>, wrap a <b>loop</b> or a <b>pillbox</b> around the interface, and crush it. "If you take away anything from this class," he said in L4, it's boundary conditions, and the pillbox-and-loop derivation was on Exam 1.`,
 levels:{
  1:{ goal:R`Bend an E field across a dielectric interface: build $\mathbf E_2$ just below the boundary from the $\mathbf E_1$ you're given.`,
      look:[
       R`<b>Top block = medium 1</b> (its $\varepsilon_{r1}$ is printed top-left), <b>bottom block = medium 2</b> ($\varepsilon_{r2}$ bottom-left). The flat gray sheet is the interface $z=0$; the faint dashed vertical line through the origin is the normal line.`,
       R`The <b>cyan arrow E₁</b> is the given field above (it's <b>lavender</b> on an H round). White dots stream along it to show which way it points. Its <b>dashed shadow on the sheet</b> is its tangential part $(E_x,E_y)$; the rest is the normal part $E_z$.`,
       R`The <b>orange n̂ arrow points down</b> ($\hat n=-\hat z$, from medium 1 into medium 2, his convention). It only changes your answer when a source sits on the interface: then an orange tile <b>q<sub>es</sub></b> appears and + or − signs are sprinkled on the sheet.`,
       R`Tiles above the canvas: $\varepsilon_{r1}\cdot\varepsilon_{r2}$ and $\mathbf E_1=(x,y,z)$ in V/m. Sliders <b>E₂x, E₂y, E₂z</b> (0.25 steps) build your <b>gold arrow</b> below the sheet. Top-right HUD: your $|\mathbf E_2|$ and its tilt θ from the normal; the cyan θ₁ under it is the incoming tilt.`,
       R`Press <b>SCULPT ▸</b>: a dashed <b>green "true"</b> arrow appears. Grading is ±0.13 per component: normal part 60%, tangential part 40%, so the normal slider decides the round. Drag to orbit; look edge-on along the sheet to see the bend.`],
      rule:{t:"Integral form, crushed onto the interface (1-48)",tex:R`\hat n\times(\mathbf E_2-\mathbf E_1)=0,\qquad \hat n\cdot(\mathbf D_2-\mathbf D_1)=q_{es},\qquad \hat n=-\hat z\ \Rightarrow\ \varepsilon_{r2}E_{2z}=\varepsilon_{r1}E_{1z}-\frac{q_{es}}{\varepsilon_0}`},
      steps:[
       R`Split $\mathbf E_1$ against the sheet: $x$ and $y$ are <b>tangential</b>, $z$ is <b>normal</b>.`,

       R`Normal: it's <b>D</b>, not E, that's continuous (pillbox): $\varepsilon_{r1}E_{1z}=\varepsilon_{r2}E_{2z}$, so $E_{2z}=\frac{\varepsilon_{r1}}{\varepsilon_{r2}}E_{1z}$, same sign.`,
       R`If a q<sub>es</sub> tile shows (given in units of $\varepsilon_0$): $E_{2z}=\left(\varepsilon_{r1}E_{1z}-q_{es}/\varepsilon_0\right)/\varepsilon_{r2}$. The minus is $\hat n=-\hat z$ at work.`,
       R`Sanity check on the HUD: going into the larger ε the field leans <b>away</b> from the normal, $\frac{\tan\theta_2}{\tan\theta_1}=\frac{\varepsilon_2}{\varepsilon_1}$.`,
       R`Lavender (H) round or gray PEC floor? H works the same with μ (level 2); PEC rules are level 3. The last two rounds here can be either.`],
      example:{q:R`$\varepsilon_{r1}=2$ above, $\varepsilon_{r2}=8$ below, no surface charge, $\mathbf E_1=(2,-1,-4)$ V/m. Build $\mathbf E_2$.`,
       a:[R`Tangential copies: $E_{2x}=2$, $E_{2y}=-1$.`,
          R`Normal D continuous: $E_{2z}=\frac{2}{8}(-4)=-1$.`,
          R`$\mathbf E_2=(2,-1,-1)$ V/m. Check: $\tan\theta_1=\sqrt5/4$, $\tan\theta_2=\sqrt5$, ratio $4=\varepsilon_2/\varepsilon_1$: bent away from the normal.`,
          R`With $q_{es}=2\varepsilon_0$ instead, $\varepsilon_{r1}=1$, $\varepsilon_{r2}=2$, $\mathbf E_1=(1,0,-3)$: $E_{2z}=\frac{1(-3)-2}{2}=-2.5$, so $\mathbf E_2=(1,0,-2.5)$.`]},
      traps:[R`Keeping $E_n$ continuous. It's $D_n$: "D is not E" (L4).`,
       R`Upside-down ratio: $\frac{\varepsilon_{r1}}{\varepsilon_{r2}}$, not $\frac{\varepsilon_{r2}}{\varepsilon_{r1}}$ (that would be "tangential D continuous").`,
       R`Scaling the tangential part by the ε ratio. Tangential E crosses untouched.`,
       R`Sign of q<sub>es</sub>: with $\hat n=-\hat z$ it is $D_{2z}=D_{1z}-q_{es}$, not plus.`],
      prather:R`L4, after showing tangential E and normal D are both continuous: "Does that mean the field just lives forever because it doesn't see anything? ... Well, remember, D is not E." $E_n$ jumps by $\varepsilon_1/\varepsilon_2$, and that's what makes the field bend.` },
  2:{ goal:R`Same interface, magnetic side: build $\mathbf H_2$ across $\mu_{r1}\,|\,\mu_{r2}$, including a surface current $\mathbf J_s$ that makes tangential H jump.`,
      look:[
       R`H rounds are drawn in <b>lavender</b>; tiles read $\mu_{r1}\cdot\mu_{r2}$, $\mathbf H_1$ in A/m, and, when there is one, a <b>J<sub>s</sub> (A/m)</b> tile like "3x̂".`,
       R`The surface current is the <b>row of orange "Js" arrows sliding along the sheet</b>. Its direction is the whole story: a current along $\hat x$ can only change $H_y$, and vice versa.`,
       R`Sliders <b>H₂x, H₂y, H₂z</b> build the gold arrow; dashed shadows show the tangential parts of H₁ and your H₂ on the sheet so you can compare them directly. The orange n̂ still points down ($-\hat z$).`,
       R`Some rounds here are E rounds with a q<sub>es</sub> tile or a gray PEC floor: use level 1 or level 3 rules for those.`],
      rule:{t:"Ampère on the loop, ∯B·ds = 0 on the pillbox",tex:R`\hat n\times(\mathbf H_2-\mathbf H_1)=\mathbf J_s\ \Rightarrow\ \mathbf H_{2t}=\mathbf H_{1t}+\mathbf J_s\times\hat n,\qquad \mu_{r2}H_{2z}=\mu_{r1}H_{1z}`},
      steps:[
       R`Normal first: $B_n$ is always continuous (no magnetic charge): $H_{2z}=\frac{\mu_{r1}}{\mu_{r2}}H_{1z}$. J<sub>s</sub> never touches the normal part.`,
       R`No J<sub>s</sub> tile: tangential H copies straight across, $H_{2x}=H_{1x}$, $H_{2y}=H_{1y}$.`,
       R`With J<sub>s</sub>: the jump is $\mathbf J_s\times\hat n$ with $\hat n=-\hat z$. So $\mathbf J_s=J\hat x$ adds $+J$ to $H_{2y}$; $\mathbf J_s=J\hat y$ adds $-J$ to $H_{2x}$.`,
       R`Check by plugging back: $-\hat z\times(\mathbf H_2-\mathbf H_1)$ must reproduce the J<sub>s</sub> tile.`,
       R`Ignore ε on an H round (HW 1.7: "ignore ε<sub>r</sub>").`],
      example:{q:R`$\mu_{r1}=1$, $\mu_{r2}=2$, $\mathbf H_1=(2,1,-4)$ A/m, $\mathbf J_s=3\hat x$ A/m. Build $\mathbf H_2$.`,
       a:[R`Normal: $H_{2z}=\frac{1}{2}(-4)=-2$.`,
          R`Jump: $\mathbf J_s\times\hat n=3\hat x\times(-\hat z)=3\hat y$, so $H_{2y}=1+3=4$, $H_{2x}=2$.`,
          R`$\mathbf H_2=(2,4,-2)$ A/m. Check: $-\hat z\times(3\hat y)=3\hat x=\mathbf J_s$.`,
          R`(Supplemental) Physical check: a current sheet along $+\hat x$ wraps H around itself, $-\hat y$ above and $+\hat y$ below, so going down through it $H_y$ rises by J.`]},
      traps:[R`Forgetting the jump: "J<sub>s</sub> makes tangential H jump by $\mathbf J_s\times\hat n$."`,
       R`Wrong sign of the jump ($\hat n\times\mathbf J_s$ instead of $\mathbf J_s\times\hat n$).`,
       R`Putting the current into $H_z$, or using ε instead of μ for the normal part.`],
      prather:R`L3, collapsing the loop for Ampère: the $\partial\mathbf D/\partial t$ term dies because fields are distributed, "but a current source is never distributed ... as I collapse everything down, this particular term doesn't go away." In L4: fields "are by definition continuous within the medium. The only way they can be discontinuous is if you have the presence of a source."` },
  3:{ goal:R`Hit a PEC wall: build the field that survives right at the metal surface, and the surface charge or surface current it ends on.`,
      look:[
       R`The lower block turns <b>metallic gray, "▼ PEC σ = ∞"</b>, and the orange <b>n̂ now points up</b> ($+\hat z$, out of the conductor: Table 1-3 measures from the PEC side).`,
       R`The faint arrow floating up-left labeled <b>"applied"</b> just tells you the direction of the incoming field. You build the field <b>at the surface</b>, at the origin.`,
       R`There's one extra slider: <b>q<sub>es</sub>/ε₀</b> on E rounds, <b>|J<sub>s</sub>|</b> on H rounds. After SCULPT the source appears on the sheet: pink + or blue − charges, or orange J<sub>s</sub> arrows showing the current's direction.`,
       R`Grading: tangential, normal and the source each count (30/35/35%), so get all three. Non-PEC rounds with a q<sub>es</sub> or J<sub>s</sub> tile show up here too: n̂ is back to $-\hat z$ for those.`],
      rule:{t:"PEC column of Table 1-3 (n̂ out of the PEC)",tex:R`\hat n\times\mathbf E=0,\qquad \hat n\cdot\mathbf D=q_{es},\qquad \hat n\cdot\mathbf B=0,\qquad \hat n\times\mathbf H=\mathbf J_s`},
      steps:[
       R`E round: kill the tangential part, $E_x=E_y=0$: the free charges rearrange and short it out.`,
       R`Keep the normal part: $E_z$ = the applied $E_z$.`,
       R`Charge: $q_{es}=\hat z\cdot\mathbf D=\varepsilon_r\varepsilon_0E_z$, so the slider gets $\varepsilon_rE_z$. A field pointing up (away from the metal) starts on +; pointing into the metal it ends on −.`,
       R`H round: kill the normal part, $H_z=0$ (eddy currents cancel B inside); keep $H_x$, $H_y$.`,
       R`Current: $\mathbf J_s=\hat z\times\mathbf H=(-H_y,\,H_x)$; the slider wants its size $|\mathbf J_s|=\sqrt{H_x^2+H_y^2}$.`],
      example:{q:R`(a) $\varepsilon_r=2$ above a PEC, applied $\mathbf E=(2,-1,3)$ V/m. (b) Applied $\mathbf H=(3,4,-2)$ A/m on a PEC.`,
       a:[R`(a) Surface E $=(0,0,3)$ V/m; $q_{es}/\varepsilon_0=2\cdot3=6$ (positive: the field points away from the metal).`,
          R`(b) Surface H $=(3,4,0)$ A/m; $\mathbf J_s=\hat z\times\mathbf H=(-4,3)$ A/m, $|\mathbf J_s|=5$ A/m.`]},
      traps:[R`Leaving a tangential E on the metal ("tangential E must vanish on a PEC").`,
       R`$q_{es}=\varepsilon_0E_z$: you dropped $\varepsilon_r$; it's $\hat n\cdot\mathbf D$.`,
       R`Wrong charge sign: a field pointing into the PEC ends on negative charge.`,
       R`Zeroing tangential H by analogy with E. Tangential H survives; it's normal B that dies.`],
      prather:R`L4, on H at a PEC there are no charges to rearrange, so he asks if J<sub>s</sub> goes away and answers himself: "J<sub>s</sub> is not going away." The electrons spin up eddy currents whose field cancels H inside, the same eddy currents his first undergrad job used to find cracks in nuclear-reactor control-rod tubes. In L5: a normal E field "only sees one polarity," so it piles up surface charge instead of being cancelled.` },
  4:{ goal:R`Prather's moves: name the first move of a Ch. 1 problem, and rebuild his derivations (loop, pillbox, continuity, Poynting) in his order.`,
      look:[
       R`<b>First-move rounds</b>: a gray tag gives the source (HW 1.x, Concept (L3), Example (L5 slide)), then the problem and "First move?" with four numbered options (keys 1–4). After you pick, the right one lights green and his reason appears.`,
       R`<b>Derivation rounds</b>: "Rebuild <i>lesson</i> in Prather's order." Shuffled step cards, each with a short title and an equation. Tap them 1 → N; a wrong tap shakes and costs 0.25, so you can afford only one slip.`,
       R`Order is FM, derivation, FM, derivation, FM. No timer on this level: slow down and say why each step comes next.`],
      rule:{t:"Every boundary condition: integral law → straddle → crush → survivors",tex:R`\oint_C\mathbf E\cdot d\boldsymbol\ell=-\frac{\partial}{\partial t}\iint_S\mathbf B\cdot d\mathbf s\ \xrightarrow{\ \Delta y\to0\ }\ (E_{2t}-E_{1t})\Delta x=0\qquad \oint_S\mathbf D\cdot d\mathbf s=\iiint_V q_{ev}\,dv\ \xrightarrow{\ h\to0\ }\ (D_{2n}-D_{1n})\Delta A=q_{es}\Delta A`},
      steps:[
       R`"Tangential" in the question → the <b>collapsing loop</b>: Faraday's integral form for E, Ampère's for H, rectangle straddling the interface, then $\Delta y\to0$.`,
       R`"Normal" → the <b>pillbox</b> (soda can): Gauss for D, $\oint_S\mathbf B\cdot d\mathbf s=0$ for B; crush it so the side wall $2\pi rh\to0$.`,
       R`What survives the crush: distributed fields times a vanishing area or volume die; sources confined to the surface survive, $\mathbf J\Delta y\to\mathbf J_s$ and $q_{ev}\to q_{es}\delta(z)$.`,
       R`Continuity → divergence of Ampère, $\nabla\cdot\nabla\times\mathbf H=0$, swap $\nabla\cdot$ and $\frac{\partial}{\partial t}$, substitute Gauss. KVL → Faraday around the circuit loop; KCL → continuity around a node.`,
       R`Poynting → dot Faraday with H, Ampère with E, subtract, use $\nabla\cdot(\mathbf E\times\mathbf H)$. Time average → write $\mathrm{Re}\{\mathbf A\}=\frac12(\mathbf A+\mathbf A^*)$ and multiply out.`],
      example:{q:R`"Derive the boundary condition on tangential H." Build it in his order.`,
       a:[R`Ampère, integral form: $\oint_C\mathbf H\cdot d\boldsymbol\ell=\iint_S\left(\mathbf J+\frac{\partial\mathbf D}{\partial t}\right)\cdot d\mathbf s$.`,
          R`Rectangle $\Delta x$ by $\Delta y$ straddling the interface; let $\Delta y\to0$: the short sides vanish, the long sides lie on the surface and pick out the tangential parts with opposite signs, giving $(H_{2t}-H_{1t})\Delta x$.`,
          R`Right side: $\frac{\partial\mathbf D}{\partial t}\Delta x\Delta y\to0$ (distributed), but $\mathbf J\Delta y\to\mathbf J_s$ survives.`,
          R`Result: $\hat n\times(\mathbf H_2-\mathbf H_1)=\mathbf J_s$; perfect dielectric ⇒ $\mathbf J_s=0$ ⇒ tangential H continuous.`]},
      traps:[R`Starting from the differential form at the interface: the derivative of a step is infinite.`,
       R`Losing the minus sign: the two long sides of the loop run in opposite directions.`,
       R`Forgetting that normals of a closed surface always point out, so the pillbox's top and bottom normals are antiparallel.`,
       R`Killing $\mathbf J_s$ along with $\partial\mathbf D/\partial t$: a current can live on a surface; a displacement current can't.`],
      prather:R`L3: "What happens if I apply a derivative to a discontinuity? ... But I can integrate across a discontinuity." So "we have to go from the differential form to the integral form." And for the pillbox in L4: "take your foot and just crush the can."` },
  5:{ goal:R`Exam rounds: a timed mix of hard Field Sculptor builds, first moves and concept cards, the way his midterms mix homework, derivation and concept.`,
      look:[
       R`A <b>timer bar</b> runs under the HUD: 90 s on Field Sculptor rounds, 45 s on question cards. It turns red at 20%; time-out scores zero and costs a heart.`,
       R`Round order: hard Field Sculptor (any of q<sub>es</sub>, J<sub>s</sub>, PEC-E, PEC-H), first move, concept card, concept card, hard Field Sculptor.`,
       R`Your combo multiplier (×N, top-right) and speed both add score; three misses and you're out.`],
      rule:{t:"His exam format (L1 slide)",tex:R`4\ \text{questions}=2\ \text{from HW}+1\ \text{derivation from the notes}+1\ \text{arbitrary};\quad \text{no calculator, one handwritten } 8.5\times11\ \text{sheet}`},
      steps:[
       R`On a build, read the tiles in 5 s: E or H? PEC floor? A q<sub>es</sub> or J<sub>s</sub> tile? That alone picks the rule.`,
       R`Set the normal slider first: it's 60% of a dielectric round, and it's where the ε or μ ratio lives.`,
       R`On a card, name the governing law (Faraday, Ampère, Gauss, continuity) before you read the options.`,
       R`A bare "dB" is a ratio; dBm is relative to 1 mW, dBW to 1 W, dBi to isotropic (L5).`,
       R`For the real exam: put (1-48a–d) and Table 1-3 on your sheet, but expect to <b>derive</b> them from the integral form with the loop and the pillbox. That is the "1 derivation from the notes."`],
      example:{q:R`Exam-style: "Derive the boundary conditions on the normal components of D and B."`,
       a:[R`Gauss on a pillbox straddling the interface, with normals out of the closed surface.`,
          R`Crush it: side wall $2\pi rh\to0$; top gives $D_{2n}\Delta A$, bottom $-D_{1n}\Delta A$; $q_{ev}=q_{es}\delta(z)$ integrates to $q_{es}\Delta A$.`,
          R`$\hat n\cdot(\mathbf D_2-\mathbf D_1)=q_{es}$; for B, no magnetic charge ⇒ $\hat n\cdot(\mathbf B_2-\mathbf B_1)=0$.`]},
      traps:[R`Using PEC rules on a dielectric round, or the reverse. The floor color tells you.`,
       R`q<sub>es</sub> is given in units of ε₀ (C/m²): don't multiply by ε₀ again.`,
       R`Spending the clock on arithmetic: the answers land on a 0.25 grid, so if you get 1.33, recheck your ratio.`],
      prather:R`L5: "I want you to have an intuitive feel for the boundary conditions. I guarantee you're gonna see them again. So don't take it light." And from L2: midterms are in-class written exams with one 8.5×11 sheet, front and back.` },
  boss:{ goal:R`The boss: 8 rounds at 30 s each (90 s on builds), with two Field Sculptor builds, two first moves, two derivations and two concept cards.`,
      look:[
       R`Order: build, first move, derivation, card, build, first move, derivation, card. The <b>derivation rounds get only 30 s</b>, so you must know the step order cold, not reason it out.`,
       R`Builds are hard mode: q<sub>es</sub>, J<sub>s</sub> and both PEC types. Three hearts total.`],
      rule:{t:"The skeletons to own",tex:R`\text{loop: Faraday}\to\Delta y\to0\to\hat n\times\to\text{Ampère}\to\mathbf J_s\qquad \text{pillbox: Gauss}\to\text{crush}\to q_{es}\qquad \text{continuity: }\nabla\cdot(\nabla\times\mathbf H)=0\to\text{Gauss}`},
      steps:[
       R`Collapsing loop (1.11): Faraday on the loop ($\mathbf M_i=0$) → $\Delta y\to0$ → vector form → Ampère on the same loop → result.`,
       R`Pillbox (1.12): Gauss on the pillbox → crush it → result → no-surface-charge case → magnetic case.`,
       R`Continuity (1.6): start from Ampère → take the divergence → div curl = 0, swap → Gauss → integral form.`,
       R`Poynting (1.16): curl equations with all currents → dot and subtract → identity → differential form → volume integral + divergence theorem → stored-energy terms.`,
       R`Time-average Poynting (1.18): instantaneous S → real part as a sum → multiply out → pair conjugates → average over $T=2\pi/\omega$.`],
      example:{q:R`Boss derivation: "Rebuild the time-average Poynting vector" in 30 s.`,
       a:[R`$\boldsymbol{\mathcal S}=\boldsymbol{\mathcal E}\times\boldsymbol{\mathcal H}$ (1-66) → $\boldsymbol{\mathcal E}=\frac12(\mathbf Ee^{j\omega t}+\mathbf E^*e^{-j\omega t})$ (1-67) → multiply out (1-68) → pair conjugates (1-69) → average: $\mathbf S_{av}=\frac12\mathrm{Re}(\mathbf E\times\mathbf H^*)$ (1-70).`,
          R`Tip: the Balanis equation numbers in the step titles run in order. Use them to check yourself, not as a crutch.`]},
      traps:[R`Reasoning a derivation from scratch at 30 s: rehearse the five skeletons until they're reflex.`,
       R`On builds, flipping n̂: it's $-\hat z$ for a dielectric interface and $+\hat z$ (out of the metal) on PEC rounds.`],
      prather:R`The L1 "recipe for success" slide: understand every step between slides, do every assigned problem, and "be able to derive every concept presented in class."` }
 } };

/* Playbook for World 11 (Aperture Ace: equivalence, apertures, patterns). Sources: L17 transcript 8eb701a7
   (far-field condition derivation, N and L, Example 6-4, E/H planes, circular aperture, exam format), L18 transcript
   5f01e25c (scattering recap), L17 slides, content/ch11.js and content/ch6.js. "look"/"steps" describe exactly what
   src/minis/dipole.js draws (rounds aim, null, far; region appears in the hard mix). (Supplemental) = not from class. */
(function(G){ const R=String.raw; G.coach=G.coach||{}; G.coach.ch11={
 voice:R`Scattering and antennas, he said, are "not a whole lot different. It just happens to be that one's intentional." The FAA radar at Philadelphia airport doesn't bounce off the plane like a ball: it drives currents on the skin, and "that induced current then re-radiates." An aperture is a rect function in space, so its far field is a sinc in angle, the Fourier transform you already know from pulses. And he was explicit about the exam: know the Cartesian stuff.`,
 levels:{
  1:{ goal:R`Aim the probe at a named level of a Hertzian dipole's far-field pattern: the maximum, a null, the half-power (−3 dB) direction, or where $|E_\theta|$ is half its maximum.`,
   look:[
    R`<b>The scene:</b> the orange bar is the dipole along <b>z</b> (screen up; axes are x red, y green, z blue). The white arrow on it is the current flipping each half cycle. The translucent orange <b>doughnut</b> is the power pattern $\sin^2\theta$: its radius in any direction is the power radiated that way.`,
    R`<b>On the gray sphere:</b> cyan arrows are the far-field $\mathbf E$ ($E_\theta$, running along the meridians, parallel to the wire's direction as seen from there). Lavender arrows are $\mathbf H$ ($H_\phi$, circling the wire). Arrows are bright at the equator and fade toward the poles, which is the $\sin\theta$ itself.`,
    R`<b>The probe:</b> the gold line and dot, set by the <b>θ</b> slider (from +z, 0–180°) and the <b>φ</b> slider (around z). After FIRE a <b>green ring</b> marks every correct direction, the whole cone, at every φ.`,
    R`Along the wire the doughnut pinches down to nothing (its "hole"): that pinch is the null. Drag to orbit if the probe hides behind the doughnut.`],
   rule:{t:"Far field of a Hertzian dipole (L16 slides, reviewed in L17)", tex:R`E_\theta\simeq j\eta\frac{\beta I_0l\sin\theta}{4\pi r}e^{-j\beta r},\qquad \frac{E_\theta}{H_\phi}=\eta=120\pi,\qquad \text{power}\propto\sin^2\theta=L\ \Rightarrow\ \theta=\arcsin\sqrt L`},
   steps:[
    R`Translate the target into a power level $L$: max means $L=1$; null means $L=0$; half-power (−3 dB) means $L=\frac12$; half the <i>field</i> ($|E_\theta|=\frac12$ max, −6 dB) means $L=\frac14$.`,
    R`Solve $\sin^2\theta=L$: max at $\theta=90^\circ$ (broadside), null at $0^\circ$ or $180^\circ$ (along the wire), −3 dB at $45^\circ$ or $135^\circ$, −6 dB at $30^\circ$ or $150^\circ$.`,
    R`Set θ. Leave φ alone: the pattern is symmetric around the wire, so φ doesn't matter. You're graded on the angle from the wire, within about 3°.`,
    R`Before you FIRE, check the picture: the probe should touch the doughnut where it's fattest (max), where it pinches to zero (null), or partway down its flank.`],
   example:{q:R`"Aim at a direction where $|E_\theta|$ is half its maximum."`,
    a:[R`Half the field means a quarter of the power: $\sin\theta=\frac12$, so $\sin^2\theta=\frac14$.`,
     R`$\theta=30^\circ$ (or $150^\circ$), any φ. That's −6 dB.`,
     R`Compare half <i>power</i>: $\sin^2\theta=\frac12$ gives $\theta=45^\circ$, so the half-power beamwidth is $135^\circ-45^\circ=90^\circ$.`]},
   traps:[
    R`<b>Field vs power.</b> Half the field is at 30°, half the power at 45°. Read the prompt: "half-power" means $|E|^2$, "$|E_\theta|$ is half" means $|E|$.`,
    R`<b>Putting the null broadside.</b> The dipole is dark <i>along its own axis</i> and loudest perpendicular to it.`,
    R`<b>Hunting with φ.</b> It does nothing for a z-directed dipole. (In the Level 5 mix the dipole may lie along x or y; then measure the angle from <i>that</i> axis, because the doughnut just tips over.)`],
   prather:R`L17, taking the far-field limit of the dipole: the only terms that survive are $H_\phi$ and $E_\theta$, each going as $1/r$, their ratio is "377 ohms," and the power goes "in the radial direction, which is outward from the sphere, which makes a lot of sense."` },

  2:{ goal:R`Uniform rectangular aperture (Example 6-4, $\mathbf E_a=\hat yE_0$): set θ on the <b>first null</b> of the E-plane or H-plane pattern.`,
   look:[
    R`<b>The scene:</b> the orange rectangle is the aperture, $a$ along x and $b$ along y; the axis it radiates along (+z, blue) points to the right. The cyan arrows inside it are $\mathbf E_a$, all along $y$.`,
    R`<b>The gold translucent fan</b> is the cut you're asked about, labeled "E-plane, φ = 90°" (the yz-plane, which contains $\mathbf E_a$) or "H-plane, φ = 0°" (the xz-plane). For H-plane rounds the camera looks down from above.`,
    R`<b>θ slider</b> (0–90°): the gold ray and arc measure θ from the z axis (broadside), not from the aperture face.`,
    R`<b>After FIRE:</b> the bright cyan curve is the pattern in your plane, the dim lavender curve is the other plane's, and green dots mark the true nulls. The wider side always gives the narrower curve.`],
   rule:{t:"Principal planes of Example 6-4 (L17 slides)", tex:R`\text{E-plane }(\phi=90^\circ):\ E_\theta=\frac C2(1+\cos\theta)\frac{\sin\left(\frac{\beta b}{2}\sin\theta\right)}{\frac{\beta b}{2}\sin\theta};\qquad \text{H-plane }(\phi=0):\ \frac{\beta a}{2}\sin\theta\ \text{in place of}\ \frac{\beta b}{2}\sin\theta;\qquad \frac{\beta d}{2}\sin\theta=\pi\Rightarrow\sin\theta=\frac{\lambda}{d}`},
   steps:[
    R`<b>Which plane, which side?</b> The E-plane contains $\mathbf E_a$ ($\hat y$) and the axis, so it's $\phi=90^\circ$ and depends only on $b$. The H-plane is $\phi=0^\circ$ and depends only on $a$. The other dimension drops out (its sinc → 1 by L'Hôpital).`,
    R`Get that dimension in wavelengths. If it's given in cm at a frequency, $\lambda[\text{cm}]=30/f[\text{GHz}]$ (10 GHz gives 3 cm).`,
    R`First null: the sinc's argument hits π, so $\sin\theta=\lambda/d$, and $\theta=\arcsin(\lambda/d)$.`,
    R`Sanity: a bigger $d/\lambda$ gives a smaller null angle (narrower beam). The $(1+\cos\theta)$ factor never makes a null for $\theta<90^\circ$.`],
   example:{q:R`Fig. 6-7's aperture, $a=3\lambda$, $b=2\lambda$. First null in each plane? Then $a=4\lambda$, $b=2.5\lambda$, H-plane.`,
    a:[R`E-plane uses $b$: $\sin\theta=\frac{1}{2}$, so <b>θ = 30.0°</b>.`,
     R`H-plane uses $a$: $\sin\theta=\frac13$, so <b>θ = 19.47°</b>, narrower, because $a$ is wider.`,
     R`$a=4\lambda$, H-plane: $\sin\theta=\frac14$, so <b>θ = 14.48°</b>. (The E-plane would be $\arcsin0.4=23.58^\circ$.)`]},
   traps:[
    R`<b>Using the wrong side.</b> The E-plane goes with $b$, the side along $\mathbf E_a$; the H-plane goes with $a$. Set φ = 90° ↔ b, φ = 0° ↔ a in your head.`,
    R`<b>Dropping the ½ in the sinc.</b> Setting $\beta d\sin\theta=\pi$ gives $\sin\theta=\lambda/2d$, which is half the true angle. The argument is $\frac{\beta d}{2}\sin\theta$.`,
    R`<b>Measuring θ from the aperture face.</b> θ is from the z axis (broadside).`,
    R`(Flag) In the L17 recording, the spoken E/H labels for the broad and narrow curves come out garbled. Trust the slide math: E-plane ↔ $b$.`],
   prather:R`L17, on why it's a sinc: "spatial frequency corresponds effectively to a plane wave that's propagating relative to an off-axis angle... I need to take all these different angles and sum them all up to reconstruct this physical aperture." And on the two planes: "In one case, I get a much more narrow beam. The other case, I get a much wider beam. This is because we have asymmetry in the aperture."` },

  3:{ goal:R`An $a\times b$ aperture radiates at $f$. For each of three observers ①②③, decide <b>far field</b> or <b>not yet</b>.`,
   look:[
    R`<b>The scene:</b> the orange aperture (with cyan $\mathbf E_a$ arrows) sits at the left; the dashed gray line is the observation axis (+z, to the right). The white dots ①②③ are the observers; distances along the axis are log-scaled, so equal gaps mean equal <i>ratios</i>.`,
    R`For each observer, tap <b>far field</b> or <b>not yet</b>; FIRE needs all three. All three right scores full, two right scores partial.`,
    R`<b>After FIRE:</b> a gold disk appears on the axis at $2D^2/\lambda$, a gold diagonal labeled <b>D</b> crosses the aperture, and the dots turn green (far) or red (not far).`,
    R`On the 4th and 5th rounds of this level, one observer sits just 8–30% past the line. Compute it; don't eyeball it.`],
   rule:{t:"Fraunhofer criterion (L17 board derivation)", tex:R`\Delta R_{max}=\frac{(D/2)^2}{2R},\qquad \frac{2\pi}{\lambda}\frac{D^2}{8R}\le\frac{\pi}{8}\ \Rightarrow\ R\ge\frac{2D^2}{\lambda},\qquad D=\sqrt{a^2+b^2},\quad R\gg D,\ R\gg\lambda`},
   steps:[
    R`$\lambda=c/f$. In cm: $\lambda=30/f[\text{GHz}]$.`,
    R`$D$ is the <b>largest</b> dimension of the aperture: for a rectangle, the diagonal $\sqrt{a^2+b^2}$, not the long side.`,
    R`$R_{ff}=2D^2/\lambda$. Keep units consistent (cm² ÷ cm = cm), then convert to m to compare.`,
    R`Each observer at $r\ge R_{ff}$ is far field; anything closer is "not yet." (At these sizes $R\gg D$ and $R\gg\lambda$ come along automatically, but he lists them as conditions too.)`],
   example:{q:R`A 12 cm × 9 cm aperture at 10 GHz. Observers at 1.2 m, 2.0 m and 0.5 m.`,
    a:[R`$\lambda=3$ cm, $D=\sqrt{144+81}=15$ cm, $R_{ff}=\frac{2(225)}{3}=150$ cm $=$ <b>1.5 m</b>.`,
     R`2.0 m: <b>far field</b>. 0.5 m: <b>not yet</b>.`,
     R`1.2 m: <b>not yet</b>. It beats $2a^2/\lambda=0.96$ m (long side only) and $D^2/\lambda=0.75$ m (no 2), but neither is the criterion.`]},
   traps:[
    R`<b>The long side instead of the diagonal.</b> The game plants an observer between $2a^2/\lambda$ and $2D^2/\lambda$ to catch exactly this.`,
    R`<b>Dropping the 2</b> ($D^2/\lambda$), which halves the distance.`,
    R`<b>Using the point-source test ($\beta r\gg1$) for an aperture.</b> That's the dipole's region test. For a big aperture, the size $D$ is what sets the far field.`,
    R`<b>cm vs m.</b> Write the units on every line.`],
   prather:R`L17, after the derivation: setting the quadratic phase error to π/8 "will assure you that there's no phase deviation more than 22.5 degrees." Then "we have to know that R is much, much greater than D, and R much, much greater than λ. When this happens, then we are literally in the far field." Why phase and not amplitude: the phase "very much depends on a fraction of the wavelength," while "adding some little fraction of a lambda to R is not gonna change the overall magnitude."` },

  4:{ goal:R`<b>Prather's moves:</b> First-move cards (Examples 6-4, 6-5, 6-6 and the L17 concepts) alternating with Derivation rounds: equivalent currents, N and L, the far-field summary, the rectangular procedure, E/H planes, the circular aperture.`,
   look:[
    R`<b>First move:</b> a problem and four candidate first moves. The wrong ones are his classic slips: the ground-plane rule used off a ground plane, the wrong-plane $r'\cos\psi$, $L_\theta$ paired with $E_\theta$, integrating fields instead of currents.`,
    R`<b>Derivation:</b> a lesson's math lines, shuffled. Tap them in his order.`],
   rule:{t:"The rectangular-coordinates procedure (L17 summary slide)", tex:R`\mathbf J_s=\hat n\times\mathbf H_a,\ \mathbf M_s=-\hat n\times\mathbf E_a\ \to\ N_\theta,N_\phi,L_\theta,L_\phi\ (6\text{-}125)\ \to\ r'\cos\psi,\ ds'\ \to\ E_\theta\simeq-\frac{j\beta e^{-j\beta r}}{4\pi r}(L_\phi+\eta N_\theta),\ E_\phi\simeq\frac{j\beta e^{-j\beta r}}{4\pi r}(L_\theta-\eta N_\phi)`},
   steps:[
    R`<b>"Fields given in an opening":</b> convert to currents first: $\mathbf J_s=\hat n\times\mathbf H_a$, $\mathbf M_s=-\hat n\times\mathbf E_a$. <b>On an infinite PEC ground plane:</b> $\mathbf M_s=-2\hat n\times\mathbf E_a$, $\mathbf J_s=0$ (image theory, Example 6-6).`,
    R`<b>"A plate hit by a wave":</b> the incident E induces the current, since the metal has to kill the tangential field. (Example 6-5's physical-optics $\mathbf J_s=2\hat n\times\mathbf H^i$ is on the slides but was not lectured.)`,
    R`<b>"Far-zone A, define N":</b> $R\approx r-r'\cos\psi$ in the phase, $R\approx r$ in the amplitude; pull $\frac{\mu e^{-j\beta r}}{4\pi r}$ out, and $\mathbf N=\iint\mathbf J_se^{j\beta r'\cos\psi}ds'$.`,
    R`<b>Pick the plane's phase and area:</b> xy-plane: $r'\cos\psi=x'\sin\theta\cos\phi+y'\sin\theta\sin\phi$, $ds'=dx'dy'$ (yz and xz by analogy, (6-127), (6-128)).`,
    R`<b>Assemble with the cross-pairing:</b> $E_\theta$ takes $L_\phi$ and $N_\theta$; $E_\phi$ takes $L_\theta$ and $N_\phi$; $E_r\simeq H_r\simeq0$.`],
   example:{q:R`Example 6-4 skeleton: $\mathbf E_a=\hat yE_0$, $\mathbf H_a=-\hat xE_0/\eta$ over $|x'|\le a/2$, $|y'|\le b/2$, no ground plane.`,
    a:[R`Currents ($\hat n=\hat z$): $\mathbf M_s=-\hat z\times\hat yE_0=\hat xE_0$, $\mathbf J_s=\hat z\times(-\hat xE_0/\eta)=-\hat yE_0/\eta$.`,
     R`Each integral is $\int_{-a/2}^{a/2}e^{jcx'}dx'=a\frac{\sin(ca/2)}{ca/2}$, his generic-$c$ trick, so $S=\frac{\sin X}{X}\frac{\sin Y}{Y}$ with $X=\frac{\beta a}{2}\sin\theta\cos\phi$, $Y=\frac{\beta b}{2}\sin\theta\sin\phi$.`,
     R`$N_\theta=-\frac{abE_0}{\eta}\cos\theta\sin\phi\,S$, $N_\phi=-\frac{abE_0}{\eta}\cos\phi\,S$, $L_\theta=abE_0\cos\theta\cos\phi\,S$, $L_\phi=-abE_0\sin\phi\,S$.`,
     R`$E_\theta=\frac C2\sin\phi(1+\cos\theta)S$, $E_\phi=\frac C2\cos\phi(1+\cos\theta)S$, with $C=j\frac{\beta abE_0e^{-j\beta r}}{2\pi r}$. The $(1+\cos\theta)$ is J and M adding.`]},
   traps:[
    R`<b>Dropping one current</b> off a ground plane: both $\mathbf J_s$ and $\mathbf M_s$ radiate in Example 6-4.`,
    R`<b>Forgetting the factor 2</b> (and keeping $\mathbf J_s$) on a ground plane.`,
    R`<b>Sign flags:</b> one L17 summary slide prints $E_\phi\simeq-j\ldots$; the derivation gives $+j$. The "Far-Field (total)" slide also has sign typos in $E_\phi$, $H_\phi$ (see Lesson 11.4).`,
    R`<b>Fields as sources.</b> You never integrate $\mathbf E_a$ with $e^{-j\beta R}/R$ directly; convert to currents.`],
   prather:R`L18 recap: "Don't let these L's and N's confuse you. They just represent integrals." And L17, on why this matters: "when we come to things like scattering problems, we essentially solve for the currents, or we're given the currents," and then push them through the integral.` },

  5:{ goal:R`<b>Exam rounds:</b> a timed mix, 45 s per card. The Radiation Range rounds get 90 s and come in hard variants: a dipole lying along x or y, near/intermediate/far with $r$ in wavelengths, the far-field line, and nulls with the aperture given in cm at a frequency.`,
   look:[
    R`<b>Tipped dipole (aim):</b> the orange bar and doughnut lie along x or y. The pattern is $\sin^2\psi$ with ψ measured from <i>that</i> axis. The max is anywhere in the plane perpendicular to the wire (straight up z, θ = 0, works); the nulls are along the wire (θ = 90° and φ = 0°/180° for x, 90°/270° for y).`,
    R`<b>Near or far? (region):</b> three probes ①②③ labeled with $r$ in λ, each tracing its $\mathbf E$ tip over one cycle (a cyan loop). Near the wire the loop is fat and has a big radial part; far out it collapses to a line perpendicular to $\hat r$. Tap near / interm. / far for each.`,
    R`<b>Nulls in cm:</b> convert first. The same E-plane ↔ b, H-plane ↔ a rule applies.`],
   rule:{t:"Region test for the dipole (powers of βr)", tex:R`E_\theta\propto\left[1+\frac{1}{j\beta r}-\frac{1}{(\beta r)^2}\right],\qquad \beta r=\frac{2\pi r}{\lambda}:\ \ \beta r\ll1\ \text{near (reactive)},\quad \beta r\sim1\ \text{intermediate},\quad \beta r\gg1\ \text{far}`},
   steps:[
    R`Convert everything first: $\beta r=2\pi r/\lambda$ ($0.2\lambda$ is already $\beta r\approx1.3$), $\lambda=30/f[\text{GHz}]$ cm.`,
    R`Region by which term wins: $1/(\beta r)^2$ and $1/(\beta r)^3$ dominate near (reactive), all comparable in the middle, only $1/r$ far.`,
    R`Write the setup line before any arithmetic (which plane, which dimension, which formula). On Exam 1 he allowed no calculators and one handwritten sheet, front and back, so the numbers are built to be simple.`,
    R`Know the Cartesian procedure cold; he said he wouldn't hold you accountable for the Bessel details of the circular aperture.`],
   example:{q:R`Hard aim: dipole along x. Aim at a null.`,
    a:[R`The null is along the wire itself: the ±x axis.`,
     R`In the sliders: <b>θ = 90°, φ = 0°</b> (or φ = 180°). Setting θ = 0 is the old z-dipole reflex, and here that's the <i>maximum</i>.`]},
   traps:[
    R`Classifying $r$ in λ as if it were $\beta r$: multiply by $2\pi$ first.`,
    R`Measuring ψ from z for a tipped dipole.`,
    R`Spending 90 s on the circular-aperture Bessel algebra: he flagged it as low priority.`],
   prather:R`L17 on the exam: "you can count on at least one problem being very similar to one [homework] problem, not identical." At the end of the scattering lecture: "I won't hold you accountable for a lot of this stuff on the exam, especially this [Bessel] stuff, but you should definitely know the Cartesian stuff." In the L18 recap he noted scattering wasn't on Exam 1: "It will be on the next one."` },

  boss:{ goal:R`<b>Boss:</b> 8 rounds at 30 s each. First moves on the aperture and plate examples, a derivation to order, concept cards, and one hard Radiation Range round (90 s).`,
   look:[
    R`The header tells you the type: <b>First move</b>, <b>Derivation</b>, <b>Concept</b>, or <b>RADIATION RANGE</b>. For the game round, read which sub-round it is (aim, region, far, null) before touching a slider.`],
   rule:{t:"Three numbers that end most rounds", tex:R`\sin\theta_{null}=\frac{\lambda}{d}\ (d=b\ \text{E-plane},\ a\ \text{H-plane}),\qquad R_{ff}=\frac{2D^2}{\lambda}\ (D=\text{diagonal}),\qquad \text{HPBW}_{dipole}=90^\circ`},
   steps:[
    R`Equivalence cards: tangential H gives $\mathbf J_s=\hat n\times\mathbf H$; tangential E gives $\mathbf M_s=-\hat n\times\mathbf E$ (mind the minus); a ground plane gives $-2\hat n\times\mathbf E$ and no J.`,
    R`Radiation-vector cards: $\mathbf N\leftrightarrow\mathbf J_s,\ \mu$; $\mathbf L\leftrightarrow\mathbf M_s,\ \varepsilon$; $E_\theta$ pairs $L_\phi$ with $N_\theta$.`,
    R`Pattern cards: a rect in space is a sinc in angle; the wider side gives the narrower beam; a circle gives $J_1(x)/x$, the sombrero, with $\frac{J_1(x)}{x}\to\frac12$ on axis.`,
    R`Scattering cards: a metal skin carries induced current that re-radiates; "physics happens at the boundary."`],
   example:{q:R`Card: "Rectangular aperture $a=3\lambda$ (x), $b=2\lambda$ (y), $\mathbf E_a$ along y. Which principal plane has the broader beam?"`,
    a:[R`The E-plane (φ = 90°), set by $b=2\lambda$: first null at 30°, vs 19.47° in the H-plane. The smaller dimension gives the broader beam.`]},
   traps:[R`Swapping $\mathbf J_s$ and $\mathbf M_s$ under the clock.`,R`Answering "E-plane depends on a" because $a$ is listed first.`],
   prather:R`L15 (and again in L17), the airplane: "We always think about it just bouncing off. And yeah, to the zeroth order, that's correct. But what really happens..." is that the incident field induces surface current on the skin, and that current re-radiates. "Physics happens at the boundary."` }
 } };
