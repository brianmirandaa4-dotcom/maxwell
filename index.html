   rule:{t:"PEC ↔ PMC duality (HW 8.10, 8.11)", tex:R`\text{PEC: TE}\to\cos\cdot\cos\ (\text{TE}_{10}),\ \text{TM}\to\sin\cdot\sin\ (\text{TM}_{11})\qquad\text{PMC: TE}\to\sin\cdot\sin\ (\text{TE}_{11}),\ \text{TM}\to\cos\cdot\cos\ (\text{TM}_{10})`},
   steps:[
    R`First line on paper: which family (which potential), which walls. That's half the partial credit before any number appears.`,
    R`Write the cutoff formula symbolically, then plug in. On Exam 1 there were no calculators (one handwritten sheet, front and back), so work in ratios: $\sqrt{m^2+(n\,a/b)^2}$, $\sqrt{\varepsilon_r}$, $1-(f_c/f)^2$.`,
    R`Sanity-check every answer: $Z^{TE}>\eta$, $Z^{TM}<\eta$, $\lambda_g>\lambda$, $v_g<v<v_p$, $v_pv_g=v^2$.`,
    R`Answer exactly what's asked. On Exam 1 he pointed out that some people derived reflection coefficients when he'd asked for Snell's law: "I did not ask you for that."`],
   example:{q:R`Hard round: WR-90 with PMC walls, air, $f=20$ GHz. Find $Z_w$ of the lowest TE$^z$ mode.`,
    a:[R`PMC flips TE to $\sin\cdot\sin$, so TE$_{10}$ doesn't exist; the lowest TE is <b>TE$_{11}$</b>.`,
     R`$(f_c)_{11}=6.562\sqrt{1+2.25^2}=16.16$ GHz, $s=\sqrt{1-(16.16/20)^2}=0.5894$.`,
     R`$Z^{TE}=\frac{376.99}{0.5894}=$ <b>639.6 Ω</b>. (The trap answer uses TE$_{10}$, $s=0.9446$, and gives 399.1 Ω; the feedback will call it out.)`]},
   traps:[
    R`Carrying the PEC answer into a PMC problem (TE$_{10}$ "dominant" with PMC walls).`,
    R`Spending the whole 90 s on arithmetic: set up the ratio, then compute once.`,
    R`In filled-guide tuning, forgetting that the <i>whole ladder</i> shifts, not just TE$_{10}$.`],
   prather:R`About the exams, L18: the final is "6 questions," structurally like the midterms: derivations, "maybe some homework problems, and some other crazy stuff." Exam 1 averaged 72, and he grades coarsely, in chunks of about five points, so a clear setup earns real partial credit. L17: "at least one problem being very similar to one [homework] problem, not identical." He also said he wouldn't weight the potential-based waveguide formulation very heavily, so expect the physics (cutoff, modes, impedance) more than the A/F bookkeeping.` },

  boss:{ goal:R`<b>Boss:</b> 8 rounds at 30 s each. HW-level first moves, a derivation to order, concept cards, and one hard Mode Hunter round (90 s).`,
   look:[
    R`The round header tells you the type: <b>First move</b>, <b>Derivation</b>, <b>Concept</b>, or <b>MODE HUNTER</b>. Decide in the first two seconds which playbook you're in.`,
    R`For the Mode Hunter round: check for dashed lavender walls (PMC) before anything else, then E only / H only, then count.`],
   rule:{t:"The four facts the whole world rests on", tex:R`(f_c)_{10}=\frac{c}{2a\sqrt{\varepsilon_r}},\qquad \frac{(f_c)_{mn}}{(f_c)_{10}}=\sqrt{m^2+\left(n\frac ab\right)^2},\qquad Z_w^{TE/TM}=\eta\left[1-\left(\frac{f_c}{f}\right)^2\right]^{\mp1/2},\qquad v_pv_g=v^2`},
   steps:[
    R`First move cards: name the quantity the keyword asks for ($v_g$, $\beta_z$, $Z_w$, $\lambda_g$, the cutoff ratio), then the medium ($\varepsilon_r$), then the mode.`,
    R`Derivation: TE goes potential → separate → bottom → top → sides → result; TM goes potential → sines → fields; cutoff goes constraint → $f_c$ → regimes.`,
    R`Concept cards: answer from the picture. Cutoff is half a wavelength across $a$; $m$ counts half-cycles across $a$; TE sits above η, TM below; nothing physical moves at $v_p$.`,
    R`If you're unsure, eliminate the impossible first: TM$_{10}$ with metal walls, $\varepsilon_r$ instead of $\sqrt{\varepsilon_r}$, $b$ in TE$_{10}$'s cutoff.`],
   example:{q:R`HW 8.10 card: "Dielectric rod modeled with PMC walls. TE$^z$ modes: BCs, potential, lowest mode." First move?`,
    a:[R`$\mathbf F=\hat zF_z$, and $H_z\propto F_z$ is tangential to every wall, so $F_z$ itself must vanish there: $\sin\cdot\sin$, lowest TE$_{11}$. It's the dual of PEC TM.`]},
   traps:[R`Reflexively answering "TE$_{10}$" for "lowest mode" without checking the walls and $a>b$.`,R`Mixing $|\mathbf E|$ conditions with $|\mathbf H|$ conditions under the clock: PEC zeroes tangential E, PMC zeroes tangential H.`],
   prather:R`L17, before Exam 1: "I'm not trying to throw you curveballs... I'm just trying to see what you know... I'm your biggest advocate for this subject." And if you don't know something entirely, he said, write down your best attempt anyway, because he gives partial credit.` }
 } };

/* MAXWELL — QUIZ ARENA. Every homework problem is its own playable mini-game, because Prather's quizzes are one HW

   def = {id, like (1–5), why, min (est. minutes), scene:{kind,...}|fn(p), orig:{params}, gen(hard)->params,
          st(p)->statement ($tex$ ok), first:{ok, bad:[..]}, solve(p)->{stages:[...], steps:[[title,tex,note]]}}
   stage = {q, k (label), u (unit), v (true value), tol (rel), s (step index), alt:[other accepted values]}  numeric
         | {q, opts:[..], a (index of right one), s, why}                                                  choice      */
window.MXG=window.MXG||{mini:{}};
(function(G){

G.hwU={C0,ETA0,f3:(x,n)=>{n=n||4;if(!isFinite(x))return"—";const a=Math.abs(x);if(a!==0&&(a>=1e5||a<1e-3))return x.toExponential(n-1).replace("e","×10^");return(+x.toPrecision(n)).toString();},
  pick:a=>a[Math.floor(Math.random()*a.length)],rnd:(lo,hi,st)=>{const n=Math.round((hi-lo)/st);return +(lo+st*Math.floor(Math.random()*(n+1))).toFixed(6);}};
G.hwArena=function(A,E){

const flames=n=>`<span class="hwlike" aria-label="likelihood ${n} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

A.VIEWS.play=(v,p)=>{origPlay(v,p);const q=quizCh();if(!q.c)return;const ch=A.chOf(q.c);const L=defs(q.c),S=st();const done=L.filter(d=>(S[d.id]||{}).stars>=3).length;
  const u=q.ev?A.until(q.ev.t):null;const b=document.createElement("button");b.className="bub hwcard";b.style.setProperty("--acc",ch.color||"#FF9F5A");
  b.innerHTML=`<span class="eyebrow" style="color:var(--acc)">QUIZ ARENA${u?` · ${esc(q.ev.title)} in ${u.n} ${u.u}`:""}</span><b class="hwh">Every HW problem, as a game</b>

A.VIEWS.hwlist=(v,p)=>{const chId=p.ch||quizCh().c,ch=A.chOf(chId);A.setAcc(v,ch);const L=defs(chId),S=st();const q=quizCh();const u=q.ev&&q.c===chId?A.until(q.ev.t):null;
  v.innerHTML=`<div class="ptop"><button class="xbtn" data-back aria-label="Back">‹</button><h1 style="margin:0 0 0 6px">Quiz Arena</h1></div>
  <div class="chips hwchips">${chs().map(c=>{const x=A.chOf(c);return `<button class="chipbtn" aria-pressed="${c===chId}" data-c="${c}">Ch. ${esc(x.num)}</button>`;}).join("")}</div>
  <section class="bub prof"><span class="eyebrow" style="color:var(--acc)">CH. ${esc(ch.num)} HOMEWORK${u?` · QUIZ IN ${u.n} ${u.u.toUpperCase()}`:""}</span>

 st:p=>`Two dielectric slabs, $\\varepsilon_{r1}=${p.er1}$ (${p.t1} cm thick) and $\\varepsilon_{r2}=${p.er2}$ (${p.t2} cm thick), are stacked between parallel plates of area ${p.A} cm². A ${p.V}-V source is connected and maintained across the plates. Find E and D in each slab, the plate charge, and the capacitance of each slab and the total.`,

  const st=[["Interface condition",`D_{1n}=D_{2n}:\\ ${p.er1}\\varepsilon_0E_1=${p.er2}\\varepsilon_0E_2\\ \\Rightarrow\\ E_2=${T(p.er1/p.er2)}E_1`,"No free charge on the interface, and E is normal to it.","Normal $D$ is continuous across a charge-free interface."],
   ["Voltage sum",`${p.V}=E_1(${t1})+E_2(${t2})\\ \\Rightarrow\\ E_1=\\boxed{${T(E1)}\\ \\text{V/m}},\\quad E_2=\\boxed{${T(E2)}\\ \\text{V/m}}`,"The low-$\\varepsilon$ slab takes the bigger field.","Substitute $E_2$ in terms of $E_1$ into $E_1t_1+E_2t_2=V$."],

   ["Capacitances",`C_1=\\frac{${p.er1}\\varepsilon_0A}{t_1}=${T(C1*1e12)}\\ \\text{pF},\\quad C_2=${T(C2*1e12)}\\ \\text{pF},\\quad C_T=\\frac{C_1C_2}{C_1+C_2}=\\boxed{${T(CT*1e12)}\\ \\text{pF}}`,`Check: $Q/V=${T(Q/p.V*1e12)}$ pF.`,"Stacked layers are in series."]];

/* ---- 2.1 uniform P ---- */
L.push({id:"2.1",like:5,min:6,why:"Two rules ($q_{vp}=-\\nabla\\cdot\\mathbf P$, $q_{sp}=\\mathbf P\\cdot\\hat n$) and one ratio for $\\varepsilon_r$. The lecture used these exact numbers. Fits a quiz easily.",
 orig:{ax:"y",P:2.762e-11,E:2},
 gen(){const er=pick([2.56,2.25,4,5,9,3.2]),E=pick([0.5,1,2,5,10]);return{ax:pick(["x","y","z"]),P:sig(EPS*(er-1)*E),E};},
 st:p=>`The polarization inside a rectangular dielectric slab, whose faces are perpendicular to the coordinate axes, is uniform: $\\mathbf P=\\hat a_${p.ax}${T(p.P)}$ C/m² when the field inside is $\\mathbf E=\\hat a_${p.ax}${p.E}$ V/m. Find (a) the volume and surface polarization (bound) charge densities, (b) the net bound charge, (c) the electric susceptibility and dielectric constant.`,
 first:{ok:"Uniform $\\mathbf P$ means $q_{vp}=-\\nabla\\cdot\\mathbf P=0$ immediately. Then $q_{sp}=\\mathbf P\\cdot\\hat n$, face by face, with the outward normal.",bad:["$q_{sp}=|\\mathbf P|$ on all six faces of the slab.","$\\chi_e=P/E$, then find the charges from $\\varepsilon_r$."]},
 solve(p){const a=p.ax,chi=p.P/(EPS*p.E),er=1+chi;
  const st=[["Volume bound charge",`q_{vp}=-\\nabla\\cdot\\mathbf P=-\\frac{\\partial P_${a}}{\\partial ${a}}=0`,"A constant has no divergence.","Uniform means constant."],
   [`Surface bound charge on the $\\pm ${a}$ faces`,`q_{sp}=\\mathbf P\\cdot\\hat n=\\pm${T(p.P)}\\ \\text{C/m}^2\\quad(\\hat n=\\pm\\hat a_${a})`,"Outward normal: + on the face the dipoles point toward.","$q_{sp}=\\mathbf P\\cdot\\hat n$ with the outward normal."],
   ["Other four faces",`\\hat a_${a}\\cdot\\hat n=0\\ \\Rightarrow\\ q_{sp}=0`,"$\\mathbf P$ is tangent to them.",""],
   ["Net bound charge","Q_p=(+q_{sp})A-(q_{sp})A+0=0","Polarization only moves charge. It never creates it.",""],
   ["Susceptibility (2-10a)",`\\chi_e=\\frac{P}{\\varepsilon_0E}=\\frac{${T(p.P)}}{(${EPST})(${p.E})}=\\boxed{${T(chi)}}`,"$\\chi_e$ is dimensionless, so $\\varepsilon_0$ must be there.","$\\mathbf P=\\varepsilon_0\\chi_e\\mathbf E$."],
   ["Dielectric constant (2-12)",`\\varepsilon_r=1+\\chi_e=\\boxed{${T(er)}}`,"",""]];
  return{steps:st,stages:[
   {q:"(a) Volume bound charge density $q_{vp}$?",opts:["$0$: uniform $\\mathbf P$ has no divergence","$-P$ divided by the slab thickness","$|\\mathbf P|$ spread through the volume"],a:0,s:0,why:"$q_{vp}=-\\nabla\\cdot\\mathbf P$, and a constant vector has zero divergence."},
   {q:"Which faces carry surface bound charge?",opts:[`Only the two $\\pm ${a}$ faces, where $\\mathbf P\\parallel\\hat n$`,"All six faces","The four faces parallel to $\\mathbf P$"],a:0,s:2,why:"$\\mathbf P\\cdot\\hat n=0$ wherever $\\mathbf P$ is tangent to the face."},
   {k:"q_sp",q:`Surface bound charge density on the $+${a}$ face?`,u:"\\text{C/m}^2",v:p.P,s:1},
   {k:"χ_e",q:"(c) Electric susceptibility?",u:"",v:chi,s:4},
   {k:"ε_r",q:"(c) Dielectric constant?",u:"",v:er,s:5}]};}});

/* ---- 2.15 V fixed, parallel sets ---- */

 gen(){return{A:pick([0.01,0.02,0.05]),d:pick([1,2,4,5]),V:pick([50,100,200]),er:pick([2.56,2.25,4,5])};},
 st:p=>`Two sets of parallel plates, each of area $${T(p.A)}$ m² and separation ${p.d} cm, are connected in parallel to a ${p.V}-V source. One set has free space between its plates; the other is filled with a dielectric of $\\varepsilon_r=${p.er}$. Find E, D, the charge, capacitance and stored energy of each, and the totals.`,
 first:{ok:"Source maintained, same $V$ and $d$: $E=V/d$ in both sets. Then $D=\\varepsilon E$, $Q=DA$, $C=\\varepsilon A/d$.",bad:["$E$ in the filled set is $V/(d\\varepsilon_r)$, smaller by $\\varepsilon_r$.","The sets are in series, so they share the same charge."]},
 solve(p){const d=p.d/100,E=p.V/d,D0=EPS*E,Dp=p.er*D0,Q0=D0*p.A,Qp=Dp*p.A,C0=EPS*p.A/d,Cp=p.er*C0,CT=C0+Cp,W0=0.5*C0*p.V*p.V,Wp=0.5*Cp*p.V*p.V,WT=W0+Wp;
  const st=[["E",`E=\\frac{${p.V}}{${d}}=${T(E)}\\ \\text{V/m (both)}`,"Fixed $V$ and $d$ fix $E$.","$E=V/d$."],
   ["D",`D_0=\\varepsilon_0(${T(E)})=${T(D0)},\\qquad D_p=${p.er}D_0=${T(Dp)}\\ \\text{C/m}^2`,"",""],
   ["Charge",`Q_0=D_0A=${T(Q0*1e9)}\\ \\text{nC},\\qquad Q_p=${T(Qp*1e9)}\\ \\text{nC}`,"The dielectric raises D and Q, not E.","$Q=DA$."],
   ["Capacitance",`C_0=\\frac{\\varepsilon_0A}{d}=${T(C0*1e12)}\\ \\text{pF},\\quad C_p=${T(Cp*1e12)}\\ \\text{pF},\\quad C_T=\\boxed{${T(CT*1e12)}\\ \\text{pF}}`,"Parallel: capacitances add.","$C_T=C_0+C_p$."],
   ["Energy",`W_0=\\tfrac12C_0V^2=${T(W0*1e9)}\\ \\text{nJ},\\quad W_p=${T(Wp*1e9)}\\ \\text{nJ},\\quad W_T=\\boxed{${T(WT*1e9)}\\ \\text{nJ}}`,"","$W=\\tfrac12CV^2$."]];
  return{steps:st,stages:[
   {q:"How do the fields in the two sets compare?",opts:["Same $E$, larger $D$ in the filled set","Same $D$, smaller $E$ in the filled set","Same $E$ and same $D$"],a:0,s:0,why:"Both sets see the same $V$ across the same $d$. The dielectric shows up in $D=\\varepsilon E$."},
   {k:"E",q:"$E$ between the plates?",u:"\\text{V/m}",v:E,s:0},
   {k:"Q_p",q:"Charge on the filled set?",u:"\\text{nC}",v:Qp*1e9,s:2},
   {k:"C_T",q:"Total capacitance?",u:"\\text{pF}",v:CT*1e12,s:3},
   {k:"W_T",q:"Total stored energy?",u:"\\text{nJ}",v:WT*1e9,s:4}]};}});

/* ---- 2.11 Q fixed, isolated ---- */
L.push({id:"2.11",like:4,min:7,why:"One decision (charge is frozen on each capacitor separately), then $E=D/\\varepsilon$ twice. It tests the fixed-$Q$ idea directly.",

 st:p=>`Two separate parallel-plate capacitors, each with plate area ${p.A} cm² and separation ${p.d} cm, are charged in free space to ${p.V0} V and the supply is removed. The capacitors are not connected to each other. Slabs with $\\varepsilon_r=${p.er1}$ and $\\varepsilon_r=${p.er2}$, each filling its capacitor's gap, are then inserted. Find the charge, D, E, voltage and capacitance of each.`,
 first:{ok:`Charge is conserved separately on each capacitor: freeze $D=\\varepsilon_0V_0/d$ in both, then $E=D/\\varepsilon$.`,bad:["Treat them as parallel: one common voltage and shared charge.","Keep $V=V_0$ and find the new charge from $C$."]},
 solve(p){const d=p.d/100,A=p.A*1e-4,E0=p.V0/d,D=EPS*E0,Q=D*A,E1=D/(p.er1*EPS),E2=D/(p.er2*EPS),V1=E1*d,V2=E2*d,C1=p.er1*EPS*A/d,C2=p.er2*EPS*A/d;
  const st=[["Before",`E_0=\\frac{${p.V0}}{${d}}=${T(E0)}\\ \\text{V/m},\\quad D=\\varepsilon_0E_0=${T(D)}\\ \\text{C/m}^2,\\quad Q=DA=${T(Q*1e12)}\\ \\text{pC}`,"Same in both capacitors, and it stays that way.","Battery gone, no wire between them: each $Q$ is frozen."],
   ["E after",`E_1=\\frac{D}{${p.er1}\\varepsilon_0}=${T(E1)}\\ \\text{V/m},\\qquad E_2=\\frac{D}{${p.er2}\\varepsilon_0}=${T(E2)}\\ \\text{V/m}`,"","$E=D/(\\varepsilon_r\\varepsilon_0)$ with the frozen $D$."],
   ["Voltages",`V_1=E_1d=\\boxed{${T(V1)}\\ \\text{V}},\\qquad V_2=\\boxed{${T(V2)}\\ \\text{V}}`,"Different voltages are fine because the capacitors are isolated.","$V=Ed$."],
   ["Capacitances",`C_1=\\frac{${p.er1}\\varepsilon_0A}{d}=${T(C1*1e12)}\\ \\text{pF},\\qquad C_2=${T(C2*1e12)}\\ \\text{pF}`,"C is geometry and material only.",""]];
  return{steps:st,stages:[
   {q:"After the slabs go in, what stays fixed?",opts:["Each capacitor's own charge (so its $D$)","The voltage on each, $V_0$","The total charge, shared at a common voltage"],a:0,s:0,why:"No source and no wire between them, so charge can't go anywhere."},
   {k:"Q",q:"Charge on each capacitor?",u:"\\text{pC}",v:Q*1e12,s:0},
   {k:"E_1",q:`$E$ in the $\\varepsilon_r=${p.er1}$ capacitor?`,u:"\\text{V/m}",v:E1,s:1},
   {k:"V_1",q:`Voltage on the $\\varepsilon_r=${p.er1}$ capacitor?`,u:"\\text{V}",v:V1,s:2},

/* ---- 2.19 uniform M ---- */
L.push({id:"2.19",like:4,min:7,why:"The magnetic twin of 2.1: $\\nabla\\times\\mathbf M$ and $\\mathbf M\\times\\hat n$. The trap (which faces) is exactly the kind of thing he checks.",
 orig:{M:1.245e6,H:5e3},
 gen(){const mur=pick([250,100,500,1000,50,2000]),H=pick([100,500,1e3,2e3,5e3]);return{M:sig((mur-1)*H),H};},
 st:p=>`A rectangular ferrimagnetic slab, with faces perpendicular to the coordinate axes, is uniformly magnetized: $\\mathbf M=\\hat a_z${T(p.M)}$ A/m when $\\mathbf H=\\hat a_z${T(p.H)}$ A/m inside. Find (a) the volume and surface magnetization current densities, (b) the net magnetization current, (c) the magnetic susceptibility and relative permeability.`,
 first:{ok:"Uniform $\\mathbf M$ gives $\\mathbf J_{mv}=\\nabla\\times\\mathbf M=0$. Then $\\mathbf J_{ms}=\\mathbf M\\times\\hat n$, face by face.",bad:["Put $\\mathbf J_{ms}=\\mathbf M$ on the $\\pm z$ faces, where $\\mathbf M$ points.","Use $\\mathbf J_{ms}=\\hat n\\times\\mathbf M$ on every face."]},
 solve(p){const chi=p.M/p.H,mur=1+chi;
  const st=[["Volume current","\\mathbf J_{mv}=\\nabla\\times\\mathbf M=0","Constant vector.",""],
   ["$\\pm z$ faces","\\hat a_z\\times(\\pm\\hat a_z)=0\\ \\Rightarrow\\ \\mathbf J_{ms}=0","$\\mathbf M$ is normal there.",""],
   ["$\\pm x$ faces",`\\mathbf J_{ms}=\\mathbf M\\times(\\pm\\hat a_x)=\\pm\\hat a_y${T(p.M)}\\ \\text{A/m}`,"$\\hat a_z\\times\\hat a_x=\\hat a_y$.","$\\mathbf J_{ms}=\\mathbf M\\times\\hat n$, outward normal."],
   ["$\\pm y$ faces",`\\mathbf J_{ms}=\\mathbf M\\times(\\pm\\hat a_y)=\\mp\\hat a_x${T(p.M)}\\ \\text{A/m}`,"Together: counterclockwise seen from $+z$, like a solenoid winding.",""],
   ["Net current","I_{net}=0","A closed loop: every bit going one way comes back the other.",""],
   ["Susceptibility and permeability",`\\chi_m=\\frac MH=\\frac{${T(p.M)}}{${T(p.H)}}=${T(chi)},\\qquad \\mu_r=1+\\chi_m=\\boxed{${T(mur)}}`,"","$\\mathbf M=\\chi_m\\mathbf H$, $\\mu_r=1+\\chi_m$."]];
  return{steps:st,stages:[
   {q:"Which faces carry surface magnetization current?",opts:["The four side faces ($\\pm x$, $\\pm y$), where $\\mathbf M$ is tangent","The $\\pm z$ faces, where $\\mathbf M$ is normal","All six faces"],a:0,s:1,why:"$\\mathbf M\\times\\hat n=0$ when $\\mathbf M\\parallel\\hat n$. Current lives where $\\mathbf M$ is tangent, the opposite of bound charge."},
   {k:"|J_ms|",q:"Magnitude of $\\mathbf J_{ms}$ on a side face?",u:"\\text{A/m}",v:p.M,s:2},
   {q:"Direction of $\\mathbf J_{ms}$ on the $+x$ face?",opts:["$+\\hat a_y$","$-\\hat a_y$","$+\\hat a_z$"],a:0,s:2,why:"$\\hat a_z\\times\\hat a_x=+\\hat a_y$."},
   {k:"χ_m",q:"(c) Magnetic susceptibility?",u:"",v:chi,s:5},
   {k:"μ_r",q:"(c) Relative permeability?",u:"",v:mur,s:5}]};}});

const METALS=[{n:"Aluminum",s:3.96e7,m:0.0022},{n:"Copper",s:5.8e7,m:0.0032},{n:"Silver",s:6.17e7,m:0.0056}];
L.push({id:"2.25",like:4,min:7,why:"A five-link chain of one-line formulas ($\\sigma=-\\mu_eq_{ve}$ to $N_e$). Pure plug-and-chug with sign traps, ideal for 10 minutes.",

 gen(){const X=pick(METALS);return{n:X.n,s:X.s,m:X.m,E:pick([0.5,1,2,5]),A:pick([1,4,10,25])};},
 st:p=>`${p.n} has conductivity $\\sigma=${T(p.s)}$ S/m and electron mobility $\\mu_e=${p.m}$ m²/(V·s). A field $\\mathbf E=\\hat a_x${p.E}$ V/m is applied to a ${p.n.toLowerCase()} bar of cross section ${p.A} cm². Find (a) the electron charge density $q_{ve}$, (b) the electron drift velocity, (c) the current density, (d) the current, (e) the number of free electrons per m³.`,
 first:{ok:"Chain in order: $\\sigma=-\\mu_eq_{ve}$ (2-66c), then $\\mathbf v_e=-\\mu_e\\mathbf E$, $\\mathbf J=q_{ve}\\mathbf v_e$, $I=JA$, $N_e=|q_{ve}|/e$.",bad:["$q_{ve}=\\sigma\\mu_e$, then $\\mathbf v_e=+\\mu_e\\mathbf E$.","Start from $N_e$ using copper's density and atomic weight."]},

  const st=[["Charge density (2-66c)",`q_{ve}=-\\frac{\\sigma}{\\mu_e}=-\\frac{${T(p.s)}}{${p.m}}=\\boxed{${T(q)}\\ \\text{C/m}^3}`,"Electrons: the charge density is negative.","$\\sigma=-\\mu_eq_{ve}$."],
   ["Drift velocity",`\\mathbf v_e=-\\mu_e\\mathbf E=-\\hat a_x(${p.m})(${p.E})=\\hat a_x(${T(v)})\\ \\text{m/s}`,"Against $\\mathbf E$, because electrons are negative. Millimeters per second.","$\\mathbf v_e=-\\mu_e\\mathbf E$."],
   ["Current density",`\\mathbf J=q_{ve}\\mathbf v_e=(${T(q)})(${T(v)})\\hat a_x=\\hat a_x${T(J)}\\ \\text{A/m}^2`,`Check: $\\sigma E=${T(p.s*p.E)}$.`,"$\\mathbf J=q_{ve}\\mathbf v_e$, which must equal $\\sigma\\mathbf E$."],
   ["Current",`I=JA=(${T(J)})(${T(A)})=\\boxed{${T(I/1e3)}\\ \\text{kA}}`,`${p.A} cm² = $${T(A)}$ m².`,"Convert cm² to m²."],
   ["Electron density",`N_e=\\frac{|q_{ve}|}{e}=\\frac{${T(-q)}}{1.602\\times10^{-19}}=\\boxed{${T(N)}\\ \\text{m}^{-3}}`,"About $10^{29}$ per m³: that's why a tiny drift is a huge current.","$N_e=|q_{ve}|/e$."]];
  return{steps:st,stages:[
   {k:"q_ve",q:"(a) Electron charge density $q_{ve}$ (with sign)?",u:"\\text{C/m}^3",v:q,s:0},

   {k:"J",q:"(c) Current density $J_x$?",u:"\\text{A/m}^2",v:J,s:2},
   {k:"I",q:"(d) Current?",u:"\\text{kA}",v:I/1e3,s:3},
   {k:"N_e",q:"(e) Free electrons per m³?",u:"\\text{m}^{-3}",v:N,s:4}]};}});

 solve(p){const Pk=p.Pk*1e-12,a=p.a/100,b=p.b/100,qa=-Pk/(a*a),qb=Pk/(b*b),Q=4*PI*Pk,chi=Pk/(EPS*p.Ek),er=1+chi;
  const st=[["Volume bound charge",`q_{vp}=-\\frac{1}{r^2}\\frac{\\partial}{\\partial r}\\left(r^2P_r\\right)=-\\frac{1}{r^2}\\frac{\\partial}{\\partial r}\\left(${T(Pk)}\\right)=0`,"$1/r^2$ is the divergence-free radial field.","Use the spherical divergence, with the $r^2$."],

   ["Net","Q_p=0","",""],
   ["Susceptibility",`\\chi_e=\\frac{P}{\\varepsilon_0E}=\\frac{${T(Pk)}}{(${EPST})(${p.Ek})}=${T(chi)}\\ \\Rightarrow\\ \\varepsilon_r=\\boxed{${T(er)}}`,"The $1/r^2$ cancels between P and E.","$\\chi_e=P/(\\varepsilon_0E)$, $\\varepsilon_r=1+\\chi_e$."]];
  return{steps:st,stages:[
   {q:"(a) $q_{vp}$ inside the shell?",opts:["$0$: $r^2P_r$ is constant","$-\\partial P_r/\\partial r\\neq0$","$-P_r/r$"],a:0,s:0,why:"Spherical divergence: $\\frac1{r^2}\\frac{\\partial}{\\partial r}(r^2P_r)$, and $r^2P_r$ doesn't depend on $r$."},

const ex=x=>Math.floor(Math.log10(Math.abs(x))+1e-9);                          // decade
const sc=(x,u)=>{const n=ex(x);return{v:x/Math.pow(10,n),u:R`\times10^{${n}}\ `+u};}; // mantissa + TeX unit
const cxs=(a,b)=>{const jb=b===0?"":(Math.abs(b)===1?"j":"j"+Math.abs(b));if(a===0)return b===0?"0":(b<0?"-":"")+jb;if(b===0)return ""+a;return a+(b<0?"-":"+")+jb;};
const term=(v,a,b)=>(a<0||(a===0&&b<0))?`-${v}(${cxs(-a,-b)})`:`${v}(${cxs(a,b)})`;
const join=(...t)=>t.reduce((s,x,i)=>i===0?x:s+(x[0]==="-"?x:"+"+x),"");
const L=[];

/* ---- 4.11 read β ---- */
const BET=[[2,3],[1,2],[1,3],[1,1],[4,3],[2,5],[1,5],[3,4]];
L.push({id:"4.11",like:5,min:6,why:"Read $\\beta_0$ off the exponent, then $\\lambda$, $f$ and $\\mathbf H=\\hat\\beta\\times\\mathbf E/\\eta_0$. Three short answers, the first thing he'd check you can do.",
 orig:{n:2,d:3,E0:1,s:1},
 gen(){const[n,d]=pick(BET);return{n,d,E0:pick([1,2,5,10]),s:pick([1,-1])};},
 st:p=>`The complex electric field of a time-harmonic field in free space is given by $\\mathbf E=\\hat a_z${p.E0===1?"":p.E0+"\\times "}10^{-3}(1+j)e^{${p.s>0?"-":"+"}j${p.n===p.d?"":"("+p.n+"/"+p.d+")"}\\pi x}$. Assuming the distance $x$ is measured in meters, find the (a) wavelength (in meters), (b) frequency, (c) associated magnetic field.`,
 first:{ok:"Read $\\beta_0$ from the exponent: the number multiplying $x$ (with its $\\pi$) is $\\beta_0$, and the sign gives the direction.",bad:["The coefficient of $x$ is the wavelength, so $\\lambda$ is that number in meters.","Start from $f$: the field is at 100 MHz unless told otherwise, so $\\lambda=3$ m."]},
 solve(p){const b=p.n/p.d*Math.PI,lam=2*Math.PI/b,F=C0/lam,Hy=-p.s*p.E0*1e-3/ETA0;
  const dir=p.s>0?"+\\hat a_x":"-\\hat a_x";
  const st=[["(a) Read $\\beta_0$",R`\beta_0=\frac{${p.n}\pi}{${p.d}}=${f(b)}\ \text{rad/m}\ \Rightarrow\ \lambda=\frac{2\pi}{\beta_0}=${f(lam)}\ \text{m}`,"The coefficient is $\\beta$, never $\\lambda$.","$\\lambda=2\\pi/\\beta_0$."],
   ["(b) Frequency",R`f=\frac{c}{\lambda}=\frac{3\times10^8}{${f(lam)}}=${f(F/1e6)}\ \text{MHz}`,"Free space, so $v=c$.","$f=c/\\lambda$."],
   ["Direction",R`e^{${p.s>0?"-":"+"}j\beta_0x}\ \Rightarrow\ \hat\beta=${dir}`,"$e^{-j\\boldsymbol\\beta\\cdot\\mathbf r}$ is the convention: a $+$ in the exponent means $-x$.",""],
   ["(c) H",R`\mathbf H=\frac{1}{\eta_0}\hat\beta\times\mathbf E=\frac{(${dir})\times\hat a_z}{120\pi}${p.E0}\times10^{-3}(1+j)e^{\cdots}=${p.s>0?"-":"+"}\hat a_y${tx(Math.abs(Hy))}(1+j)e^{\cdots}\ \text{A/m}`,"$\\hat a_x\\times\\hat a_z=-\\hat a_y$.","$\\mathbf H=\\hat\\beta\\times\\mathbf E/\\eta_0$."],
   ["Maxwell check",R`H_y=-\frac{1}{j\omega\mu_0}\left(-\frac{\partial E_z}{\partial x}\right)=${p.s>0?"-":"+"}\frac{\beta_0}{\omega\mu_0}E_z=${p.s>0?"-":"+"}\frac{E_z}{\eta_0}`,"",""]];
  return{steps:st,stages:[{k:"(a) λ",q:"(a) Wavelength?",u:"\\text{m}",v:lam,s:0},{k:"(b) f",q:"(b) Frequency?",u:"\\text{MHz}",v:F/1e6,s:1},
   {q:"(c) $\\mathbf H$ points along:",opts:[`$${p.s>0?"-":"+"}\\hat a_y$`,`$${p.s>0?"+":"-"}\\hat a_y$`,"$\\hat a_x$"],a:0,s:3,why:`$\\hat\\beta=${dir}$ and $\\mathbf H\\propto\\hat\\beta\\times\\hat a_z$. H is never along $\\hat\\beta$.`},
   {k:"(c) H_y",q:"(c) $H_y$ coefficient multiplying $(1+j)e^{\\cdots}$ (sign included)?",u:"\\mu\\text{A/m}",v:Hy*1e6,s:3}]};}});

/* ---- 4.9 H0, S_av, energy ---- */
L.push({id:"4.9",like:5,min:7,why:"Ohm's law for waves, $|E|^2/2\\eta$, and the $\\frac12$ vs $\\frac14$ energy trap. Four numbers in under 10 minutes.",
 orig:{E0:1},
 gen(){return{E0:pick([0.5,1,2,3,5,10,20])};},
 st:p=>`A uniform plane wave traveling inside an unbounded free-space medium has peak electric and magnetic fields given by $\\mathbf E=\\hat a_xE_0e^{-j\\beta_0z}$, $\\mathbf H=\\hat a_yH_0e^{-j\\beta_0z}$, where $E_0=${p.E0}$ mV/m. (a) Evaluate $H_0$. (b) Find the corresponding average power density. (c) Determine the volume electric and magnetic energy densities. Evaluate all the constants.`,
 first:{ok:"$H_0=E_0/\\eta_0$, then $S_{av}=E_0^2/2\\eta_0$, then $w_e=w_m=\\frac12\\varepsilon_0E_0^2\\cos^2(\\omega t-\\beta_0z)$.",bad:["$H_0=E_0\\eta_0$, then $S_{av}=E_0H_0$.","Only E was given, so $w_m=0$ and all the energy is electric."]},
 solve(p){const E=p.E0*1e-3,H=E/ETA0,S=E*E/(2*ETA0),we=0.5*EPS0*E*E,wa=we/2;const Ss=sc(S,"\\text{W/m}^2"),Ws=sc(we,"\\text{J/m}^3"),Wa=sc(wa,"\\text{J/m}^3");
  const st=[["(a) $H_0$",R`H_0=\frac{E_0}{\eta_0}=\frac{${tx(E)}}{377}=${tx(H)}\ \text{A/m}`,"Ohm's law for waves.","$H_0=E_0/\\eta_0$."],
   ["(b) Power",R`\mathbf S_{av}=\hat a_z\frac{E_0^2}{2\eta_0}=\hat a_z\frac{(${tx(E)})^2}{754}=\hat a_z${tx(S)}\ \text{W/m}^2`,"(4-11). Peak amplitudes carry the $\\frac12$.","$S_{av}=E_0^2/(2\\eta_0)$."],
   ["(c) Electric",R`w_e=\tfrac12\varepsilon_0E_0^2\cos^2(\omega t-\beta_0z)=${tx(we)}\cos^2(\omega t-\beta_0z)\ \text{J/m}^3`,"(4-8a).","$\\frac12\\varepsilon_0E_0^2$ is the peak."],
   ["Magnetic equals electric",R`w_m=\tfrac12\mu_0H_0^2\cos^2=\tfrac12\mu_0\frac{E_0^2}{\eta_0^2}\cos^2=\tfrac12\varepsilon_0E_0^2\cos^2=w_e`,"$\\mu_0/\\eta_0^2=\\varepsilon_0$.",""],
   ["Time averages",R`\langle w_e\rangle=\langle w_m\rangle=\tfrac14\varepsilon_0E_0^2=${tx(wa)}\ \text{J/m}^3`,"$\\langle\\cos^2\\rangle=\\frac12$.","Half the peak."],
   ["Consistency",R`(\langle w_e\rangle+\langle w_m\rangle)c=${tx(2*wa)}(3\times10^8)=${tx(2*wa*C0)}=S_{av}`,"$v_e=S/w=c$ (4-9).",""]];
  return{steps:st,stages:[{k:"(a) H₀",q:"(a) $H_0$?",u:"\\mu\\text{A/m}",v:H*1e6,s:0},{k:"(b) S_av",q:"(b) Average power density magnitude?",u:Ss.u,v:Ss.v,s:1},
   {k:"(c) w_e peak",q:"(c) Peak of $w_e$ (the coefficient of $\\cos^2$)?",u:Ws.u,v:Ws.v,s:2},
   {q:"(c) Compared with $w_e$, the magnetic energy density is:",opts:["Equal, at every instant","Zero, since only E was given","Smaller by $\\eta_0^2$"],a:0,s:3,why:"$\\frac12\\mu_0(E_0/\\eta_0)^2=\\frac12\\varepsilon_0E_0^2$ for a single traveling wave."},
   {k:"⟨w_e⟩",q:"(c) Time-average $\\langle w_e\\rangle$?",u:Wa.u,v:Wa.v,s:4}]};}});

/* ---- 4.13 isotropic source ---- */
L.push({id:"4.13",like:5,min:7,why:"$P/4\\pi r^2$ then plane-wave relations, with a frequency distractor and the rms-vs-peak trap. A textbook 10-minute quiz.",
 orig:{f:11,P:50,r:3},
 gen(){return{f:pick([2.4,5.8,11,18,24,28]),P:pick([10,20,50,100,200,500]),r:pick([0.5,1,2,3,5,10])};},
 st:p=>`An ${p.f}-GHz transmitter radiates its power isotropically in a free-space medium. Assuming its total radiated power is ${p.P} mW, at a distance of ${p.r} km, find the (a) time-average power density, (b) RMS electric and magnetic fields, (c) total time-average volume energy densities. In all cases, specify the units.`.replace(/^An (\d)/,(m,d)=>(d==="1"||d==="8"?"An ":"A ")+d),
 first:{ok:"$S_{av}=P_{rad}/4\\pi r^2$. The frequency is a distractor.",bad:["Start from $\\beta_0=2\\pi f/c$, since the fields need the phase constant.","$S_{av}=P_{rad}/\\pi r^2$, then $E_{rms}=\\sqrt{2\\eta_0S_{av}}$."]},
 solve(p){const r=p.r*1e3,S=p.P*1e-3/(4*Math.PI*r*r),E=Math.sqrt(ETA0*S),H=E/ETA0,w=S/C0;const Ss=sc(S,"\\text{W/m}^2"),Es=sc(E,"\\text{V/m}"),Hs=sc(H,"\\text{A/m}"),Ws=sc(w,"\\text{J/m}^3");
  const st=[["(a) Spherical spreading",R`S_{av}=\frac{P_{rad}}{4\pi r^2}=\frac{${tx(p.P*1e-3)}}{4\pi(${tx(r)})^2}=${tx(S)}\ \text{W/m}^2`,`Nothing depends on the ${p.f} GHz.`,"Area of a sphere: $4\\pi r^2$."],
   ["RMS form",R`S_{av}=\frac{E_{rms}^2}{\eta_0}=\eta_0H_{rms}^2`,"No $\\frac12$ with rms values.",""],
   ["(b) E",R`E_{rms}=\sqrt{\eta_0S_{av}}=\sqrt{377(${tx(S)})}=${tx(E)}\ \text{V/m}`,`Peak $=\\sqrt2\\times$ rms $=${tx(E*Math.SQRT2)}$ V/m.`,"$E_{rms}=\\sqrt{\\eta_0S_{av}}$."],
   ["(b) H",R`H_{rms}=\frac{E_{rms}}{\eta_0}=${tx(H)}\ \text{A/m}`,"",""],
   ["(c) Energy",R`w_{av}=\frac{S_{av}}{v_e}=\frac{${tx(S)}}{3\times10^8}=${tx(w)}\ \text{J/m}^3`,`Equivalently $\\varepsilon_0E_{rms}^2$; split evenly, $w_e=w_m=${tx(w/2)}$ J/m³.`,"$w=S_{av}/c$."]];
  return{steps:st,stages:[{k:"(a) S_av",q:"(a) Time-average power density?",u:Ss.u,v:Ss.v,s:0},
   {q:"With rms fields, the plane-wave power density is:",opts:["$S_{av}=E_{rms}^2/\\eta_0$","$S_{av}=E_{rms}^2/2\\eta_0$","$S_{av}=2E_{rms}^2/\\eta_0$"],a:0,s:1,why:"$E_{peak}^2/2\\eta_0=E_{rms}^2/\\eta_0$: the $\\frac12$ is already inside the rms."},
   {k:"(b) E_rms",q:"(b) RMS electric field?",u:Es.u,v:Es.v,s:2},{k:"(b) H_rms",q:"(b) RMS magnetic field?",u:Hs.u,v:Hs.v,s:3},
   {k:"(c) w_av",q:"(c) Total time-average energy density?",u:Ws.u,v:Ws.v,s:4}]};}});

/* ---- 4.3 E from H, power ---- */
L.push({id:"4.3",like:5,min:10,why:"$\\mathbf E=\\eta_0\\mathbf H\\times\\hat\\beta$, one cross product, then instantaneous and average $\\mathbf S$. Exactly his L12 emphasis on getting the order right.",
 orig:{a:1,b:-2,s:1},
 gen(){let a,b;do{a=pick([-3,-2,-1,1,2,3]);b=pick([-3,-2,-1,1,2,3]);}while(a===b);return{a,b,s:pick([1,1,-1])};},
 st:p=>`The complex $\\mathbf H$ field of a uniform plane wave, traveling in an unbounded source-free medium of free space, is given by $\\mathbf H=\\frac{1}{120\\pi}(${join(`${p.a===1?"":p.a===-1?"-":p.a}\\hat a_x`,`${p.b===1?"":p.b===-1?"-":p.b}\\hat a_y`)})e^{${p.s>0?"-":"+"}j\\beta_0z}$. Find the (a) corresponding electric field, (b) instantaneous power density vector, (c) time-average power density.`,
 first:{ok:`Read $\\hat\\beta$ from the exponent sign, then $\\mathbf E=\\eta_0\\mathbf H\\times\\hat\\beta$.`,bad:["$\\mathbf E=\\eta_0\\hat\\beta\\times\\mathbf H$.","$\\mathbf E=\\mathbf H/\\eta_0$, same direction as H."]},
 solve(p){const Ex=p.s*p.b,Ey=-p.s*p.a,mag=p.a*p.a+p.b*p.b,Sam=mag/ETA0,Sav=Sam/2;const dz=p.s>0?"+":"-";
  const st=[["Direction and $\\eta$",R`e^{${p.s>0?"-":"+"}j\beta_0z}\Rightarrow\hat\beta=${dz}\hat a_z,\qquad \eta_0=120\pi`,"",""],
   ["(a) Shortcut",R`\mathbf E=\eta_0\mathbf H\times\hat\beta=(${p.a}\hat a_x+(${p.b})\hat a_y)\times(${dz}\hat a_z)\,e^{\cdots}=(${Ex}\hat a_x+(${Ey})\hat a_y)e^{\cdots}`,"$\\hat a_x\\times\\hat a_z=-\\hat a_y$, $\\hat a_y\\times\\hat a_z=\\hat a_x$.","$\\mathbf E=\\eta_0\\mathbf H\\times\\hat\\beta$; the $120\\pi$ cancels."],
   ["Answer (a)",R`\mathbf E=(${Ex}\hat a_x+(${Ey})\hat a_y)e^{${p.s>0?"-":"+"}j\beta_0z}\ \text{V/m}`,`Check $\\mathbf E\\cdot\\mathbf H\\propto(${Ex})(${p.a})+(${Ey})(${p.b})=0$.`,""],
   ["Real fields",R`\boldsymbol{\mathcal E}=(${Ex}\hat a_x+(${Ey})\hat a_y)\cos(\omega t${p.s>0?"-":"+"}\beta_0z),\quad \boldsymbol{\mathcal H}=\frac{${p.a}\hat a_x+(${p.b})\hat a_y}{120\pi}\cos(\omega t${p.s>0?"-":"+"}\beta_0z)`,"Multiply by $e^{j\\omega t}$, take Re.",""],
   ["(b) Cross",R`\boldsymbol{\mathcal S}=\boldsymbol{\mathcal E}\times\boldsymbol{\mathcal H}=${dz}\hat a_z\frac{${mag}}{120\pi}\cos^2(\cdot)=${dz}\hat a_z${f(Sam*1e3)}\cos^2(\cdot)\ \text{mW/m}^2`,`$|\\mathbf E||\\mathbf H|=${mag}/120\\pi$.`,"$|\\mathcal S|=|\\mathcal E||\\mathcal H|$ when they're perpendicular."],
   ["(c) Average",R`\mathbf S_{av}=${dz}\hat a_z\frac{${mag}}{240\pi}=${dz}\hat a_z${f(Sav*1e3)}\ \text{mW/m}^2`,"$\\langle\\cos^2\\rangle=\\frac12$; check $|\\mathbf E|^2/2\\eta_0$.","Half the peak of $\\mathcal S$."]];
  return{steps:st,stages:[{k:"(a) E_x",q:"(a) $E_x$ amplitude (sign included)?",u:"\\text{V/m}",v:Ex,s:1},{k:"(a) E_y",q:"(a) $E_y$ amplitude (sign included)?",u:"\\text{V/m}",v:Ey,s:1},
   {k:"(b) 𝒮 peak",q:"(b) Peak of the instantaneous $\\mathcal S_z$ (coefficient of $\\cos^2$, sign included)?",u:"\\text{mW/m}^2",v:p.s*Sam*1e3,s:4},
   {k:"(c) S_av",q:"(c) Time-average $S_z$ (sign included)?",u:"\\text{mW/m}^2",v:p.s*Sav*1e3,s:5}]};}});

/* ---- 4.23 good conductor ---- */
L.push({id:"4.23",like:5,min:10,why:"Classify with $\\sigma/\\omega\\varepsilon$, then one $\\alpha$ drives everything. The target field is $1/e$ of the start: one skin depth. He stressed 'classify first' at the end of L13.",
 orig:{f:1,sig:0.1,er:4,E1:3,E2:1.104},
 gen(){let F,s,er;do{F=pick([0.1,0.5,1,2]);s=pick([0.05,0.1,0.2,0.5,1]);er=pick([4,9,10,15,20]);}while(s/(2*Math.PI*F*1e6*er*EPS0)<100);
  const E1=pick([1,2,3,5]),m=pick([1,1,2,0.5,3]);return{f:F,sig:s,er,E1,E2:+(E1*Math.exp(-m)).toPrecision(4)};},
 st:p=>`The electrical constitutive parameters of moist earth at ${p.f} MHz are $\\sigma=${p.sig}$ S/m, $\\varepsilon_r=${p.er}$, $\\mu_r=1$. The electric field of a uniform plane wave at the interface (earth side) is $${p.E1}\\times10^{-2}$ V/m. Find the (a) distance the wave must travel before the field magnitude reduces to $${p.E2}\\times10^{-2}$ V/m, (b) attenuation in part (a) in decibels, (c) wavelength inside the earth, (d) phase velocity inside the earth, (e) intrinsic impedance of the earth.`,
 first:{ok:"Loss tangent $\\sigma/\\omega\\varepsilon$ first. Good conductor, so $\\alpha=\\beta=\\sqrt{\\pi f\\mu\\sigma}$.",bad:["Good-dielectric $\\alpha=\\frac\\sigma2\\sqrt{\\mu/\\varepsilon}$, since earth is a dielectric.","Set $e^{-2\\alpha z}$ equal to the field ratio, since attenuation is about power."]},
 solve(p){const w=2*Math.PI*p.f*1e6,we=w*p.er*EPS0,lt=p.sig/we,a=Math.sqrt(Math.PI*p.f*1e6*MU0*p.sig),z=Math.log(p.E1/p.E2)/a,dB=20*Math.log10(p.E1/p.E2),lam=2*Math.PI/a,vp=w/a,Re=Math.sqrt(w*MU0/(2*p.sig));const Vs=sc(vp,"\\text{m/s}");
  const st=[["Classify",R`\omega\varepsilon=2\pi(${tx(p.f*1e6)})(${p.er})(8.854\times10^{-12})=${tx(we)},\qquad \frac{\sigma}{\omega\varepsilon}=${f(lt)}\gg1`,"Good conductor.","Compare $\\sigma$ with $\\omega\\varepsilon$."],
   ["$\\alpha$",R`\alpha=\sqrt{\pi f\mu_0\sigma}=\sqrt{\pi(${tx(p.f*1e6)})(4\pi\times10^{-7})(${p.sig})}=${f(a)}\ \text{Np/m}`,"(4-40a). $\\beta\\simeq\\alpha$.",""],
   ["(a) Distance",R`${p.E1}e^{-\alpha z}=${p.E2}\Rightarrow z=\frac{1}{\alpha}\ln\frac{${p.E1}}{${p.E2}}=\frac{${f(Math.log(p.E1/p.E2))}}{${f(a)}}=${f(z)}\ \text{m}`,`That's ${f(z*a)} skin depths ($\\delta=${f(1/a)}$ m).`,"Field decays as $e^{-\\alpha z}$, not $e^{-2\\alpha z}$."],
   ["(b) dB",R`20\log_{10}\frac{${p.E1}}{${p.E2}}=${f(dB)}\ \text{dB}`,"Same as $8.686\\,\\alpha z$: 1 Np = 8.686 dB.","$20\\log_{10}$ for a field ratio."],
   ["(c) $\\lambda$",R`\lambda=\frac{2\pi}{\beta}=2\pi\delta=${f(lam)}\ \text{m}`,`vs ${f(C0/Math.sqrt(p.er)/(p.f*1e6))} m in a lossless $\\varepsilon_r=${p.er}$ at ${p.f} MHz.`,"$\\beta\\simeq\\alpha$ in a good conductor."],
   ["(d) $v_p$",R`v_p=\frac{\omega}{\beta}=\frac{2\pi(${tx(p.f*1e6)})}{${f(a)}}=${tx(vp)}\ \text{m/s}`,"$=\\omega\\delta$.",""],
   ["(e) $\\eta$",R`\eta\simeq(1+j)\sqrt{\frac{\omega\mu_0}{2\sigma}}=(1+j)${f(Re)}\ \Omega`,`$|\\eta|=${f(Re*Math.SQRT2)}\\ \\Omega$ at 45°.`,"$\\eta=(1+j)\\sqrt{\\omega\\mu/2\\sigma}$."]];
  return{steps:st,stages:[{q:`$\\sigma/\\omega\\varepsilon=${f(lt)}$. Which regime?`,opts:["Good conductor: $\\alpha=\\beta=\\sqrt{\\pi f\\mu\\sigma}$","Good dielectric: $\\alpha=\\frac\\sigma2\\sqrt{\\mu/\\varepsilon}$","Lossless: $\\alpha=0$"],a:0,s:0,why:"$\\sigma\\gg\\omega\\varepsilon$: conduction current dominates."},
   {k:"(a) z",q:"(a) Distance?",u:"\\text{m}",v:z,s:2},{k:"(b) dB",q:"(b) Attenuation over that distance?",u:"\\text{dB}",v:dB,s:3},
   {k:"(c) λ",q:"(c) Wavelength in the earth?",u:"\\text{m}",v:lam,s:4},{k:"(d) v_p",q:"(d) Phase velocity?",u:Vs.u,v:Vs.v,s:5},
   {k:"(e) Re η",q:"(e) Real part of $\\eta$ (equal to the imaginary part)?",u:"\\Omega",v:Re,s:6}]};}});

/* ---- 4.5 −y travel, complex amplitudes ---- */
const CX=[[2,1],[1,3],[1,2],[3,1],[1,1],[2,3],[1,-1],[2,-1],[0,1],[3,0]];
L.push({id:"4.5",like:4,min:10,why:"Same cross product as 4.3, but $e^{+j\\beta y}$ flips the direction and the amplitudes are complex. A one-trap problem, so a fair quiz.",
 orig:{A:[-2,-1],B:[1,3],d:-1,H0:1},

 st:p=>`The magnetic field of a uniform plane wave in a source-free region is given by $\\mathbf H=${p.H0===1?"":p.H0+"\\times "}10^{-6}\\left[${join(term("\\hat a_x",p.A[0],p.A[1]),term("\\hat a_z",p.B[0],p.B[1]))}\\right]e^{${p.d<0?"+":"-"}j\\beta y}$. Assuming that the medium is free space, determine the (a) corresponding electric field, (b) time-average power density.`,

 solve(p){const H0=p.H0*1e-6,d=p.d,dy=d>0?"+":"-";const Ex=[-d*p.B[0],-d*p.B[1]],Ez=[d*p.A[0],d*p.A[1]];const K=ETA0*H0;
  const m2=p.A[0]**2+p.A[1]**2+p.B[0]**2+p.B[1]**2,H2=m2*H0*H0,Sav=d*ETA0/2*H2;const Ks=sc(K,"\\text{V/m}"),Hs=sc(H2,"\\text{A}^2\\text{/m}^2"),Ss=sc(Math.abs(Sav),"\\text{W/m}^2");
  const good=join(term("\\hat a_x",Ex[0],Ex[1]),term("\\hat a_z",Ez[0],Ez[1])),flip=join(term("\\hat a_x",-Ex[0],-Ex[1]),term("\\hat a_z",-Ez[0],-Ez[1])),half=join(term("\\hat a_x",-Ex[0],-Ex[1]),term("\\hat a_z",Ez[0],Ez[1]));

L.push({id:"4.21",like:4,min:15,why:"The good-dielectric partner of 4.23: classify, then $\\eta$, $\\alpha$, $\\beta$. Seven parts make it long, so expect a trimmed version.",

 st:p=>`The magnetic field intensity of a plane wave traveling in a lossy earth is $\\mathbf H=(\\hat a_y${p.k<0?"-":"+"}${cxs(0,Math.abs(p.k))}\\hat a_z)H_0e^{-\\alpha x}e^{-j\\beta x}$, with $H_0=${p.H0}\\ \\mu$A/m. The earth has $\\sigma=${tx(p.sig)}$ S/m, dielectric constant ${p.er}, and $f=${p.f}$ GHz. Find inside the earth the (a) electric field vector, (b) average power density vector, (c) phase constant, (d) phase velocity, (e) wavelength, (f) attenuation constant, (g) skin depth.`,

   ["Answer (a)",R`\mathbf E=${tx(Ea)}(${kj}\hat a_y-\hat a_z)e^{-\alpha x}e^{-j\beta x}\ \text{V/m}`,"Maxwell route: divide $\\nabla\\times\\mathbf H$ by $(\\sigma+j\\omega\\varepsilon)$; same $\\eta$.","$\\eta H_0$."],
   ["(b) Power",R`\mathbf S_{av}=\hat a_x\frac{\eta}{2}|\mathbf H|^2e^{-2\alpha x}=\hat a_x\frac{${f(eta)}}{2}(${tx(H2)})e^{-2\alpha x}=\hat a_x${tx(S)}e^{-2\alpha x}\ \text{W/m}^2`,`$|\\hat a_y+${kj}\\hat a_z|^2=1+${p.k*p.k}=${1+p.k*p.k}$.`,"$\\frac\\eta2|\\mathbf H|^2$."],
   ["(c)–(e)",R`\beta\simeq\omega\sqrt{\mu\varepsilon}=\frac{2\pi(${tx(p.f*1e9)})(${f(Math.sqrt(p.er))})}{3\times10^8}=${f(b)}\ \text{rad/m},\quad v_p=\frac\omega\beta=${tx(vp)}\ \text{m/s},\quad \lambda=\frac{2\pi}\beta=${f(lam)}\ \text{m}`,"","$\\beta=\\omega\\sqrt{\\mu\\varepsilon}=2\\pi f\\sqrt{\\varepsilon_r}/c$."],
   ["(f), (g)",R`\alpha\simeq\frac\sigma2\eta=\frac{${tx(p.sig)}}{2}(${f(eta)})=${tx(a)}\ \text{Np/m},\qquad \delta=\frac1\alpha=${f(dl)}\ \text{m}`,"(4-38), (4-39). The exact (4-28c, d) agree to 4 digits here.","$\\alpha=\\frac\\sigma2\\sqrt{\\mu/\\varepsilon}$."]];
  return{steps:st,stages:[{q:`$\\sigma/\\omega\\varepsilon=${tx(lt)}$. Which regime?`,opts:["Good dielectric: $\\alpha\\simeq\\frac\\sigma2\\eta$, $\\beta\\simeq\\omega\\sqrt{\\mu\\varepsilon}$","Good conductor: $\\alpha=\\beta=\\sqrt{\\pi f\\mu\\sigma}$","Lossless: $\\alpha=0$, $\\delta=\\infty$"],a:0,s:0,why:"Conduction current is tiny next to displacement current. Small loss, not zero."},
   {k:"(a) |E| scale",q:"(a) Prefactor $\\eta H_0$ of $\\mathbf E$?",u:Es.u,v:Es.v,s:3},

   ["(d) Phase velocities",R`v_{pi}=\frac{\omega}{\beta_i}=c\frac{\beta}{\beta_i}=3,\ ${c8(C0*b/ay)},\ ${c8(C0*b/az)}\ (\times10^8\ \text{m/s})`,"(4-22), (4-23): at least $c$.","$v_{pi}=c\\beta/\\beta_i$."],

/* ---- 4.1 derive the uniform plane wave ---- */
L.push({id:"4.1",like:3,min:10,why:"The L12 derivation: curl-curl → Helmholtz → keep $e^{-j\\beta z}$ → Faraday → $\\eta$. Short, and he said a quiz can be part of a derivation.",
 orig:{E0:1,er:4,f:300},
 gen(){return{E0:pick([1,2,5,10]),er:pick([1,2.25,4,9]),f:pick([100,300,500,1000])};},
 st:p=>`A uniform plane wave having only an $x$ component of the electric field is traveling in the $+z$ direction in an unbounded lossless, source-free region. Using Maxwell's equations write expressions for the electric and corresponding magnetic field intensities. Compare your answers to those of (4-2b) and (4-3c). <i>(MAXWELL adds: with $E_0^+=${p.E0}$ V/m, $\\varepsilon_r=${p.er}$, $\\mu_r=1$, $f=${p.f}$ MHz, give $\\beta$ and $H_0$.)</i>`,
 first:{ok:"Curl Faraday into Ampère to get the Helmholtz equation for $E_x(z)$, keep only $e^{-j\\beta z}$, then $\\mathbf H=-\\frac{1}{j\\omega\\mu}\\nabla\\times\\mathbf E$.",bad:["Write $\\mathbf H=\\hat a_yE_0/\\eta$ and stop.","Solve a second, independent wave equation for $H_y$."]},
 solve(p){const s=Math.sqrt(p.er),b=2*Math.PI*p.f*1e6*s/C0,eta=ETA0/s,H=p.E0/eta;
  const st=[["Wave equation",R`\nabla\times\nabla\times\mathbf E=\nabla(\nabla\cdot\mathbf E)-\nabla^2\mathbf E=-j\omega\mu(j\omega\varepsilon\mathbf E)\ \Rightarrow\ \nabla^2\mathbf E+\beta^2\mathbf E=0`,"Source-free: $\\nabla\\cdot\\mathbf E=0$, $\\beta=\\omega\\sqrt{\\mu\\varepsilon}$.",""],
   ["Uniform plane wave",R`\frac{\partial}{\partial x}=\frac{\partial}{\partial y}=0\ \Rightarrow\ \frac{d^2E_x}{dz^2}+\beta^2E_x=0`,"",""],
   ["Solve, keep +z",R`E_x=E_0^+e^{-j\beta z}+E_0^-e^{+j\beta z}\ \xrightarrow{+z\ \text{only}}\ \mathbf E=\hat a_xE_0^+e^{-j\beta z}`,"(4-2b).",""],
   ["Curl",R`\nabla\times\mathbf E=\hat a_y\frac{\partial E_x}{\partial z}=-j\beta E_0^+e^{-j\beta z}\hat a_y`,"",""],
   ["Faraday, identify $\\eta$",R`\mathbf H=-\frac{1}{j\omega\mu}(-j\beta)E_0^+e^{-j\beta z}\hat a_y=\hat a_y\frac{\beta}{\omega\mu}E_0^+e^{-j\beta z}=\hat a_y\frac{E_0^+}{\eta}e^{-j\beta z}`,"$\\beta/\\omega\\mu=\\sqrt{\\varepsilon/\\mu}=1/\\eta$. Matches (4-3c).",""],
   ["Numbers",R`\beta=\frac{2\pi f\sqrt{\varepsilon_r}}{c}=\frac{2\pi(${tx(p.f*1e6)})(${f(s)})}{3\times10^8}=${f(b)}\ \text{rad/m},\quad H_0=\frac{E_0^+\sqrt{\varepsilon_r}}{120\pi}=${f(H*1e3)}\ \text{mA/m}`,`$\\eta=${f(eta)}\\ \\Omega$.`,"$\\eta=\\eta_0/\\sqrt{\\varepsilon_r}$."]];
  return{steps:st,stages:[{q:"Curl Faraday and substitute Ampère. Which term drops, and why?",opts:["$\\nabla(\\nabla\\cdot\\mathbf E)$, since the region is source-free","$\\nabla^2\\mathbf E$, since the wave is uniform","$j\\omega\\mu\\mathbf J$, since $\\mathbf J=\\sigma\\mathbf E$"],a:0,s:0,why:"No charge, so $\\nabla\\cdot\\mathbf E=0$."},
   {q:"Of $E_0^+e^{-j\\beta z}+E_0^-e^{+j\\beta z}$, which survives?",opts:["$E_0^+e^{-j\\beta z}$: travels $+z$","$E_0^-e^{+j\\beta z}$: travels $+z$","Both, as a standing wave"],a:0,s:2,why:"With $e^{+j\\omega t}$, $e^{-j\\beta z}$ moves toward $+z$."},
   {q:"Faraday gives $\\mathbf H=\\hat a_y\\frac{\\beta}{\\omega\\mu}E_0^+e^{-j\\beta z}$. That ratio is:",opts:["$1/\\eta$","$\\eta$","$1/(\\eta\\beta)$"],a:0,s:4,why:"$\\omega\\sqrt{\\mu\\varepsilon}/\\omega\\mu=\\sqrt{\\varepsilon/\\mu}$."},
   {k:"β",q:"$\\beta$ for the MAXWELL numbers?",u:"\\text{rad/m}",v:b,s:5},
   {k:"H₀",q:"$H_0$ for the MAXWELL numbers?",u:"\\text{mA/m}",v:H*1e3,s:5}]};}});

L.push({id:"4.19",like:3,min:10,why:"A one-page derivation ($\\mathcal S_z/w$) with a single trap ($w_e+w_m$, not $w_e$). Fits 10 minutes, but he leans toward numbers.",
 orig:{th:30,er:1},

 first:{ok:"Write the real forward TE$^y$ fields, form $\\mathcal S_z$ and $w=w_e+w_m$, divide.",bad:["$v_{ez}=\\omega/\\beta_z=v/\\cos\\theta_i$.","Divide $\\mathcal S_z$ by $w_e$ alone, since $w_e$ holds the energy."]},
 solve(p){const v=C0/Math.sqrt(p.er),c=Math.cos(p.th*DEG),ve=v*c,vp=v/c;
  const st=[["Real fields",R`\boldsymbol{\mathcal E}=E_0(\hat a_x\cos\theta_i-\hat a_z\sin\theta_i)\cos\Phi,\quad \boldsymbol{\mathcal H}=\hat a_y\frac{E_0}{\eta}\cos\Phi,\quad \Phi=\omega t-\beta(x\sin\theta_i+z\cos\theta_i)`,"From (4-18a, b), forward wave.",""],

   ["Numbers: β_c and β_z",`\\beta_c=\\sqrt{\\left(\\frac{\\pi}{${p.a/100}}\\right)^2+\\left(\\frac{\\pi}{${p.b/100}}\\right)^2}=${f(bc)},\\quad \\beta=${f(b)},\\quad \\beta_z=${f(bz)}\\ \\text{rad/m}`,`TM$_{11}$ cutoff ${f(fc11(p.a,p.b)/1e9)}$ GHz.`,"$\\beta_z=\\sqrt{\\beta^2-\\beta_c^2}$."],

/* QUIZ ARENA · HW 9 = Balanis Ch. 8 (rectangular waveguides). Each problem: assigned numbers + remix generator,
   graded with the real formulas (c = 3e8, η0 = 120π, TE10 dominant). Ordering = estimated quiz likelihood. */
(function(G){const U=G.hwU,{C0,ETA0,pick,rnd}=U,f=U.f3;
const fc10=(a_cm,er)=>C0/(2*a_cm/100*Math.sqrt(er||1));            // Hz

const guideScene=p=>({kind:"guide",a:p.a,b:p.b||p.a/2,er:p.er||1,f:p.f*1e9,fc:fc10(p.a,p.er||1)});
const L=[];

/* ---- 8.2 all five ---- */
L.push({id:"8.2",like:5,min:12,why:"The full TE$_{10}$ recipe in one problem: $f_c$, $\\lambda_g$, $Z_w$, $v_p$, $v_g$. Five numbers, one square root, about 12 minutes. This is the core of L18.",
 orig:{band:"X-band",a:2.286,b:1.016,er:2.56,f:10},
 gen(){const B=pick(BANDS),er=pick([2.25,2.56,4,1.96,3.24]);const fc=fc10(B.a,er)/1e9;let fr=rnd(Math.max(B.lo,fc*1.25),B.hi,0.5);return{band:B.n,a:B.a,b:B.b,er,f:fr};},
 st:p=>`A standard ${p.band} rectangular waveguide, ${p.a} cm by ${p.b} cm, is filled with lossless dielectric ($\\varepsilon_r=${p.er}$). For the lowest-order mode, determine at ${p.f} GHz: (a) cutoff frequency (GHz); (b) guide wavelength (cm); (c) wave impedance ($\\Omega$); (d) phase velocity; (e) group velocity (both in $10^8$ m/s).`,
 first:{ok:"Swap $c\\to v=c/\\sqrt{\\varepsilon_r}$ and $\\eta_0\\to\\eta=\\eta_0/\\sqrt{\\varepsilon_r}$, then run the TE$_{10}$ recipe with the one square root $\\sqrt{1-(f_c/f)^2}$.",
   bad:["Find $f_c=c/2a$ with free-space $c$, then divide every answer by $\\varepsilon_r$.","Start from $\\beta_c^2=(m\\pi/a)^2+(n\\pi/b)^2$ with $m=n=1$, because the lowest mode needs both indices."]},
 scene:guideScene,
 solve(p){const s=Math.sqrt(p.er),v=C0/s,eta=ETA0/s,fc=fc10(p.a,p.er),F=p.f*1e9,r=root(fc,F),lam=v/F*100;
  const st=[["Medium constants",`v=\\frac{3\\times10^8}{\\sqrt{${p.er}}}=${f(v/1e8)}\\times10^8\\ \\text{m/s},\\quad \\eta=\\frac{120\\pi}{${f(s)}}=${f(eta)}\\ \\Omega,\\quad \\lambda=\\frac vf=${f(lam)}\\ \\text{cm}`,"Everything inside the guide uses the <b>medium's</b> $v$, $\\eta$, $\\lambda$.","$v=c/\\sqrt{\\varepsilon_r}$ first."],
   ["(a) Cutoff of TE$_{10}$",`(f_c)_{10}=\\frac{v}{2a}=\\frac{${f(v/1e8)}\\times10^8}{2(${p.a/100})}=${f(fc/1e9)}\\ \\text{GHz}`,"Only $a$ matters for TE$_{10}$.","$(f_c)_{10}=v/(2a)$, with $a$ in meters."],
   ["The one square root",`\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}=\\sqrt{1-\\left(\\frac{${f(fc/1e9)}}{${p.f}}\\right)^2}=${f(r)}`,"Compute once, reuse four times.",""],
   ["(b) Guide wavelength",`\\lambda_g=\\frac{\\lambda}{\\sqrt{\\cdot}}=\\frac{${f(lam)}}{${f(r)}}=${f(lam/r)}\\ \\text{cm}`,"Use the wavelength <i>in the dielectric</i>.","$\\lambda_g=\\lambda/\\sqrt{1-(f_c/f)^2}$ with $\\lambda=v/f$."],
   ["(c) TE wave impedance",`Z_w=\\frac{\\eta}{\\sqrt{\\cdot}}=\\frac{${f(eta)}}{${f(r)}}=${f(eta/r)}\\ \\Omega`,"TE impedance sits <b>above</b> the medium's $\\eta$.","$Z^{TE}=\\eta/\\sqrt{1-(f_c/f)^2}$."],
   ["(d), (e) Velocities",`v_p=\\frac{v}{\\sqrt\\cdot}=${f(v/r/1e8)}\\times10^8,\\qquad v_g=v\\sqrt\\cdot=${f(v*r/1e8)}\\times10^8\\ \\text{m/s}`,"Check: $v_pv_g=v^2$.","$v_p=v/\\sqrt\\cdot$ and $v_g=v\\sqrt\\cdot$."]];

/* ---- 8.1 delay line air ---- */
L.push({id:"8.1",like:5,min:8,why:"A delay line means group velocity. One cutoff, one square root, $\\ell=v_g\\tau$. Short and clean, a classic quiz pick.",
 orig:{band:"X-band",a:2.286,b:1.016,f:10,tau:2},
 gen(){const B=pick(BANDS);const fc=fc10(B.a,1)/1e9;return{band:B.n,a:B.a,b:B.b,f:rnd(Math.max(B.lo,fc*1.2),B.hi,0.5),tau:pick([1,2,3,4,5])};},
 st:p=>`An air-filled section of a ${p.band} rectangular waveguide of length $\\ell$ is used as a delay line. The inside dimensions are ${p.a} cm by ${p.b} cm and it operates in its dominant mode. Determine its length so that the delay at ${p.f} GHz is ${p.tau} $\\mu$s.`,
 first:{ok:"Delay means $v_g$. Get $(f_c)_{10}$, form $\\sqrt{1-(f_c/f)^2}$, then $\\ell=v_g\\tau$.",bad:["Delay is set by the phase velocity: $\\ell=v_p\\tau$.","The signal moves at $c$ in an air-filled guide, so $\\ell=c\\tau$."]},

   ["The square root",`\\sqrt{1-\\left(\\frac{${f(fc/1e9)}}{${p.f}}\\right)^2}=${f(r)}`,"",""],
   ["Group velocity",`v_g=c\\sqrt{1-(f_c/f)^2}=${f(vg/1e8)}\\times10^8\\ \\text{m/s}`,"$v_g<c$: signals slow down in a guide.","$v_g=c\\sqrt{\\cdot}$."],
   ["Length from the delay",`\\ell=v_g\\tau=(${f(vg/1e8)}\\times10^8)(${p.tau}\\times10^{-6})=${f(l)}\\ \\text{m}`,"",""]];
  return{steps:st,stages:[{k:"f_c",q:"Cutoff of the dominant mode?",u:"\\text{GHz}",v:fc/1e9,s:0},
   {q:"Which speed sets the delay of a pulse?",opts:["$v_g$, the group velocity","$v_p$, the phase velocity","$c$"],a:0,s:2,why:"Energy and information travel at $v_g$. $v_p>c$ carries no signal."},
   {k:"v_g",q:"Group velocity?",u:"\\times10^8\\ \\text{m/s}",v:vg/1e8,s:2},

L.push({id:"8.4",like:4,min:8,why:"Same as 8.1 with a dielectric, which tests whether you swap $c\\to v$ everywhere. He likes the 'one change' version.",

L.push({id:"8.3",like:4,min:10,why:"Phase $=\\beta_z\\ell$, with inch conversion and degrees→radians traps. A natural 'apply $\\beta_z$' quiz.",
 orig:{a_in:0.622,b_in:0.311,f:15,phi:300,er:4},
 gen(){const a=pick([0.622,0.9,0.42]);const B=a===0.9?[8.2,12.4]:a===0.622?[12.4,18]:[18,26.5];return{a_in:a,b_in:+(a/2).toFixed(3),f:rnd(B[0]+1,B[1]-0.5,0.5),phi:pick([180,240,300,360,450]),er:pick([4,2.25,2.56])};},
 st:p=>`A lossless rectangular waveguide, TE$_{10}$, inner dimensions ${p.a_in} in. by ${p.b_in} in., is used as a phase shifter at ${p.f} GHz. (a) Air-filled: what length (cm) gives a total phase of ${p.phi}°? (b) Same length, now completely filled with a lossless dielectric of dielectric constant ${p.er}: what is the total phase shift (degrees)?`,
 first:{ok:"Convert inches to meters, find $\\beta_z=\\beta\\sqrt{1-(f_c/f)^2}$, then $\\ell=\\phi/\\beta_z$ with $\\phi$ in radians.",bad:["$\\ell=\\phi\\lambda_0/360°$, the free-space wavelength sets the phase.","Use $\\beta_c=\\pi/a$ as the propagation constant."]},
 scene:p=>({kind:"guide",a:+(p.a_in*2.54).toFixed(3),b:+(p.b_in*2.54).toFixed(3),er:1,f:p.f*1e9,fc:fc10(p.a_in*2.54,1),aLab:p.a_in+" in"}),
 solve(p){const a=p.a_in*2.54,fc=fc10(a,1),F=p.f*1e9,b0=2*Math.PI*F/C0,bz=b0*root(fc,F),l=(p.phi*Math.PI/180)/bz;
  const s=Math.sqrt(p.er),fc2=fc/s,b2=b0*s,bz2=b2*root(fc2,F),ph2=bz2*l*180/Math.PI;
  const st=[["Units first",`a=${p.a_in}\\ \\text{in}=${p.a_in}(2.54)=${f(a)}\\ \\text{cm}`,"The narrow side doesn't matter for TE$_{10}$.","1 in = 2.54 cm."],
   ["(a) Cutoff and $\\beta$",`(f_c)_{10}=\\frac{3\\times10^8}{2(${f(a/100)})}=${f(fc/1e9)}\\ \\text{GHz},\\quad \\beta=\\frac{2\\pi f}{c}=${f(b0)}\\ \\text{rad/m}`,"",""],
   ["(a) $\\beta_z$",`\\beta_z=\\beta\\sqrt{1-(f_c/f)^2}=${f(b0)}(${f(root(fc,F))})=${f(bz)}\\ \\text{rad/m}`,"","$\\beta_z=\\beta\\sqrt{1-(f_c/f)^2}$."],
   ["(a) Length",`\\ell=\\frac{\\phi}{\\beta_z}=\\frac{${p.phi}\\cdot\\pi/180}{${f(bz)}}=${f(l*100)}\\ \\text{cm}`,"Degrees go to radians <b>before</b> you divide.","$\\ell=\\phi_{\\text{rad}}/\\beta_z$."],
   [`(b) Filled, $\\varepsilon_r=${p.er}$`,`(f_c)_{10}=${f(fc2/1e9)}\\ \\text{GHz},\\quad \\beta=${f(b2)},\\quad \\beta_z=${f(bz2)}\\ \\text{rad/m}`,`$\\sqrt{\\varepsilon_r}=${f(s)}$ lowers the cutoff and raises $\\beta$ by that factor.`,"Divide $f_c$ by $\\sqrt{\\varepsilon_r}$, multiply $\\beta$ by it."],
   ["(b) Phase",`\\phi=\\beta_z\\ell=${f(bz2)}(${f(l)})=${f(bz2*l)}\\ \\text{rad}=${f(ph2)}^\\circ`,"Give the total phase.","$\\phi=\\beta_z\\ell$, then convert to degrees."]];
  return{steps:st,stages:[{k:"β_z (air)",q:"(a) $\\beta_z$ of the air-filled guide?",u:"\\text{rad/m}",v:bz,s:2},{k:"ℓ",q:"(a) Length for the phase?",u:"\\text{cm}",v:l*100,s:3},{k:"φ (b)",q:"(b) Total phase with the dielectric?",u:"^\\circ",v:ph2,alt:[ph2%360],s:5}]};}});

/* ---- 8.10 PMC TE ---- */
L.push({id:"8.10",like:3,min:12,why:"PEC↔PMC duality, a 'think, don't grind' problem he could cut down to (a) and (c) for a quiz.",
 orig:{a:2.286,b:1.016},
 gen(){const B=pick(BANDS);return{a:B.a,b:B.b};},
 st:p=>`For a very high-permittivity dielectric rod, model the surface as a perfect magnetic conductor (PMC): tangential $\\mathbf H$ vanishes. For a rectangular cross-section ($a\\times b$) and TE$^z$ modes: (a) write all boundary conditions on E and H; (b) derive simplified expressions for the vector potential, the fields, and the cutoff frequencies; (c) if $a>b$, identify the lowest-order mode. <i>(MAXWELL adds: with $a=${p.a}$ cm, $b=${p.b}$ cm, give its cutoff.)</i>`,
 first:{ok:"$\\mathbf F=\\hat zF_z$. $H_z\\propto F_z$ is tangential to every wall, so $F_z$ itself must vanish there, which gives sines.",bad:["Same as metal walls: $\\frac{\\partial F_z}{\\partial n}=0$ gives cos·cos.","Use $\\mathbf A=\\hat zA_z$, because TE$^z$ comes from $A_z$."]},
 scene:p=>({kind:"guide",a:p.a,b:p.b,walls:"PMC",f:2*C0/2*Math.hypot(1/(p.a/100),1/(p.b/100)),fc:C0/2*Math.hypot(1/(p.a/100),1/(p.b/100)),field:(u,w)=>[-(1/p.b)*Math.sin(Math.PI*u)*Math.cos(Math.PI*w)*p.b,(1/p.a)*Math.cos(Math.PI*u)*Math.sin(Math.PI*w)*p.a*0.9],cap:"TE$_{11}$ with PMC walls. Normal E is zero at each wall (E runs <i>along</i> the walls), the opposite of metal. Drag to orbit."}),
 solve(p){const fc=C0/2*Math.hypot(1/(p.a/100),1/(p.b/100));
  const st=[["(a) PMC boundary conditions","\\hat n\\times\\mathbf H=0,\\ \\hat n\\cdot\\mathbf E=0:\\quad x=0,a:\\ H_y=H_z=0,\\ E_x=0;\\qquad y=0,b:\\ H_x=H_z=0,\\ E_y=0","Dual of PEC ($\\hat n\\times\\mathbf E=0$, $\\hat n\\cdot\\mathbf B=0$).",""],
   ["(b) Potential","H_z\\propto F_z=0\\text{ on all walls}\\Rightarrow F_z=A_{mn}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}e^{-j\\beta_zz},\\ m,n=1,2,\\dots","A zero index makes $F_z\\equiv0$.",""],
   ["(b) Cutoff","(f_c)_{mn}=\\frac{1}{2\\pi\\sqrt{\\mu\\varepsilon}}\\sqrt{\\left(\\frac{m\\pi}{a}\\right)^2+\\left(\\frac{n\\pi}{b}\\right)^2},\\ m,n\\ge1","",""],
   ["(c) Lowest mode",`\\text{TE}^z_{11}:\\ f_c=\\frac c2\\sqrt{\\frac1{a^2}+\\frac1{b^2}}=${f(fc/1e9)}\\ \\text{GHz}`,"Both indices must be at least 1, so 11 is the lowest.",""]];
  return{steps:st,stages:[{q:"(a) What does a PMC wall force to zero?",opts:["Tangential $\\mathbf H$ and normal $\\mathbf E$","Tangential $\\mathbf E$ and normal $\\mathbf B$","Normal $\\mathbf H$ only"],a:0,s:0,why:"PMC is the dual of PEC: swap E↔H."},
   {q:"(b) So $F_z(x,y)$ is:",opts:["$\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$","$\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}$","$\\sin\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}$"],a:0,s:1,why:"$H_z\\propto F_z$ is tangential to every wall, so $F_z$ (not its slope) vanishes."},
   {q:"(c) Lowest-order TE$^z$ mode when $a>b$:",opts:["TE$_{11}$","TE$_{10}$","TE$_{01}$"],a:0,s:3,why:"Sine·sine needs $m,n\\ge1$."},
   {k:"f_c",q:`Cutoff of that mode for $a=${p.a}$ cm, $b=${p.b}$ cm (air)?`,u:"\\text{GHz}",v:fc/1e9,s:3}]};}});

/* ---- 8.8 parallel plate ---- */
L.push({id:"8.8",like:3,min:15,why:"A short derivation (Helmholtz → eigenvalues → cutoff → power). He told us a quiz can be 'part of a derivation'.",
 orig:{b:1,n:1,f:20,E0:1000},
 gen(){return{b:pick([0.5,1,1.5,2]),n:pick([1,2]),f:0,E0:pick([100,500,1000])};},
 st:p=>`A parallel-plate waveguide is formed by infinite planar conductors at $y=0$ and $y=b$. (a) Show that $E_x=E_0\\sin(\\beta_yy)e^{-\\gamma z}$ defines a set of TE$_n$ modes where $\\gamma=\\sqrt{\\beta_y^2-\\beta_0^2}$. (b) Find the allowable eigenvalues, cutoff frequencies, and power transmitted per unit width. <i>(MAXWELL adds numbers: $b=${p.b}$ cm, mode $n=${p.n}$, $f=${fz(p)}$ GHz, $E_0=${p.E0}$ V/m, air.)</i>`,
 first:{ok:"Plug $E_x$ into Helmholtz to get $\\gamma$. Apply $E_x=0$ at the plates to get $\\beta_y$. Use Faraday for $H$, then integrate the Poynting vector over $0\\le y\\le b$.",bad:["Start from $E_z$ and the TM recipe, since the plates are PEC.","Set $\\partial E_x/\\partial y=0$ at the plates, so cosines."]},
 scene:p=>({kind:"guide",plates:true,a:3,b:p.b,f:fz(p)*1e9,fc:p.n*C0/(2*p.b/100),field:(u,w)=>[Math.sin(p.n*Math.PI*w),0],bLab:p.b+" cm",aLab:"∞",cap:"Two plates, no side walls. $E_x$ runs parallel to the plates, so it must vanish at $y=0$ and $y=b$."}),
 solve(p){const fc=p.n*C0/(2*p.b/100),F=fz(p)*1e9,r=root(fc,F),P=(p.b/100)*p.E0*p.E0/(4*ETA0)*r;
  const st=[["(a) Helmholtz","\\frac{\\partial^2E_x}{\\partial y^2}+\\frac{\\partial^2E_x}{\\partial z^2}+\\beta_0^2E_x=(-\\beta_y^2+\\gamma^2+\\beta_0^2)E_x=0\\Rightarrow\\gamma=\\sqrt{\\beta_y^2-\\beta_0^2}","No $x$ dependence (infinite plates). $E_z=0$, so it's TE.",""],
   ["(b) Eigenvalues","E_x(y=b)=0\\Rightarrow\\sin\\beta_yb=0\\Rightarrow\\beta_y=\\frac{n\\pi}{b},\\ n=1,2,\\dots","$n=0$ makes $E_x\\equiv0$.",""],
   ["(b) Cutoff",`(f_c)_n=\\frac{nc}{2b}=\\frac{${p.n}(3\\times10^8)}{2(${p.b/100})}=${f(fc/1e9)}\\ \\text{GHz}`,"Set $\\gamma=0$.","$\\gamma=0\\Rightarrow\\beta_0=n\\pi/b$."],
   ["(b) Power per unit width",`\\frac Pw=\\frac{bE_0^2}{4\\eta_0}\\sqrt{1-\\left(\\frac{f_c}{f}\\right)^2}=\\frac{(${p.b/100})(${p.E0})^2}{4(377)}(${f(r)})=${f(P)}\\ \\text{W/m}`,"The $b/2$ comes from $\\int_0^b\\sin^2$.","$H_y=\\frac{\\beta_z}{\\omega\\mu_0}E_x$, then $\\int_0^b\\frac12E_xH_y^*dy$."]];
  return{steps:st,stages:[{q:"(a) Plugging $E_x$ into Helmholtz gives:",opts:["$\\gamma=\\sqrt{\\beta_y^2-\\beta_0^2}$","$\\gamma=\\sqrt{\\beta_0^2-\\beta_y^2}$","$\\gamma=\\beta_y+\\beta_0$"],a:0,s:0,why:"$\\partial^2/\\partial z^2\\to\\gamma^2$ and $\\partial^2/\\partial y^2\\to-\\beta_y^2$."},
   {q:"(b) The plate condition gives the eigenvalues:",opts:["$\\beta_y=n\\pi/b,\\ n=1,2,\\dots$","$\\beta_y=n\\pi/b,\\ n=0,1,\\dots$","$\\beta_y=(2n+1)\\pi/2b$"],a:0,s:1,why:"$n=0$ makes $E_x\\equiv0$, so it's not a mode."},
   {k:"f_c",q:`Cutoff of TE$_${p.n}$ for $b=${p.b}$ cm?`,u:"\\text{GHz}",v:fc/1e9,s:2},
   {k:"P/w",q:`Power per unit width at $f=${fz(p)}$ GHz, $E_0=${p.E0}$ V/m?`,u:"\\text{W/m}",v:P,s:3,tol:0.03}]};}});
function fz(p){return p.f||+(1.6*p.n*C0/(2*p.b/100)/1e9).toFixed(1);}

/* ---- 8.5 quarter-wave ---- */
L.push({id:"8.5",like:3,min:13,why:"Wave impedance as a line impedance, then $Z_Q=\\sqrt{Z_1Z_3}$. Three answers and one inversion, so it fits a quiz if he trims it.",
 orig:{band:"X-band",a:2.286,b:1.016,er:2.56,f:10},
 gen(){const B=pick(BANDS.slice(0,2));const fc=fc10(B.a,1)/1e9;return{band:B.n,a:B.a,b:B.b,er:pick([2.56,2.25,4]),f:rnd(Math.max(B.lo,fc*1.3),B.hi,0.5)};},
 st:p=>`An empty ${p.band} guide (${p.a} cm by ${p.b} cm) is connected to an identical guide filled with dielectric ($\\varepsilon_r=${p.er}$). To avoid reflections, a quarter-wavelength section of the same guide is inserted between them. Dominant mode, matching at ${p.f} GHz. Find: (a) the wave impedance of the quarter-wave section; (b) the dielectric constant that must fill it; (c) its length (cm).`,
 first:{ok:"Find $Z_w$ of each side, take $Z_Q=\\sqrt{Z_1Z_3}$, then solve for the $\\varepsilon_r$ that gives $Z_Q$.",bad:["$\\varepsilon_{rQ}=\\sqrt{\\varepsilon_{r1}\\varepsilon_{r3}}$, like plane waves.","Use $\\eta_0$ and $\\eta_0/\\sqrt{\\varepsilon_r}$ as the line impedances."]},
 scene:guideScene,
 solve(p){const fc0=fc10(p.a,1),F=p.f*1e9,x=Math.pow(fc0/F,2),Z1=ETA0/Math.sqrt(1-x),Z3=ETA0/Math.sqrt(p.er-x),ZQ=Math.sqrt(Z1*Z3),erQ=x+Math.pow(ETA0/ZQ,2),lam0=C0/F*100,lq=lam0/Math.sqrt(erQ-x)/4;
  const st=[["Shortcut",`Z_w=\\frac{\\eta_0}{\\sqrt{\\varepsilon_r-(f_{c0}/f)^2}},\\quad (f_{c0}/f)^2=(${f(fc0/1e9)}/${p.f})^2=${f(x)}`,"$f_{c0}$ is the <b>air</b> cutoff. Filling only changes $\\varepsilon_r$ under the root.",""],
   ["Both ends",`Z_1=\\frac{377}{\\sqrt{1-${f(x)}}}=${f(Z1)}\\ \\Omega,\\qquad Z_3=\\frac{377}{\\sqrt{${p.er}-${f(x)}}}=${f(Z3)}\\ \\Omega`,"",""],
   ["(a) Quarter-wave impedance",`Z_Q=\\sqrt{Z_1Z_3}=${f(ZQ)}\\ \\Omega`,"",""],
   ["(b) Solve for $\\varepsilon_r$",`\\varepsilon_r=\\left(\\frac{f_{c0}}{f}\\right)^2+\\left(\\frac{\\eta_0}{Z_Q}\\right)^2=${f(erQ)}`,"Invert the shortcut.",""],
   ["(c) Length",`\\frac{\\lambda_g}{4}=\\frac14\\frac{${f(lam0)}\\ \\text{cm}}{\\sqrt{${f(erQ)}-${f(x)}}}=${f(lq)}\\ \\text{cm}`,"Quarter of the <b>guide</b> wavelength.",""]];
  return{steps:st,stages:[{k:"Z_1",q:"Wave impedance of the empty guide?",u:"\\Omega",v:Z1,s:1},{k:"(a) Z_Q",q:"(a) Wave impedance of the quarter-wave section?",u:"\\Omega",v:ZQ,s:2},{k:"(b) ε_r",q:"(b) Its dielectric constant?",u:"",v:erQ,s:3},{k:"(c) ℓ",q:"(c) Its length?",u:"\\text{cm}",v:lq,s:4}]};}});

L.push({id:"8.11",like:2,min:10,why:"The TM partner of 8.10. If he asks PMC, it's more likely the TE version, so this is second in line.",
 orig:{a:2.286,b:1.016},
 gen(){const B=pick(BANDS);return{a:B.a,b:B.b};},
 st:p=>`Repeat Problem 8.10 (PMC walls, $a\\times b$) for TM$^z$ modes. <i>(MAXWELL adds: with $a=${p.a}$ cm, $b=${p.b}$ cm, give the lowest mode's cutoff.)</i>`,
 first:{ok:"$\\mathbf A=\\hat zA_z$. Tangential $H\\propto$ the <b>slope</b> of $A_z$ must vanish at the walls, which gives cos·cos.",bad:["$A_z$ itself vanishes at the walls, so sin·sin, like metal.","Use $\\mathbf F=\\hat zF_z$, as in 8.10."]},
 scene:p=>({kind:"guide",a:p.a,b:p.b,walls:"PMC",f:2*C0/(2*p.a/100),fc:C0/(2*p.a/100),field:(u,w)=>[Math.sin(Math.PI*u),0],cap:"TM$_{10}$ with PMC walls: allowed here, impossible with metal walls."}),
 solve(p){const fc=C0/(2*p.a/100);const st=[["(b) Potential","\\frac{\\partial A_z}{\\partial n}=0\\text{ at walls}\\Rightarrow A_z=B_{mn}\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}e^{-j\\beta_zz},\\ m,n\\ge0\\text{ (not both 0)}","",""],
   ["(c) Lowest mode",`a>b:\\ \\text{TM}^z_{10},\\quad f_c=\\frac{c}{2a}=${f(fc/1e9)}\\ \\text{GHz}`,"With PMC the rules swap: TM$_{10}$ exists.",""]];
  return{steps:st,stages:[{q:"$A_z(x,y)$ with PMC walls:",opts:["$\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}$","$\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$","$\\sin\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}$"],a:0,s:0,why:"$H_x\\propto\\partial A_z/\\partial y$ and $H_y\\propto\\partial A_z/\\partial x$ must vanish, so the slopes are zero."},
   {q:"Allowed indices:",opts:["$m,n=0,1,2,\\dots$ not both 0","$m,n\\ge1$","$m\\ge1$, $n=0$ only"],a:0,s:0,why:"A constant $A_z$ gives no field."},
   {q:"Lowest TM$^z$ mode for $a>b$:",opts:["TM$_{10}$","TM$_{11}$","TM$_{01}$"],a:0,s:1,why:"Smallest cutoff: $m=1,n=0$ since $a>b$."},
   {k:"f_c",q:"Its cutoff (air)?",u:"\\text{GHz}",v:fc/1e9,s:1}]};}});

/* ---- 8.6 binomial ---- */
L.push({id:"8.6",like:1,min:20,why:"Six answers and binomial weights. Too long for a 10–15 min quiz, but know the 1 : 2 : 1 log split.",
 orig:{band:"X-band",a:2.286,b:1.016,er:2.56,f:10},
 gen(){const B=BANDS[0];return{band:B.n,a:B.a,b:B.b,er:pick([2.56,2.25,4]),f:rnd(9,12,0.5)};},
 st:p=>`Design a two-section binomial impedance transformer to match an empty ${p.band} guide to one filled with $\\varepsilon_r=${p.er}$, using two quarter-wave sections. Dominant mode, $f_0=${p.f}$ GHz, ${p.a} cm by ${p.b} cm. Find: (a) the wave impedance of each section; (b) their dielectric constants; (c) the length (cm) of each section.`,
 first:{ok:"Binomial with $N=2$: $\\ln\\frac{Z_{n+1}}{Z_n}=2^{-N}\\binom Nn\\ln\\frac{Z_L}{Z_0}$, weights $\\tfrac14,\\tfrac24,\\tfrac14$.",bad:["Split the impedance difference linearly into thirds.","One quarter-wave section at $\\sqrt{Z_0Z_L}$, used twice."]},
 scene:guideScene,
 solve(p){const fc0=fc10(p.a,1),F=p.f*1e9,x=Math.pow(fc0/F,2),Z0=ETA0/Math.sqrt(1-x),ZL=ETA0/Math.sqrt(p.er-x),ln=Math.log(ZL/Z0),Z1=Z0*Math.exp(ln/4),Z2=Z1*Math.exp(ln/2),e1=x+Math.pow(ETA0/Z1,2),e2=x+Math.pow(ETA0/Z2,2),lam0=C0/F*100,l1=lam0/Math.sqrt(e1-x)/4,l2=lam0/Math.sqrt(e2-x)/4;
  const st=[["Ends",`Z_0=${f(Z0)},\\ Z_L=${f(ZL)}\\ \\Omega,\\ \\ln\\frac{Z_L}{Z_0}=${f(ln)}`,"",""],["(a) Sections",`Z_1=Z_0e^{${f(ln)}/4}=${f(Z1)},\\quad Z_2=Z_1e^{${f(ln)}/2}=${f(Z2)}\\ \\Omega`,"Weights 1/4, 2/4, 1/4.",""],
   ["(b) Dielectric constants",`\\varepsilon_r=${f(x)}+\\left(\\frac{377}{Z}\\right)^2:\\ \\varepsilon_{r1}=${f(e1)},\\ \\varepsilon_{r2}=${f(e2)}`,"",""],["(c) Lengths",`\\frac{\\lambda_{g1}}4=${f(l1)},\\quad \\frac{\\lambda_{g2}}4=${f(l2)}\\ \\text{cm}`,"Each is a quarter of its own $\\lambda_g$.",""]];
  return{steps:st,stages:[{k:"Z_1",q:"(a) Impedance of section 1 (next to the empty guide)?",u:"\\Omega",v:Z1,s:1},{k:"Z_2",q:"(a) Section 2?",u:"\\Omega",v:Z2,s:1},{k:"ε_r1",q:"(b) $\\varepsilon_{r1}$?",u:"",v:e1,s:2},{k:"ε_r2",q:"(b) $\\varepsilon_{r2}$?",u:"",v:e2,s:2},{k:"ℓ_1",q:"(c) Length of section 1?",u:"\\text{cm}",v:l1,s:3},{k:"ℓ_2",q:"(c) Length of section 2?",u:"\\text{cm}",v:l2,s:3}]};}});

G.hwCoach.ch8={

  const rs=obs.map(o=>o.r).concat([R]);const lo=Math.min(...rs)*0.7,hi=Math.max(...rs)*1.2;const zv=r=>0.7+3.0*Math.log(r/lo)/Math.log(hi/lo);

      S.line(W(-st.av/2,-st.bv/2,0),W(st.av/2,st.bv/2,0),CG,3);S.text(W(0.05,0.08,0),"D",CG,13,800);}
    // dashed observation axis
    const c=S.c();c.setLineDash([c.px(4),c.px(6)]);S.line(W(0,0,0),W(0,0,zv(hi)),"rgba(201,206,218,.3)",1);c.setLineDash([]);}};

/* Mini-game: LINK BUDGET (Ch. 2 L6, Friis). Tx and Rx antennas over a ground grid; spherical wavefronts spread from the Tx,
   squeezed by its gain. Goals: compute P_r in dBm (±1 dB), or set R, G_r or f to land a required P_r. His form:
   P_r/P_t = G_t G_r (λ/4πR)², times the polarization loss factor |ρ̂_t·ρ̂_r|² = cos²ψ on some rounds (L6 "the real link"). */
(function(G){
const PI=Math.PI,C0=3e8,R=a=>a[Math.floor(Math.random()*a.length)],U=(a,b)=>a+(b-a)*Math.random();
const lg=Math.log10,dB=x=>10*lg(x),undB=x=>10**(x/10);
function budget(o){// o: {Pt (W), Gt, Gr (linear), f (Hz), R (m), psi (deg|0)}
  const lam=C0/o.f,path=20*lg(lam/(4*PI*o.R)),plf=o.psi?Math.cos(o.psi*PI/180)**2:1;
  const PtdBm=dB(o.Pt/1e-3);return{lam,path,plf,PtdBm,Pr:PtdBm+dB(o.Gt)+dB(o.Gr)+path+dB(plf)};}
const GAINS=[{t:"1×",g:1},{t:"1.64×",g:1.64},{t:"2.15 dBi",g:undB(2.15)},{t:"6 dBi",g:undB(6)},{t:"10 dBi",g:10},{t:"15 dBi",g:undB(15)},{t:"20 dBi",g:100},{t:"25 dBi",g:undB(25)},{t:"30 dBi",g:1000},{t:"100×",g:100},{t:"50×",g:50}];
const PTS=[1e-3,0.01,0.1,0.25,1,2,5,10,100,1000],FS=[300e6,900e6,1e9,2.4e9,5.8e9,10e9,28e9,60e9];
const sig2=v=>+v.toPrecision(2);
function scenario(round,hard){const mode=hard?R(["compute","setR","setG","setF"]):round===0?"compute":R(["setR","setG"]);
  const usePLF=hard?Math.random()<0.75:round>=1&&Math.random()<0.35;
  for(let k=0;k<200;k++){const o={Pt:R(PTS),f:R(FS),R:sig2(10**U(1,4.7)),psi:usePLF?R([30,45,60]):0};
    const gt=R(GAINS),gr=R(GAINS);o.Gt=gt.g;o.Gr=gr.g;const sc={mode,o,gtT:gt.t,grT:gr.t};
    if(mode==="compute"){sc.truth=budget(o).Pr;if(sc.truth<-125||sc.truth>10)continue;sc.lo=Math.round(sc.truth-U(10,50));return sc;}
    if(mode==="setG"){sc.GrdB=Math.round(U(0,40)*2)/2;o.Gr=undB(sc.GrdB);sc.grT="?";}
    if(mode==="setF")o.f=10**U(8,11);
    const req=Math.round(budget(o).Pr*2)/2;if(req<-125||req>10)continue;sc.req=req;
    const b0=budget({...o,Gr:mode==="setG"?1:o.Gr});// with G_r = 1 for setG
    if(mode==="setR"){sc.Rs=o.R*10**((budget(o).Pr-req)/20);sc.lo=lg(sc.Rs)-U(0.5,2.5);}
    if(mode==="setG"){sc.GrdB=req-b0.Pr;if(sc.GrdB<0||sc.GrdB>45)continue;}
    if(mode==="setF"){sc.fs=o.f*10**((budget(o).Pr-req)/20);sc.lo=lg(sc.fs)-U(0.5,2.5);if(sc.fs<1e8||sc.fs>2e11)continue;}

const si=(v,u,d)=>{d=d||3;const P=[[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-2,"c",["m"]],[1e-3,"m"],[1e-6,"µ"]];const a=Math.abs(v);
  for(const[m,p,only]of P){if(only&&!only.includes(u))continue;if(a>=m*0.99995)return`${+(v/m).toPrecision(d)} ${p}${u}`;}return`${+(v/1e-6).toPrecision(d)} µ${u}`;};
const mn1=x=>String(x).replace("-","−");const fdb=(x,d)=>(x>=0?"+":"−")+Math.abs(x).toFixed(d??1);

G.mini.friis={title:"Link Budget",blurb:"Close a radio link with the Friis equation",

/* cutoff ladder (2D): rungs at each cutoff, labels packed into rows so they never collide */
function ladder(cv,st){let c=null,key="",sc=1;const LW=900;
  loop(cv,t=>{const k2=cv.clientWidth+"";const q=n=>n/sc;
    if(!c||k2!==key){sc=(cv.clientWidth||340)/LW;c=setup2(cv,LW,Math.round(q(150)));key=k2;}
    const LH=q(150);c.fillStyle="#07080C";c.fillRect(0,0,LW,LH);
    const XL=q(12),XR=LW-q(14),Y0=q(112),fmax=st.fmax,X=f=>XL+(XR-XL)*f/fmax;const f=st.f();
    c.strokeStyle="#3A3F4F";c.lineWidth=c.px(1);c.beginPath();c.moveTo(XL,Y0);c.lineTo(XR,Y0);c.stroke();
    const gs=fmax/1e9>60?10:fmax/1e9>30?5:fmax/1e9>12?2:1;c.f(10,600);c.fillStyle=MUT;
    for(let g=0;g<=fmax/1e9+1e-9;g+=gs){const x=X(g*1e9);c.fillRect(x,Y0,c.px(1),q(4));const w=c.measureText(String(g)).width;c.fillText(String(g),Math.min(x-w/2,XR-w),Y0+q(15));}
    if(st.revealed){if(st.rt==null)st.rt=t;const L=st.L;const p=Math.min(1,(t-st.rt)/1.2);const x1=X(L[st.N-1].fc),x2=X(L[st.N].fc);
      c.fillStyle="rgba(120,213,140,.16)";c.fillRect(x1,q(22),x2-x1,Y0-q(22));c.strokeStyle=rgba(GOOD,.8);c.lineWidth=c.px(1.2);c.strokeRect(x1,q(22),x2-x1,Y0-q(22));
      const grp=[];L.forEach(md=>{if(md.fc>fmax)return;const g=grp.find(z=>Math.abs(z.fc-md.fc)/md.fc<1e-9);if(g)g.list.push(md);else grp.push({fc:md.fc,list:[md]});});
      const rows=[[],[],[],[]];c.f(10,700);
      grp.forEach((g,i)=>{if(i/grp.length>p*1.02)return;const x=X(g.fc);const deg=g.list.length>1;const col=deg?CH:CE;const md=g.list[0];const lab=(deg?"TE/TM":md.k)+md.m+md.n;const w=c.measureText(lab).width;
        let lx=Math.min(x+q(2),XR-w);let r=rows.findIndex(R=>R.every(([a,b])=>lx>b+q(4)||lx+w<a-q(4)));if(r<0)r=3;rows[r].push([lx,lx+w]);const ly=q(36)+r*q(14);
        c.strokeStyle=rgba(col,.9);c.lineWidth=c.px(1.8);c.beginPath();c.moveTo(x,Y0);c.lineTo(x,ly-q(9));c.stroke();c.fillStyle=col;c.fillText(lab,lx,ly);});
      c.f(10,700);c.fillStyle=GOOD;c.fillText(`exactly ${st.N}: ${sig(L[st.N-1].fc/1e9,4)}–${sig(L[st.N].fc/1e9,4)} GHz`,XL,Y0+q(31));
      c.fillStyle=CH;const tl="lavender = TE+TM pair";c.fillText(tl,XR-c.measureText(tl).width,Y0+q(31));}
    else{c.f(11,600);c.fillStyle=MUT;c.fillText("cutoff ladder hidden until you fire",XL,q(60));}
    c.strokeStyle=CG;c.lineWidth=c.px(2.4);c.beginPath();c.moveTo(X(f),q(18));c.lineTo(X(f),Y0+q(3));c.stroke();
    c.fillStyle=CG;c.f(12,750);const lab=`f = ${(f/1e9).toFixed(2)} GHz`;const w=c.measureText(lab).width;c.fillText(lab,Math.min(Math.max(XL,X(f)-w/2),XR-w),q(13));
  });}

/* ---------------- round builders ---------------- */
const PEC_POOL=[["TE",1,0],["TE",2,0],["TE",0,1],["TE",1,1],["TM",1,1],["TE",2,1],["TM",2,1],["TE",1,2],["TM",1,2],["TE",3,0],["TE",0,2],["TM",3,1]];
const PMC_POOL=[["TM",1,0],["TM",2,0],["TM",0,1],["TE",1,1],["TM",1,1],["TE",2,1],["TM",2,1],["TE",1,2],["TM",1,2]];
const GUIDES=[["WR-90",2.286,1.016],["WR-62",1.58,0.79],["WR-137",3.485,1.58],["WR-112",2.85,1.262],["WR-187",4.755,2.215],["WR-75",1.905,0.953],["a = 2b",2.0,1.0],["a = 1.5b",2.4,1.6]];

function roundIdentify(el,ctx,fin,pmc){

  // choices: truth, swapped indices, other family (may not exist!), a non-existent trap, neighbours
  const other=k==="TE"?"TM":"TE";const C=[md];const add=q=>{if(q.m<0||q.n<0||q.m+q.n===0)return;if(!C.some(x=>x.k===q.k&&x.m===q.m&&x.n===q.n))C.push(q);};
  if(m!==n)add({k,m:n,n:m});add({k:other,m,n});
  add(pmc?{k:"TE",m:1,n:0}:{k:"TM",m:1,n:0});add({k,m:m+1,n});add({k,m,n:n+1});add({k:other,m:n,n:m});
  const choices=shuffle([C[0],...shuffle(C.slice(1)).slice(0,3)]);
  el.innerHTML=`<div class="q" style="font-size:17px">Name this mode. ${pmc?`<b style="color:${CH}">PMC walls</b> (dashed): tangential <b>H</b> = 0, not E.`:"PEC walls."} The color map is the field component along <b style="color:${CK}">+z</b>.</div>
   <canvas class="viz game3d" data-g></canvas>${legendHTML}
   <canvas class="viz" data-x style="margin-top:6px"></canvas>
   <div class="seg" role="group" style="margin:10px 0">${[["EH","E + H"],["E","E only"],["H","H only"]].map(([v,l])=>`<button data-sh="${v}" aria-pressed="${v==="EH"}">${l}</button>`).join("")}</div>
   <div class="opts" style="display:grid;grid-template-columns:1fr 1fr">${choices.map((q,i)=>`<button class="opt" data-k="${i}" style="justify-content:center;align-items:center"><span class="ot" style="font:750 20px var(--fn);text-align:center">${nm(q)}</span></button>`).join("")}</div>`;
  const st={ab,pmc,er:1,mode:md,lg:3.4,show:"EH"};
  const S=guide3d(ctx,el.querySelector("[data-g]"),st);xsec(el.querySelector("[data-x]"),st);
  el.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{st.show=b.dataset.sh;el.querySelectorAll("[data-sh]").forEach(x=>x.setAttribute("aria-pressed",x===b));ctx.sfx.tap();});
  let done=false;el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const q=choices[+b.dataset.k];const ok=q===md;
    el.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(choices[i]===md)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
    st.label=nmt(md)+(pmc?" · PMC":"");st.labelCol=ok?GOOD:BAD;
    const fam=k==="TE"?`E has no z-component (only H<sub>z</sub>) ⇒ TE<sup>z</sup>, ${ctx.M(pmc?"$F_z\\propto\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$":"$F_z\\propto\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}$")}`
      :`H has no z-component (E<sub>z</sub> ≠ 0) ⇒ TM<sup>z</sup>, ${ctx.M(pmc?"$A_z\\propto\\cos\\frac{m\\pi x}{a}\\cos\\frac{n\\pi y}{b}$":"$A_z\\propto\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$")}`;
    let why="";if(!ok){if(!exists(q.k,q.m,q.n,pmc))why=` ${nm(q)} doesn't exist with ${pmc?"PMC":"PEC"} walls: ${sinsin(q.k,pmc)?"it needs sin·sin, and a zero index gives sin 0 = 0":"m = n = 0 makes the potential constant"}, so every field vanishes.`;
      else{const cnt=q.m!==m||q.n!==n;why=` ${nm(q)} ${q.k!==k?`is the other family (look at which field tilts into z)${cnt?" and has":""}`:"has"}${cnt?" the wrong counts: m is half-cycles across a (x, the long side), n across b (y)":""}.`;}}

function roundSetN(el,ctx,fin,hard){
  let g,er,N,L;for(let tries=0;tries<200;tries++){g=rnd(GUIDES);er=hard?rnd([2.25,2.56,4]):rnd([1,1,1,2.25,2.56]);N=hard?2+Math.floor(Math.random()*6):2+Math.floor(Math.random()*4);

  const inp=el.querySelector("[data-f]"),out=el.querySelector("output");const fv=()=>+inp.value*1e9;const upd=()=>{out.textContent=(+inp.value).toFixed(2);};upd();

      st.label=`${nmt(md)} ✓ (${idx%prop.length+1}/${prop.length})`;st.labelCol=GOOD;idx++;setTimeout(show,1600);};show();
    const ok=cnt===N;const sc=ok?1:Math.abs(cnt-N)===1?0.35:0;const lo=L[N-1].fc/1e9,hi=L[N].fc/1e9;

    fin(sc,`At ${(f/1e9).toFixed(2)} GHz, <b>${cnt} mode${cnt===1?"":"s"}</b> propagate${cnt===1?"s":""}${ok?"":` (target ${N})`}. Window for exactly ${N}: <b>${sig(lo,4)} &lt; f &lt; ${sig(hi,4)} GHz</b>. Cutoffs (GHz): ${list}. ${ctx.M(`$(f_c)_{mn}=\\frac{c}{2\\sqrt{\\varepsilon_r}}\\sqrt{(m/a)^2+(n/b)^2}$`)}${er>1?`; the filling lowers every cutoff by √${er}`:""}. TE<sub>mn</sub> and TM<sub>mn</sub> (m, n ≥ 1) share a cutoff, so they enter in pairs.`);};}

function roundImpedance(el,ctx,fin,qty,pmc){
  const g=rnd(GUIDES);const a=g[1]/100,b=g[2]/100;const er=rnd([1,1,2.25,2.56]);
  let md;if(pmc){md={k:"TE",m:1,n:1};}else{const [k,m,n]=rnd([["TE",1,0],["TE",1,0],["TE",1,0],["TE",2,0],["TE",0,1],["TM",1,1],["TE",1,1]]);md={k,m,n};}
  md.fc=fcOf(md.m,md.n,a,b,er);let f=Math.round(md.fc*(1.18+0.7*Math.random())/1e8)*1e8;if(f<md.fc*1.1)f+=2e8;
  const truth=qty==="Z"?zw(md,f,er):lamg(md,f,er)*100;const unit=qty==="Z"?"Ω":"cm";
  // common slips, for feedback
  const traps=[];const s=Math.sqrt(1-(md.fc/f)**2);
  if(qty==="Z"){if(er>1)traps.push([md.k==="TE"?ETA0/s:ETA0*s,"used η₀ = 120π instead of η = η₀/√ε_r"]);traps.push([md.k==="TE"?ETA0/Math.sqrt(er)*s:ETA0/Math.sqrt(er)/s,`used the ${md.k==="TE"?"TM":"TE"} formula`]);}
  else{if(er>1)traps.push([C0/f/s*100,"used λ₀ instead of λ = λ₀/√ε_r"]);traps.push([C0/(f*Math.sqrt(er))*s*100,"multiplied by √(1−(f_c/f)²) instead of dividing"]);}
  if(er>1){const fa=fcOf(md.m,md.n,a,b,1);if(fa<f){const s2=Math.sqrt(1-(fa/f)**2);traps.push([qty==="Z"?(md.k==="TE"?ETA0/Math.sqrt(er)/s2:ETA0/Math.sqrt(er)*s2):C0/(f*Math.sqrt(er))/s2*100,"used the air-filled cutoff (the filling lowers f_c by √ε_r)"]);}}
  if(pmc){const f10=fcOf(1,0,a,b,er),s3=Math.sqrt(1-(f10/f)**2);traps.push([qty==="Z"?ETA0/Math.sqrt(er)/s3:C0/(f*Math.sqrt(er))/s3*100,"used TE₁₀, which doesn't exist with PMC walls"]);}
  if(md.m!==md.n){const fs=fcOf(md.n,md.m,a,b,er);if(fs<f){const s4=Math.sqrt(1-(fs/f)**2);traps.push([qty==="Z"?(md.k==="TE"?ETA0/Math.sqrt(er)/s4:ETA0/Math.sqrt(er)*s4):C0/(f*Math.sqrt(er))/s4*100,"swapped a and b (a is the long side, along x)"]);}}
  const what=qty==="Z"?`the wave impedance <b>Z<sub>w</sub></b> (Ω)`:`the guide wavelength <b>λ<sub>g</sub></b> (cm)`;
  const modeTxt=pmc?`the <b>lowest TE<sup>z</sup> mode</b> of this <b style="color:${CH}">PMC-walled</b> guide`:`<b>${nm(md)}</b>`;
  el.innerHTML=`<div class="q" style="font-size:17px">${modeTxt} at <b style="color:${CG}">f = ${sig(f/1e9,4)} GHz</b>; a = ${g[1]} cm, b = ${g[2]} cm, ${er>1?`ε<sub>r</sub> = ${er}`:"air"}. Find ${what} within 1%. <small class="mut">c = 3×10⁸, η₀ = 120π</small></div>
   <canvas class="viz game3d" data-g></canvas>${legendHTML}
   <div class="form" style="grid-template-columns:1fr;margin-top:8px"><label style="display:block">${qty==="Z"?"Z<sub>w</sub> (Ω)":"λ<sub>g</sub> (cm)"}<input data-v style="width:100%;margin-top:4px" inputmode="decimal" autocomplete="off" placeholder="your answer in ${unit}" style="font-size:20px;min-height:52px"></label></div>
   <button class="btn cta block" data-fire style="margin-top:10px">FIRE ▸</button>`;
  const B=AW/(a/b),bc=Math.hypot(md.m*PI/AW,md.n*PI/B),r=Math.sqrt((f/md.fc)**2-1);
  const st={ab:a/b,pmc,er,mode:pmc?null:md,lg:Math.max(0.9,Math.min(14,2*PI/(bc*r))),label:pmc?"lowest TE?":nmt(md),labelCol:CG,empty:pmc?"which TE mode comes first?":""};
  guide3d(ctx,el.querySelector("[data-g]"),st);
  const inp=el.querySelector("[data-v]");let done=false;
  const fire=()=>{if(done)return;const u=parseFloat(String(inp.value).replace(",","."));if(!(u>0)){ctx.sfx.miss();inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");inp.focus();return;}
    done=true;inp.disabled=true;const rel=Math.abs(u/truth-1);const sc=rel<=0.01?1:rel<=0.02?0.6:rel<=0.05?0.3:0;
    st.mode=md;st.label=nmt(md)+(sc>=0.7?" ✓":"");st.labelCol=sc>=0.7?GOOD:BAD;st.empty="";
    const trap=sc<0.7&&traps.find(([v])=>Math.abs(u/v-1)<0.015);
    const eta=ETA0/Math.sqrt(er),lam=C0/(f*Math.sqrt(er))*100;
    const eq=qty==="Z"?(md.k==="TE"?`$Z_w^{TE}=\\frac{\\eta}{\\sqrt{1-(f_c/f)^2}}=\\frac{${sig(eta,4)}}{${sig(s,4)}}=${sig(truth,4)}\\ \\Omega$`:`$Z_w^{TM}=\\eta\\sqrt{1-(f_c/f)^2}=${sig(eta,4)}(${sig(s,4)})=${sig(truth,4)}\\ \\Omega$`)
