<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAXWELL</title>
<meta name="description" content="ELEG 648 study app">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0C10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAXWELL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{
 --bg:#0B0C10;--surface:#13151B;--surface-2:#1B1E27;--line:#262A36;--line-2:#323748;
 --fg:#ECEEF4;--muted:#9AA0B2;--faint:#6A7083;
 --cta:#C7B6FF;--cta-ink:#17121F;--good:#78D58C;--bad:#F2668A;--warn:#F2BF4C;
 --e:#4FC8D8;--h:#C7B6FF;--acc:#FF9F5A;
 --fd:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
 --fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --fn:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 --r:18px;--r-s:12px;--t-fast:150ms;--t-base:220ms;--ease-out:cubic-bezier(.2,.8,.2,1);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
 color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cta)}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 16px 10px;background:rgba(11,12,16,.78);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color var(--t-base)}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--fd);letter-spacing:.2em;background:none;border:0;padding:6px 0;min-height:44px}
.mark{width:34px;height:22px;flex:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.bars i{display:block;width:5px;border-radius:3px}
.bars i:nth-child(1){height:11px;background:var(--e)}.bars i:nth-child(2){height:20px;background:var(--h)}.bars i:nth-child(3){height:15px;background:var(--acc)}
.top .sp{flex:1}
.iconbtn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.iconbtn:active{transform:scale(.96)}
.back{display:none}.has-back .back{display:inline-grid}.has-back .brand span.word{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--fn);background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.hot{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--bg));border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}

/* ---------- layout ---------- */
main{max-width:760px;margin:0 auto;padding:12px 16px calc(96px + var(--sab))}
.view{animation:vin var(--t-base) var(--ease-out)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:800 34px/1.08 var(--fd);letter-spacing:-.02em;margin:14px 0 6px}
h2{font:750 24px/1.15 var(--fd);letter-spacing:-.01em;margin:22px 0 8px}
h3{font:700 18px/1.25 var(--fd);margin:18px 0 6px}
p{margin:.55em 0}
.sub{color:var(--muted);margin:0 0 14px}
.grad{background:linear-gradient(90deg,var(--e),var(--h));-webkit-background-clip:text;background-clip:text;color:transparent}
.lab{display:block;font:700 12px/1.2 var(--fn);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.card.tight{padding:14px}
.card.acc{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mut{color:var(--muted)}.faint{color:var(--faint)}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.big{font:800 56px/1 var(--fd);letter-spacing:-.03em;color:var(--acc)}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:650;transition:transform var(--t-fast) var(--ease-out),background var(--t-fast),border-color var(--t-fast)}
.btn:active{transform:scale(.97)}
.btn.cta{background:var(--cta);color:var(--cta-ink);border-color:transparent;font:750 17px/1 var(--fd)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.kbd{font:600 11px var(--fn);color:var(--faint);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;margin-left:6px}
@media(hover:none){.kbd{display:none}}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.seg button{min-height:40px;min-width:44px;padding:6px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:650}
.li .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.li .r{font:500 13px var(--fn);color:var(--muted);white-space:nowrap}
.li .chev{color:var(--faint)}
button.li:active{background:var(--surface-2)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--sab));background:rgba(15,16,21,.88);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 2px;border:0;background:none;color:var(--faint);font:600 11px/1 var(--fb);border-radius:12px;transition:color var(--t-fast)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--fg)}
.tabs button[aria-current=page] svg{color:var(--cta)}
.tabs button .badge{position:absolute;margin-left:22px;margin-top:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#160a0e;font:700 10px/16px var(--fn)}
@media(min-width:900px){.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:16px;border:1px solid var(--line);border-radius:20px;padding:6px;gap:4px;width:auto}.tabs button{min-width:92px}main{padding-bottom:120px}}

/* ---------- rings ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid transparent;background:none}
.rp{position:relative;display:inline-block;flex:none}
.rp svg{display:block;transform:rotate(-90deg)}
.rp circle{fill:none;stroke-width:7}
.rp .trk{stroke:var(--surface-2)}
.rp .val{stroke-linecap:round;transition:stroke-dashoffset 900ms var(--ease-out)}
.ring .rl{font:600 12px var(--fn);color:var(--muted);text-align:center;line-height:1.2}
.rp b{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--fn)}
.ring.off{opacity:.42}
button.ring:active{background:var(--surface-2)}

/* ---------- learning content ---------- */
.lesson-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font:650 11px/1.4 var(--fn);letter-spacing:.04em;border:1px solid var(--line-2);color:var(--muted);vertical-align:middle}
.tag.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.supp{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tag.nl{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.hook{font:700 20px/1.3 var(--fd);margin:6px 0 4px}
.intu p{font-size:17px}
.aside{border-left:3px solid var(--acc);padding:10px 14px;margin:14px 0;background:color-mix(in srgb,var(--acc) 6%,transparent);border-radius:0 12px 12px 0}
.aside .lab{color:var(--acc);margin-bottom:4px}
.flag{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.mstep{border-top:1px solid var(--line);padding:14px 0 6px}
.mstep:first-of-type{border-top:0;padding-top:4px}
.mstep .mt{font:650 14px var(--fn);color:var(--acc);margin-bottom:4px}
.mstep .note{color:var(--muted);font-size:15px}
.mathbox{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:4px 2px;margin:4px 0}
.mathbox.ans{border:1.5px solid var(--acc);border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--acc) 6%,transparent)}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math;font-size:1.08em}
math[display=block]{margin:.3em 0}
.katex-display{display:block;margin:0}
.katex{white-space:normal}
.steps .st{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);animation:vin var(--t-base) var(--ease-out)}
.steps .st:first-child{border-top:0}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--fn);background:var(--surface-2);color:var(--acc);border:1px solid var(--line-2)}
.steps .mv{font-weight:700}
.steps .why{color:var(--muted);font-size:15px;grid-column:2}
.steps .st .mathbox{grid-column:2}
.reveal-bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width var(--t-base) var(--ease-out)}

/* ---------- quiz ---------- */
.q{font:600 19px/1.4 var(--fd);margin:4px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:56px;padding:13px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);transition:transform var(--t-fast) var(--ease-out),border-color var(--t-fast),background var(--t-fast)}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--fn);background:var(--bg);color:var(--muted);border:1px solid var(--line-2)}
.opt .ot{flex:1;min-width:0}
.opt .ow{display:none;color:var(--muted);font-size:14px;margin-top:4px}
.opts.done .opt{pointer-events:none}
.opts.done .opt .ow{display:block}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface-2))}
.opt.right .k{background:var(--good);color:#0b1a0f;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface-2))}
.opt.wrong .k{background:var(--bad);color:#1c0a10;border-color:transparent}
.opts.done .opt:not(.right):not(.wrong){opacity:.62}
.verdict{display:flex;align-items:center;gap:10px;font:750 18px var(--fd);margin:14px 0 4px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.verdict svg{width:26px;height:26px}
.pop{animation:pop 420ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.shake{animation:shake 300ms var(--ease-out)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qhead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.qhead .progress{flex:1;margin:0}
.statement{font-size:17px}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.ansgrid div{border:1.5px solid var(--acc);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--acc) 7%,transparent)}
.ansgrid small{display:block;color:var(--muted);font:600 12px var(--fn)}
.ansgrid b{font:700 20px var(--fn)}
.ansgrid i{font-style:normal;color:var(--muted);font:500 13px var(--fn);margin-left:4px}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

/* ---------- vault ---------- */
.search{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;min-height:46px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600}
.chips button[aria-pressed=true]{color:var(--fg);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.eq h4{margin:0;font:700 16px var(--fd)}
.eq .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px}
.eq .meta dt{font:650 11px/1.9 var(--fn);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.eq .meta dd{margin:0;color:var(--muted)}
.eq .when{color:var(--fg)}

/* ---------- widgets ---------- */
.viz{display:block;width:100%;height:auto;border-radius:12px;background:#07080C;border:1px solid var(--line);touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--fn);color:var(--muted);margin:8px 0}
.legend .e{color:var(--e)}.legend .h{color:var(--h)}.legend .a{color:var(--acc)}.legend .g{color:var(--good)}
.rng{display:flex;align-items:center;gap:10px;width:100%;font:600 13px var(--fn);color:var(--muted)}
.rng input{flex:1;accent-color:var(--acc);min-height:44px}
.rng output{min-width:64px;text-align:right;color:var(--fg)}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.readout div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.readout small{display:block;font:600 11px var(--fn);color:var(--faint)}
.readout b{font:700 15px var(--fn)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font:600 12px var(--fn);color:var(--muted)}
.form input{min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);font:600 15px var(--fn)}
@media(max-width:420px){.form{grid-template-columns:1fr 1fr}}

/* ---------- exam ---------- */
.timer{font:700 15px var(--fn);color:var(--muted)}
.timer.low{color:var(--bad)}
.bars-h{display:flex;flex-direction:column;gap:10px}
.bh{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.bh .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bh .tr i{display:block;height:100%;border-radius:4px;transition:width 700ms var(--ease-out)}
.scorebig{font:800 64px/1 var(--fd);letter-spacing:-.03em}

/* ---------- toast / sheet ---------- */
.toast{position:fixed;left:50%;top:calc(70px + var(--sat));z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.5);font-weight:650;animation:tin 380ms var(--ease-out);max-width:calc(100% - 32px)}
.toast .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cta);color:var(--cta-ink);font:800 16px var(--fd);flex:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);animation:fade var(--t-base)}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab));animation:sup var(--t-base) var(--ease-out);max-height:85vh;overflow:auto}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badges span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;font-weight:600}
.empty{padding:20px;text-align:center;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (prefers-reduced-motion: reduce){
 *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}}

.mathbox{scrollbar-width:thin}
.mathbox.scrolls{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
</style>

<script>/* MAXWELL interactive widgets. Each widget: (el, ctx) => mounts into el. Animation loops are tracked so the
   app can stop them on navigation. Drawing is done in a 900-wide logical space scaled to the element, with
   px() converting real pixels (fonts, line widths) into logical units so text stays readable on a phone. */
const W8=(function(){
"use strict";
const PI=Math.PI,C0=3e8,ETA0=120*PI;
const COL={bg:"#07080C",e:"#4FC8D8",h:"#C7B6FF",acc:"#FF9F5A",good:"#78D58C",bad:"#F2668A",warn:"#F2BF4C",txt:"#C9CEDA",mut:"#8C92A4",grid:"#262A36"};
const RM=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const live=new Set();
function stopAll(){live.forEach(f=>{try{f()}catch(e){}});live.clear();}
function loop(fn){let id=0,on=true;const tick=t=>{if(!on)return;if(fn(t)!==false)id=requestAnimationFrame(tick);};id=requestAnimationFrame(tick);const stop=()=>{on=false;cancelAnimationFrame(id);};live.add(stop);return stop;}
function setup(cv,LW,LH){const cw=Math.max(280,cv.clientWidth||cv.parentElement.clientWidth||340);const s=cw/LW;const r=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cw*r);cv.height=Math.round(LH*s*r);cv.style.aspectRatio=LW+"/"+LH;const c=cv.getContext("2d");c.setTransform(r*s,0,0,r*s,0,0);
  c.px=n=>n/s;c.font_=(n,w)=>{c.font=`${w||500} ${n/s}px ui-monospace,"SF Mono",Menlo,monospace`;};return c;}

      c.strokeStyle="rgba(79,200,216,.5)";c.lineWidth=c.px(1.5);c.beginPath();for(let q=0;q<60;q++){const ps=Math.max(0,path-q*6);const zq=x0+ps*cosP,yq=ps*sinP%(2*wid);const ypp=yq<wid?y1-yq:y0+(yq-wid);q?c.lineTo(Math.min(zq,x1),ypp):c.moveTo(Math.min(zq,x1),ypp);}c.stroke();

/* ---------- special functions ---------- */
function besselJ(n,x){let s=0;const N=200;for(let i=0;i<=N;i++){const t=PI*i/N;const w=(i===0||i===N)?1:(i%2?4:2);s+=w*Math.cos(n*t-x*Math.sin(t));}return s*PI/N/3/PI;}
function besselY(n,x){if(x<=0)return -Infinity;let s1=0;const N=200;for(let i=0;i<=N;i++){const t=PI*i/N;const w=(i===0||i===N)?1:(i%2?4:2);s1+=w*Math.sin(x*Math.sin(t)-n*t);}s1*=PI/N/3/PI;
  const T=Math.asinh(40/x)+n*0.5+1;let s2=0;const M=600;for(let i=0;i<=M;i++){const t=T*i/M;const w=(i===0||i===M)?1:(i%2?4:2);s2+=w*(Math.exp(n*t)+(n%2?-1:1)*Math.exp(-n*t))*Math.exp(-x*Math.sinh(t));}s2*=T/M/3/PI;return s1-s2;}
function sphJY(n,x){let j0=Math.sin(x)/x,j1=Math.sin(x)/(x*x)-Math.cos(x)/x,y0=-Math.cos(x)/x,y1=-Math.cos(x)/(x*x)-Math.sin(x)/x;if(n===0)return[j0,y0];if(n===1)return[j1,y1];
  for(let k=1;k<n;k++){const j2=(2*k+1)/x*j1-j0,y2=(2*k+1)/x*y1-y0;j0=j1;j1=j2;y0=y1;y1=y2;}return[j1,y1];}
function legendre(n,m,x){let pmm=1;if(m>0){const s=Math.sqrt((1-x)*(1+x));let f=1;for(let i=1;i<=m;i++){pmm*=-f*s;f+=2;}}if(n===m)return pmm;let pm1=x*(2*m+1)*pmm;if(n===m+1)return pm1;let pn=0;for(let l=m+2;l<=n;l++){pn=(x*(2*l-1)*pm1-(l+m-1)*pmm)/(l-m);pmm=pm1;pm1=pn;}return pn;}
W.special={besselJ,besselY,sphJY,legendre};

    c.fillStyle="rgba(79,200,216,.16)";c.strokeStyle=COL.e;c.lineWidth=c.px(2.4);c.beginPath();for(let i=0;i<=720;i++){const th=rad(i/2);const r=R*Math.abs(Math.sin(th));const x=cx0+r*Math.sin(th),y=cy0-r*Math.cos(th);i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();c.fill();c.stroke();
    const XL=420,XR=LW-20,YT=30,YB=LH-30;axes(c,XL,XR,YT,YB);const lx0=-1.3,lx1=1,X=l=>XL+(XR-XL)*(l-lx0)/(lx1-lx0),ly0=-3,ly1=4,Y=v=>YB-(YB-YT)*(Math.log10(v)-ly0)/(ly1-ly0);

    label(c,"1/βr (radiation)",XR-c.px(130),Y(1/10**lx1)-c.px(30),COL.good,11);label(c,"1/(βr)³ (quasi-static)",XL+c.px(6),YT+c.px(26),COL.bad,11);label(c,"βr",XR-c.px(18),YB+c.px(15));
    const reg=br<0.3?"near field (reactive, 1/r³ dominates)":br>3?"far field (radiation, 1/r dominates)":"intermediate (Fresnel-like)";
    el.querySelector(".readout").innerHTML=ro([["region",reg],["1/βr",(1/br).toFixed(3)],["1/(βr)²",(1/br**2).toFixed(3)],["1/(βr)³",(1/br**3).toFixed(3)],["HPBW","90°"],["directivity","1.5 (1.76 dBi)"]]);}

/* ---------- friis ---------- */
W.friis=function(el,ctx){el.innerHTML=`<canvas class="viz"></canvas>${rng("pt","P_t (dBm)",0,60,1,30)}${rng("gt","G_t (dBi)",0,40,0.5,10)}${rng("gr","G_r (dBi)",0,40,0.5,10)}${rng("f","f (GHz)",0.1,100,0.1,10)}${rng("lr","log₁₀ R (m)",0,7,0.01,3)}<div class="readout"></div>`;
  const cv=el.querySelector("canvas");
  function draw(){const pt=val(el,"pt"),gt=val(el,"gt"),gr=val(el,"gr"),f=val(el,"f")*1e9,R=10**val(el,"lr");show(el,"pt",pt);show(el,"gt",gt);show(el,"gr",gr);show(el,"f",(f/1e9).toFixed(1));show(el,"lr",f3(R,3)+" m");

   <div class="legend"><span class="e">— E(t) = cos ωt</span><span class="h">— H(t) = cos(ωt − ψ)</span><span class="a">— S(t) = E·H</span><span class="g">┄ S_av = ½ Re(E H*)</span></div>`;

    const XL=40,XR=LW-20,y0=150,A=110,X=t=>XL+(XR-XL)*t/(4*PI),Y=v=>y0-v*A;c.strokeStyle=COL.grid;c.beginPath();c.moveTo(XL,y0);c.lineTo(XR,y0);c.stroke();

<script>/* MAXWELL app. Rendering and logic only; all course content lives in window.MAXWELL_DATA. */
(function(){
"use strict";
const D=window.MAXWELL_DATA, CH=D.chapters, $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const RM=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- math: KaTeX → native MathML ---------------- */
const MC=new Map();
function stripBoxed(t){let out="",i=0,box=false;while(i<t.length){const j=t.indexOf("\\boxed{",i);if(j<0){out+=t.slice(i);break;}out+=t.slice(i,j);box=true;let k=j+7,d=1;while(k<t.length&&d){if(t[k]==="{")d++;else if(t[k]==="}")d--;k++;}out+=t.slice(j+7,k-1);i=k;}return{t:out,box};}
function tex(t,disp){const key=(disp?"D":"I")+t;if(MC.has(key))return MC.get(key);let h;
  try{h=katex.renderToString(t,{displayMode:!!disp,output:"mathml",throwOnError:false,strict:false});}catch(e){h=`<code>${esc(t)}</code>`;}MC.set(key,h);return h;}
function M(s){if(s==null)return"";return String(s).replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>tex(stripBoxed(t).t,true)).replace(/\$([^$]+?)\$/g,(m,t)=>tex(t,false)).replace(/¶/g,"</p><p>");}
function block(t){const s=stripBoxed(t);return `<div class="mathbox${s.box?" ans":""}" data-t="${esc(s.t)}">${tex(s.t,true)}</div>`;}
/* top-level split points (outside braces, \left..\right and environments) */
function topSplit(t,re){const out=[];let d=0,start=0,i=0;while(i<t.length){const ch=t[i];
  if(ch==="\\"){const m=/^\\(left|right|begin|end)\b/.exec(t.slice(i));if(m){d+=(m[1]==="left"||m[1]==="begin")?1:-1;i+=m[0].length;continue;}
    if(d===0){const r=re.exec(t.slice(i));if(r&&r.index===0){out.push(t.slice(start,i));out.push(r[0]);i+=r[0].length;start=i;continue;}}i+=2;continue;}
  if(ch==="{")d++;else if(ch==="}")d--;else if(d===0){const r=re.exec(t.slice(i));if(r&&r.index===0){out.push(t.slice(start,i));out.push(r[0]);i+=r[0].length;start=i;continue;}}i++;}
  out.push(t.slice(start));return out;}
function splitTex(t,level){const sep=/^(\\qquad|,\s*\\quad|;\s*\\quad|\\quad|,\\ \\ )/;const segs=topSplit(t,sep).filter((x,k)=>k%2===0).map(x=>x.trim()).filter(Boolean);
  const eqs=s=>{const p=topSplit(s,/^(=|\\Rightarrow|\\approx|\\simeq|\\le|\\ge)(?![a-zA-Z])/);if(p.length<5)return s;let o=p[0]+"&"+p[1]+p[2];for(let k=3;k<p.length;k+=2)o+="\\\\&"+p[k]+p[k+1];return "\\begin{aligned}"+o+"\\end{aligned}";};
  const lines=level>1?segs.map(eqs):segs;return lines.length>1?"\\begin{gathered}"+lines.join("\\\\")+"\\end{gathered}":lines[0];}
function fitMath(root){$$(".mathbox[data-t]",root).forEach(b=>{if(b.dataset.fit)return;const w=b.clientWidth;if(!w)return;let t=b.dataset.t;
  for(const lv of [1,2]){if(b.scrollWidth<=w+2)break;const nt=splitTex(t,lv);if(nt!==t){b.innerHTML=tex(nt,true);}}
  b.dataset.fit=1;b.classList.toggle("scrolls",b.scrollWidth>w+2);});}
const fitObs=new MutationObserver(()=>requestAnimationFrame(()=>fitMath(document)));
/* plain-text subscripts for option labels like "v_g", "TE₁₀" */
function TX(s){return esc(s).replace(/([A-Za-zβαληεψφδσ])_\{?([A-Za-z0-9,]+)\}?/g,"$1<sub>$2</sub>").replace(/\^\{?([A-Za-z0-9−-]+)\}?/g,"<sup>$1</sup>");}
const MX=s=>/\$/.test(String(s))?M(s):TX(s);
const CTX={tex,M};

/* ---------------- storage ---------------- */
const KEY="maxwell:v1";let MEM=null;
const fresh=()=>({v:1,items:{},lessons:{},days:[],exams:[],badges:[],trEver:0,created:Date.now()});
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}return MEM||fresh();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){MEM=S;}}

/* ---------------- dates ---------------- */
const DAY=864e5;
const dkey=d=>{d=d?new Date(d):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const sod=d=>{const x=d?new Date(d):new Date();x.setHours(0,0,0,0);return+x;};
function streak(){const set=new Set(S.days);let n=0,d=sod();if(!set.has(dkey(d)))d-=DAY;while(set.has(dkey(d))){n++;d-=DAY;}return n;}
function markDay(){const k=dkey();if(!S.days.includes(k)){S.days.push(k);if(S.days.length>400)S.days=S.days.slice(-400);}}

/* ---------------- item registry ---------------- */
const ITEMS={},ORDER=[];
CH.forEach(ch=>{if(!ch.lessons)return;
  const add=(kind,o,id)=>{const it={kind,ch:ch.id,id,o,topic:o.topic||"general"};ITEMS[id]=it;ORDER.push(id);};
  ch.cards.forEach(o=>add("card",o,o.id));ch.fm.forEach(o=>add("fm",o,o.id));ch.problems.forEach(o=>add("prob",o,"p"+o.id));});
const COST={card:.5,fm:1.5,prob:5};
const chOf=id=>CH.find(c=>c.id===id);
const chl=c=>c.id==="ant"?"ANT":"Ch. "+c.num;

/* ---------------- spaced repetition (Leitner) ---------------- */
const IV=[0,1,2,4,8,16,32];
const rec=id=>S.items[id]||(S.items[id]={b:0,due:0,miss:0,run:0,n:0,tr:false});
function grade(id,ok,quiet){const r=rec(id);const wasTr=troubleIds().length;r.n++;r.last=Date.now();
  if(ok){r.b=Math.min(r.b+1,IV.length-1);r.run++;r.due=sod()+IV[r.b]*DAY;if(r.tr&&r.run>=3){r.tr=false;if(!quiet)toast("✓","Cleared from Trouble Spots: 3 in a row");}}
  else{r.b=0;r.run=0;r.miss++;r.due=Date.now()+10*6e4;if(r.miss>=2&&!r.tr){r.tr=true;S.trEver=(S.trEver||0)+1;}}
  markDay();const nowTr=troubleIds().length;if(wasTr>0&&nowTr===0)award("clear-"+dkey(),"Trouble Spots cleared","Every missed item is back on solid ground.");
  checkMastery();save();}
const troubleIds=()=>Object.keys(S.items).filter(k=>S.items[k].tr&&ITEMS[k]);
function dueIds(){const end=sod()+DAY;return Object.keys(S.items).filter(k=>ITEMS[k]&&S.items[k].due<end).sort((a,b)=>(S.items[b].tr-S.items[a].tr)||(S.items[a].due-S.items[b].due));}
function mastery(chId){const ids=ORDER.filter(k=>ITEMS[k].ch===chId);if(!ids.length)return 0;const ch=chOf(chId);
  const it=ids.reduce((s,k)=>s+Math.min(4,(S.items[k]||{b:0}).b)/4,0)/ids.length;const ls=ch.lessons.filter(l=>S.lessons[ch.id+":"+l.id]).length/ch.lessons.length;return Math.round(100*(.8*it+.2*ls));}
function checkMastery(){CH.forEach(c=>{if(c.lessons&&mastery(c.id)>=90)award("master-"+c.id,`Chapter ${c.num} mastered`,`${c.title}: 90% mastery.`);});}
function award(id,title,body){if(S.badges.find(b=>b.id===id))return;S.badges.push({id,title,body,at:Date.now()});save();toast("★",title,body);confetti();}

/* today's 15 minutes: due/trouble first, then new items in course order */
function queue(){const q=[],used=new Set();let t=0;const cap=15;
  for(const id of dueIds()){if(t+COST[ITEMS[id].kind]>cap+1)continue;q.push(id);used.add(id);t+=COST[ITEMS[id].kind];}
  const lect=new Set(CH.filter(c=>c.status==="lectured").map(c=>c.id));
  const ev=nextEvent(),focus=new Set((ev&&ev.chs)||[]);const fresh=ORDER.filter(id=>!S.items[id]&&lect.has(ITEMS[id].ch)).sort((x,y)=>(focus.has(ITEMS[y].ch)?1:0)-(focus.has(ITEMS[x].ch)?1:0));
  // interleave: 1 first-move, 2 cards, then a problem when time allows
  const by=k=>fresh.filter(id=>ITEMS[id].kind===k);const F=by("fm"),Cd=by("card"),P=by("prob");
  while(t<cap&&(F.length||Cd.length||P.length)){
    for(const [arr,n] of [[F,1],[Cd,2],[P,1]])for(let i=0;i<n&&arr.length;i++){const id=arr.shift();const c=COST[ITEMS[id].kind];if(t+c>cap+.5)continue;q.push(id);t+=c;}
    if(t>=cap-.4)break;if(!F.length&&!Cd.length)break;}
  return{ids:q,min:Math.round(t)};}

/* ---------------- UI chrome ---------------- */
const ICON={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',

 drill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>',
 vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 9.5h8M8 14.5h5"/></svg>',
 exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 13V9.5M9.5 2.8h5"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',

 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
 gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>'};
const TABS=[["today","Today"],["learn","Learn"],["drill","Drill"],["vault","Vault"],["exam","Exam"]];
let NAV={tab:"today",stack:[]};   // stack of {v:viewName, ...params}
let SESSION=null, EXAM=null, keyHandler=null;

function chrome(){document.body.innerHTML=`
 <header class="top" id="top"><button class="iconbtn back" id="back" aria-label="Back">${ICON.back}</button>
  <button class="brand" id="home" aria-label="MAXWELL home"><svg class="mark" viewBox="0 0 64 40" aria-hidden="true"><path d="M4 20 H58" stroke="#FF9F5A" stroke-width="3.5" stroke-linecap="round"/><path d="M60 20 l-7 -4.5 v9z" fill="#FF9F5A"/><path d="M8 20 C14 30 20 30 26 20" stroke="#C7B6FF" stroke-width="3.5" fill="none" stroke-linecap="round" transform="skewX(-25) translate(9 0)"/><path d="M8 20 C12 2 20 2 26 20 S40 38 46 20" stroke="#4FC8D8" stroke-width="4" fill="none" stroke-linecap="round"/></svg><span class="word">MAXWELL</span></button>
  <span class="sp"></span><span id="topx"></span><button class="iconbtn" id="gear" aria-label="Backup and settings">${ICON.gear}</button></header>
 <main id="main"></main>
 <nav class="tabs" id="tabs" aria-label="Sections">${TABS.map(([k,l])=>`<button data-tab="${k}">${ICON[k]}<span>${l}</span></button>`).join("")}</nav>`;
 $("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go(b.dataset.tab);});
 $("#back").addEventListener("click",back);$("#home").addEventListener("click",()=>go("today"));$("#gear").addEventListener("click",settings);
 addEventListener("scroll",()=>$("#top").classList.toggle("scrolled",scrollY>4),{passive:true});
 document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;if(keyHandler&&keyHandler(e)){e.preventDefault();}});}

function push(v){NAV.stack.push(v);render();scrollTo(0,0);}
function back(){if(NAV.stack.length){NAV.stack.pop();SESSION=null;render();scrollTo(0,0);}else go(NAV.tab==="today"?"today":NAV.tab);}
function render(){W8.stopAll();keyHandler=null;const top=NAV.stack[NAV.stack.length-1];
  $$("#tabs [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===NAV.tab?"page":"false"));
  document.body.classList.toggle("has-back",!!top);
  const tr=troubleIds().length;const tb=$('#tabs [data-tab="drill"]');tb.querySelector(".badge")?.remove();if(tr)tb.insertAdjacentHTML("afterbegin",`<span class="badge">${tr}</span>`);
  const st=streak();$("#topx").innerHTML=st?`<span class="chip hot"><span class="dot"></span>${st}-day streak</span>`:"";
  const main=$("#main");const v=document.createElement("div");v.className="view";main.replaceChildren(v);
  const V=top?VIEWS[top.v]:VIEWS[NAV.tab];V(v,top||{});}

/* ---------------- toast / confetti / sheet ---------------- */
function toast(icon,title,body){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML=`<span class="medal">${icon}</span><span><b>${esc(title)}</b>${body?`<br><small class="mut">${esc(body)}</small>`:""}</span>`;document.body.appendChild(t);setTimeout(()=>t.remove(),3600);}
function confetti(){if(RM())return;const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;const c=cv.getContext("2d");c.scale(r,r);
  const cols=["#4FC8D8","#C7B6FF","#FF9F5A","#78D58C","#F2BF4C"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6}));let n=0;
  (function f(){c.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.1;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});if(++n<120)requestAnimationFrame(f);else cv.remove();})();}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* stable shuffled option order per item view */
function order(n,correct){const idx=shuffle([...Array(n).keys()]);return{idx,ans:idx.indexOf(correct)};}
function verdict(ok){return `<div class="verdict ${ok?"ok":"no"}"><span class="pop">${ok?ICON.ok:ICON.no}</span>${ok?["Exactly.","That's it.","Right move.","Clean."][Math.random()*4|0]:"Not quite. Here's why."}</div>`;}
function mcq(root,opts,correct,onPick){const {idx,ans}=order(opts.length,correct);
  root.innerHTML=`<div class="opts" role="list">${idx.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span class="ot">${opts[oi][0]}${opts[oi][1]?`<div class="ow">${opts[oi][1]}</div>`:""}</span></button>`).join("")}</div>`;
  let picked=null;const pick=k=>{if(picked!=null)return;picked=k;const box=$(".opts",root);box.classList.add("done");$$(".opt",box).forEach((b,j)=>{if(j===ans)b.classList.add("right");else if(j===k)b.classList.add("wrong");});if(k!==ans)$$(".opt",box)[k].classList.add("shake");onPick(k===ans);};
  root.addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.k);});
  return k=>{if(k<idx.length){pick(k);return true;}return false;};}
const PLAY={
 card(b,it,cb){const o=it.o;b.innerHTML=`<div class="q">${TX(o.q)}</div><div data-o></div><div data-v></div>`;let done=false;

  keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!done)return pk(+e.key-1);if((e.key==="ArrowRight"||e.key==="Enter")&&done){cb.next();return true;}};},
 fm(b,it,cb){const o=it.o;const sol=solutionFor(o);let done=false,shown=0,rev=null;
  b.innerHTML=`<span class="lab">${esc(o.src)}${o.src.includes("lecture")?"":""}</span><div class="statement card tight" style="margin:0 0 12px">${TX(o.prompt)}</div><div class="q" style="font-size:17px">What's your first move?</div><div data-o></div><div data-v></div><div data-sol></div>`;
  const pk=mcq($("[data-o]",b),o.opts.map(([t,w])=>[TX(t),TX(w)]),o.a,ok=>{done=true;cb.onGrade(ok);
   $("[data-v]",b).innerHTML=verdict(ok)+(sol?`<div class="reveal-bar"><button class="btn sm" data-rs>Walk the solution<span class="kbd">space</span></button><button class="btn cta sm" data-n style="flex:1">Next<span class="kbd">→</span></button></div>`:`<button class="btn cta block" data-n>Next</button>`);
   $("[data-n]",b).addEventListener("click",cb.next);const rs=$("[data-rs]",b);
   if(rs){const upd=()=>{$("[data-sol]",b).innerHTML=`<div class="card acc"><span class="lab">Worked solution · ${shown}/${sol.steps.length}</span><b>${M(sol.title)}</b>${stepsHTML(sol.steps,shown)}${shown>=sol.steps.length&&sol.ans?ansHTML(sol.ans):""}</div>`;rs.textContent=shown>=sol.steps.length?"Solution complete":"Next step";rs.disabled=shown>=sol.steps.length;};
     rev=()=>{if(shown<sol.steps.length){shown++;upd();return true;}return false;};rs.addEventListener("click",rev);}});
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!done)return pk(+e.key-1);if(e.key===" "&&done&&rev){rev();return true;}if((e.key==="ArrowRight"||e.key==="Enter")&&done){cb.next();return true;}};},
 prob(b,it,cb){const o=it.o;let h=0;const N=o.steps.length;let ansShown=false,graded=false;
  const draw=()=>{b.innerHTML=`<span class="lab">${esc(o.src||("HW "+o.id))} · ${esc(o.tag)}</span><div class="statement">${M(o.st)}</div>
   <div class="card tight" style="margin-top:12px"><span class="lab">Hints · ${Math.min(h,N+1)}/${N+1}</span>
    ${h>=1?`<div class="aside" style="margin:0 0 6px"><span class="lab">First move</span>${M(o.first)}</div>`:`<p class="mut" style="margin:0">Try it on paper first. Each hint unlocks one step.</p>`}
    ${h>=2?stepsHTML(o.steps,h-1):""}
    <div class="reveal-bar">${h<=N?`<button class="btn sm" data-h>${h===0?"First move":"Next step"}<span class="kbd">space</span></button>`:""}${!ansShown?`<button class="btn sm ghost" data-a>Show answer</button>`:""}</div></div>
   ${ansShown?`<div class="card acc"><span class="lab">Answer</span>${o.ans&&o.ans.length?ansHTML(o.ans):`<p>Derivation problem. The full worked path is in the steps above.</p>`}${o.trap?`<div class="flag"><b>Trap:</b> ${M(o.trap)}</div>`:""}${o.pic?`<p class="mut"><b>Picture:</b> ${M(o.pic)}</p>`:""}
    ${graded?`<button class="btn cta block" data-n>Next<span class="kbd">→</span></button>`:`<span class="lab" style="margin-top:12px">How did it go?</span><div class="selfgrade"><button class="btn" data-g="1" style="border-color:var(--good)">Got it<span class="kbd">1</span></button><button class="btn" data-g="0" style="border-color:var(--bad)">Missed it<span class="kbd">2</span></button></div>`}</div>`:""}`;};
  const hint=()=>{if(h<=N){h++;draw();return true;}if(!ansShown){ansShown=true;draw();return true;}return false;};
  const gr=ok=>{if(graded)return;graded=true;cb.onGrade(ok);draw();};
  b.addEventListener("click",e=>{if(e.target.closest("[data-h]"))hint();if(e.target.closest("[data-a]")){h=N+1;ansShown=true;draw();}const g=e.target.closest("[data-g]");if(g)gr(g.dataset.g==="1");if(e.target.closest("[data-n]"))cb.next();});
  draw();keyHandler=e=>{if(e.key===" "){hint();return true;}if(ansShown&&!graded&&(e.key==="1"||e.key==="2")){gr(e.key==="1");return true;}if(graded&&(e.key==="ArrowRight"||e.key==="Enter")){cb.next();return true;}};}};
function ansHTML(ans){return `<div class="ansgrid">${ans.map(([l,v,u])=>`<div><small>${TX(l)}</small><b>${typeof v==="number"?v:M(v)}</b><i>${esc(u||"")}</i></div>`).join("")}</div>`;}
function solutionFor(o){for(const c of CH){if(!c.lessons)continue;if(o.prob){const p=c.problems.find(x=>x.id===o.prob);if(p)return{title:p.src||("HW "+p.id),steps:p.steps,ans:p.ans&&p.ans.length?p.ans:null};}
  if(o.ex){const l=c.lessons.find(x=>x.id===o.ex);if(l){const ex=(l.example2&&/8-4/.test(o.src))?l.example2:l.example;if(ex&&!o.useMath)return{title:ex.title,steps:ex.steps};
    return{title:"Lesson "+l.id,steps:l.math.map(m=>[m.t,m.tex,m.note||""])};}}}return null;}

/* ---------- VAULT ---------- */
let VQ={q:"",topic:"all"};
VIEWS.vault=v=>{const all=[];CH.forEach(c=>(c.vault||[]).forEach(e=>all.push(Object.assign({ch:c},e))));
  const topics=[...new Set(all.map(e=>e.topic))];const T=Object.assign({},...CH.map(c=>c.topics||{}));
  v.innerHTML=`<h1>Equation Vault</h1><p class="sub">${all.length} equations: meaning, units, validity, and the trigger that tells you to reach for it.</p>
  <label class="search">${ICON.search}<input type="search" placeholder="Search: cutoff, impedance, v_g, PMC…" value="${esc(VQ.q)}" aria-label="Search equations"></label>
  <div class="chips"><button data-t="all" aria-pressed="${VQ.topic==="all"}">All</button>${topics.map(t=>`<button data-t="${t}" aria-pressed="${VQ.topic===t}">${esc(T[t]||t)}</button>`).join("")}</div><div data-list></div>`;
  const list=$("[data-list]",v);
  const draw=()=>{const q=VQ.q.toLowerCase().trim();const hit=all.filter(e=>(VQ.topic==="all"||e.topic===VQ.topic)&&(!q||[e.name,e.eq,e.means,e.when,e.valid,e.tex,e.topic].join(" ").toLowerCase().includes(q.replace(/_/g,""))||[e.name,e.means,e.when,e.tex].join(" ").toLowerCase().replace(/[\\{}_]/g,"").includes(q.replace(/[_ ]/g,""))));
    list.innerHTML=hit.length?hit.map(e=>`<div class="card eq" style="--acc:${e.ch.color}"><div class="row between"><h4>${esc(e.name)}</h4><span class="tag ${e.supp?"supp":"acc"}">${e.supp?"Supplemental":esc(e.eq)}</span></div>${block(e.tex)}
     <dl class="meta"><dt>Means</dt><dd>${TX(e.means)}</dd>${e.units?`<dt>Units</dt><dd class="num">${esc(e.units)}</dd>`:""}<dt>Valid</dt><dd>${TX(e.valid)}</dd><dt>Use when</dt><dd class="when">${TX(e.when)}</dd></dl></div>`).join(""):`<div class="empty">No match. Try "cutoff", "Z_w" or "power".</div>`;};
  $("input",v).addEventListener("input",e=>{VQ.q=e.target.value;draw();});
  $(".chips",v).addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;VQ.topic=b.dataset.t;$$(".chips button",v).forEach(x=>x.setAttribute("aria-pressed",x===b));draw();});draw();};

/* ---------- EXAM ---------- */
let EX_CFG={chs:null,n:12,timed:true};
VIEWS.exam=v=>{if(EXAM&&!EXAM.over)return examRun(v);if(EXAM&&EXAM.over)return examReview(v);
  const lec=CH.filter(c=>c.lessons);if(!EX_CFG.chs)EX_CFG.chs=lec.map(c=>c.id);
  const pool=()=>ORDER.filter(id=>EX_CFG.chs.includes(ITEMS[id].ch)&&ITEMS[id].kind!=="prob");
  const last=S.exams.slice(-5).reverse();
  v.innerHTML=`<h1>Exam mode</h1><p class="sub">Timed and mixed, graded by topic, then a full review. Misses feed your spaced-repetition queue.</p>
  <div class="card"><span class="lab">Scope: what's been lectured</span><div class="chips" style="flex-wrap:wrap">${CH.map(c=>`<button data-c="${c.id}" ${c.lessons?"":"disabled"} aria-pressed="${EX_CFG.chs.includes(c.id)}" style="${c.lessons?"":"opacity:.4"}">${chl(c)} ${esc(c.short)}${c.lessons?"":" · soon"}</button>`).join("")}</div>
   <span class="lab" style="margin-top:14px">Questions</span>${`<span class="seg">${[8,12,20].map(n=>`<button data-n="${n}" aria-pressed="${EX_CFG.n===n}">${n}</button>`).join("")}</span>`}
   <span class="seg" style="margin-left:6px">${[["1","Timed"],["0","Untimed"]].map(([k,l])=>`<button data-tm="${k}" aria-pressed="${String(+EX_CFG.timed)===k}">${l}</button>`).join("")}</span>
   <p class="mut num" style="font-size:14px;margin-top:12px" data-info></p><button class="btn cta block" data-start>Start exam</button></div>
  ${last.length?`<div class="card"><span class="lab">Recent</span><div class="list">${last.map(x=>`<div class="li"><span class="t"><b class="num">${x.score}%</b><small>${new Date(x.at).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · ${x.n} questions · ${x.scope}</small></span></div>`).join("")}</div></div>`:""}`;
  const info=()=>{const n=Math.min(EX_CFG.n,pool().length);$("[data-info]",v).textContent=`${n} questions from ${pool().length} · ${EX_CFG.timed?`${Math.round(n*75/60)} min (75 s each)`:"no clock"}`;};info();
  v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if(d.c){const i=EX_CFG.chs.indexOf(d.c);if(i>=0&&EX_CFG.chs.length>1)EX_CFG.chs.splice(i,1);else if(i<0)EX_CFG.chs.push(d.c);b.setAttribute("aria-pressed",EX_CFG.chs.includes(d.c));info();}
    if(d.n){EX_CFG.n=+d.n;$$("[data-n]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));info();}
    if(d.tm){EX_CFG.timed=d.tm==="1";$$("[data-tm]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));info();}
    if(d.start!=null){const ids=shuffle(pool()).slice(0,EX_CFG.n);EXAM={ids,i:0,ans:{},start:Date.now(),limit:EX_CFG.timed?ids.length*75e3:0,over:false,scope:EX_CFG.chs.map(c=>"Ch. "+chOf(c).num).join(", ")};render();scrollTo(0,0);}});};
let exTimer=null;
function examRun(v){const E=EXAM,id=E.ids[E.i],it=ITEMS[id];setAcc(v,chOf(it.ch));
  v.innerHTML=`<div class="qhead"><span class="tag acc">Q${E.i+1}/${E.ids.length}</span><div class="progress"><i style="width:${100*E.i/E.ids.length}%"></i></div><span class="timer" data-t></span></div>
  ${it.kind==="fm"?`<span class="lab">${esc(it.o.src)}</span><div class="statement card tight" style="margin:0 0 10px">${TX(it.o.prompt)}</div><div class="q" style="font-size:17px">First move?</div>`:`<div class="q">${TX(it.o.q)}</div>`}
  <div data-o></div><div class="reveal-bar" style="justify-content:space-between"><button class="btn sm ghost" data-end>End exam</button><button class="btn cta sm" data-n disabled>${E.i+1<E.ids.length?"Next":"Finish"}<span class="kbd">→</span></button></div>`;
  const opts=it.kind==="fm"?it.o.opts.map(o=>o[0]):it.o.o,correct=it.o.a;const {idx,ans}=order(opts.length,correct);let sel=null;
  $("[data-o]",v).innerHTML=`<div class="opts">${idx.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span class="ot">${TX(opts[oi])}</span></button>`).join("")}</div>`;
  const pick=k=>{sel=k;$$(".opt",v).forEach((b,j)=>{b.style.borderColor=j===k?"var(--cta)":"";b.style.background=j===k?"color-mix(in srgb,var(--cta) 12%,var(--surface-2))":"";});$("[data-n]",v).disabled=false;};
  const nxt=()=>{if(sel==null)return;E.ans[id]={pick:idx[sel],ok:sel===ans};E.i++;if(E.i>=E.ids.length)finishExam();else{render();scrollTo(0,0);}};
  v.addEventListener("click",e=>{const o=e.target.closest(".opt");if(o)pick(+o.dataset.k);if(e.target.closest("[data-n]"))nxt();if(e.target.closest("[data-end]"))finishExam();});
  const tick=()=>{const el=$("[data-t]",v);if(!el){clearInterval(exTimer);return;}if(!E.limit){el.textContent=Math.floor((Date.now()-E.start)/6e4)+" min";return;}const left=E.limit-(Date.now()-E.start);if(left<=0){finishExam();return;}const m=Math.floor(left/6e4),s=Math.floor(left%6e4/1e3);el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<6e4);};
  clearInterval(exTimer);exTimer=setInterval(tick,1000);tick();
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)){pick(+e.key-1);return true;}if(e.key==="ArrowRight"||e.key==="Enter"){nxt();return true;}};}
function finishExam(){clearInterval(exTimer);const E=EXAM;if(E.over)return;E.over=true;E.end=Date.now();
  const answered=E.ids.filter(id=>E.ans[id]);const right=answered.filter(id=>E.ans[id].ok).length;E.score=Math.round(100*right/E.ids.length);
  E.ids.forEach(id=>grade(id,!!(E.ans[id]&&E.ans[id].ok),true));
  const prev=S.exams.filter(x=>x.scope===E.scope);const best=prev.length?Math.max(...prev.map(x=>x.score)):null;E.prevBest=best;
  S.exams.push({at:Date.now(),score:E.score,n:E.ids.length,scope:E.scope});save();
  if(best!=null&&E.score>best)award("pb-"+Date.now(),"New personal best",`${E.score}% on ${E.scope}, up from ${best}%.`);
  render();scrollTo(0,0);}
function examReview(v){const E=EXAM;const T=Object.assign({},...CH.map(c=>c.topics||{}));const by={};E.ids.forEach(id=>{const t=ITEMS[id].topic;(by[t]=by[t]||{r:0,n:0}).n++;if(E.ans[id]&&E.ans[id].ok)by[t].r++;});
  const mins=Math.max(1,Math.round((E.end-E.start)/6e4));
  v.innerHTML=`<div class="card" style="text-align:center;margin-top:16px"><span class="lab">Exam score · ${esc(E.scope)} · ${mins} min</span><div class="scorebig num" style="color:${E.score>=80?"var(--good)":E.score>=60?"var(--warn)":"var(--bad)"}">${E.score}%</div>
   <p class="mut">${E.prevBest==null?"First run on this scope. This is your baseline.":E.score>E.prevBest?`Up from ${E.prevBest}%. That's real progress.`:`Best so far: ${E.prevBest}%. Misses are now in your queue.`}</p></div>
  <div class="card"><span class="lab">By topic</span><div class="bars-h">${Object.entries(by).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([t,x])=>{const p=Math.round(100*x.r/x.n);return `<div class="bh"><span>${esc(T[t]||t)}</span><span class="num mut">${x.r}/${x.n}</span><div class="tr"><i style="width:0;background:${p>=80?"var(--good)":p>=50?"var(--warn)":"var(--bad)"}" data-w="${p}"></i></div></div>`;}).join("")}</div></div>
  <span class="lab" style="margin-top:18px">Review</span>${E.ids.map((id,k)=>{const it=ITEMS[id],a=E.ans[id];const opts=it.kind==="fm"?it.o.opts:it.o.o.map(t=>[t,""]);const ok=a&&a.ok;
   return `<div class="card tight" style="border-color:${ok?"color-mix(in srgb,var(--good) 35%,var(--line))":"color-mix(in srgb,var(--bad) 35%,var(--line))"}"><div class="row" style="align-items:flex-start"><span style="color:${ok?"var(--good)":"var(--bad)"};width:22px;flex:none">${ok?ICON.ok:ICON.no}</span><div style="flex:1;min-width:0"><b>${k+1}. ${TX(it.kind==="fm"?it.o.prompt:it.o.q)}</b>
    ${!ok?`<p style="margin:6px 0 0;color:var(--bad);font-size:14px">You: ${a?TX(opts[a.pick][0]):"no answer"}</p>`:""}<p style="margin:4px 0 0;color:var(--good);font-size:14px">Answer: ${TX(opts[it.o.a][0])}</p><p class="mut" style="font-size:14px;margin:4px 0 0">${TX(it.kind==="fm"?it.o.opts[it.o.a][1]:it.o.why)}</p></div></div></div>`;}).join("")}
  <div class="grid2"><button class="btn" data-again>New exam</button><button class="btn cta" data-home>Done</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$("[data-w]",v).forEach(i=>i.style.width=i.dataset.w+"%")));
  v.addEventListener("click",e=>{if(e.target.closest("[data-again]")){EXAM=null;render();}if(e.target.closest("[data-home]")){EXAM=null;go("today");}});}

/* ---------------- boot ---------------- */
chrome();render();fitObs.observe(document.body,{childList:true,subtree:true});let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{$$(".mathbox[data-fit]").forEach(b=>{delete b.dataset.fit;b.innerHTML=tex(b.dataset.t,true);});fitMath(document);},200);});
if(/^https?:/.test(location.protocol)&&"serviceWorker" in navigator&&window.self===window.top){navigator.serviceWorker.register("sw.js").catch(()=>{});}
setInterval(()=>{if(NAV.tab==="today"&&!NAV.stack.length&&!document.hidden)render();},60000);
window.MAXWELL={state:()=>S,items:ITEMS};
})();
</script>
</body></html>
