  const st=streak();$("#topx").innerHTML=st?`<span class="chip hot"><span class="dot"></span>${st}-day streak</span>`:"";

/* ---------------- toast / confetti / sheet ---------------- */
function toast(icon,title,body){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML=`<span class="medal">${icon}</span><span><b>${esc(title)}</b>${body?`<br><small class="mut">${esc(body)}</small>`:""}</span>`;document.body.appendChild(t);setTimeout(()=>t.remove(),3600);}
function confetti(){if(RM())return;const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;const c=cv.getContext("2d");c.scale(r,r);
  const cols=["#4FC8D8","#C7B6FF","#FF9F5A","#78D58C","#F2BF4C"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6}));let n=0;
  (function f(){c.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.1;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});if(++n<120)requestAnimationFrame(f);else cv.remove();})();}
function sheet(html,bind){const bg=document.createElement("div");bg.className="sheet-bg";const sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.innerHTML=html;document.body.append(bg,sh);
  const close=()=>{bg.remove();sh.remove();};bg.onclick=close;bind&&bind(sh,close);return close;}
function settings(){sheet(`<span class="lab">Backup</span><p class="mut">Progress lives on this device under <span class="num">${KEY}</span>. Export a backup before clearing Safari data or switching phones.</p>
  <div class="grid2"><button class="btn" data-x="exp">Export JSON</button><label class="btn" style="position:relative">Import JSON<input type="file" accept="application/json,.json" style="position:absolute;inset:0;opacity:0"></label></div>
  <hr class="sep"><span class="lab">About</span><p class="mut" style="font-size:14px">MAXWELL · ELEG 648 · Prof. Prather · Balanis AEE 2e. Build ${esc(D.build)}. Content from lecture slides, transcripts and HW sets; anything added is tagged <span class="tag supp">Supplemental</span>. Every numeric answer is checked by hand and in code.</p>
  <button class="btn ghost block" data-x="reset" style="color:var(--bad)">Reset all progress</button>`,(sh,close)=>{
  sh.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(!x)return;
    if(x.dataset.x==="exp"){const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`maxwell-backup-${dkey()}.json`;document.body.appendChild(a);a.click();a.remove();toast("↓","Backup exported");}
    if(x.dataset.x==="reset"){if(x.dataset.sure){S=fresh();save();close();go("play");toast("↺","Progress reset");}else{x.dataset.sure=1;x.textContent="Tap again to erase everything";}}});
  sh.querySelector("input[type=file]").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.v!==1)throw 0;S=Object.assign(fresh(),o);save();close();go("play");toast("↑","Backup restored");}catch(err){toast("!","That file isn't a MAXWELL backup");}});});}

/* ---------------- shared bits ---------------- */
function ringSVG(p,col,size){const r=28,C=2*Math.PI*r;return `<span class="rp"><svg viewBox="0 0 68 68" style="width:${size||68}px;height:${size||68}px"><circle class="trk" cx="34" cy="34" r="${r}"/><circle class="val" cx="34" cy="34" r="${r}" stroke="${col}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-p/100)}"/></svg><b>${p}</b></span>`;}
function animateRings(root){requestAnimationFrame(()=>requestAnimationFrame(()=>$$(".val[data-off]",root).forEach(c=>c.style.strokeDashoffset=c.dataset.off)));}
function nextEvent(){const now=Date.now();return D.events.map(e=>Object.assign({},e,{t:+new Date(e.at)})).filter(e=>e.t>now-30*6e4).sort((a,b)=>a.t-b.t)[0];}
function until(t){const ms=t-Date.now();if(ms<0)return{n:"now",u:""};const h=ms/36e5;if(h<1)return{n:Math.max(1,Math.round(ms/6e4)),u:"min"};if(h<36)return{n:Math.floor(h),u:h<2?"hour":"hours"};const d=Math.ceil((sod(t)-sod())/DAY);return{n:d,u:d===1?"day":"days"};}
function setAcc(v,ch){if(ch)v.style.setProperty("--acc",ch.color);}
const kindLabel={card:"Concept",fm:"First Move",prob:"Practice"};
const itemTitle=id=>{const it=ITEMS[id];if(!it)return id;if(it.kind==="card")return it.o.q;if(it.kind==="fm")return it.o.src+": "+it.o.prompt;return `${it.o.src||("HW "+it.o.id)} · ${it.o.tag}`;};

/* ================================================================ VIEWS */
const VIEWS={};

/* ---------- TODAY ---------- */
VIEWS.today=v=>{const q=queue(),tr=troubleIds(),ev=nextEvent(),st=streak();const day=new Date().toLocaleDateString(undefined,{weekday:"long"});
  const u=ev?until(ev.t):null;const nextLesson=(()=>{for(const c of CH)if(c.lessons)for(const l of c.lessons)if(!S.lessons[c.id+":"+l.id])return{c,l};return null;})();
  const groups={};q.ids.forEach(id=>{const it=ITEMS[id];const k=(S.items[id]&&S.items[id].tr)?"tr":it.kind;(groups[k]=groups[k]||[]).push(id);});
  const gl={tr:["Trouble Spots","var(--bad)"],fm:["First Move drills","var(--acc)"],card:["Concept checks","var(--h)"],prob:["Practice problem","var(--e)"]};
  v.innerHTML=`
  <h1>${q.ids.length?`${q.min||1} minutes to <span class="grad">exam-ready.</span>`:`You're <span class="grad">caught up.</span>`}</h1>
  <p class="sub">${day}${ev?` · ${esc(ev.title)}`:""}</p>
  ${ev?`<div class="card acc row between"><div><span class="lab">Next up</span><b style="font:700 18px var(--fd)">${esc(ev.title)}</b><div class="mut" style="font-size:14px">${esc(ev.scope||"")} · ${new Date(ev.t).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</div></div><div style="text-align:right"><span class="big num">${u.n}</span><div class="mut">${u.u}</div></div></div>`:""}
  <div class="card"><span class="lab">Today's queue · ${q.min} min</span>
   ${q.ids.length?`<div class="list">${Object.entries(groups).map(([k,ids])=>`<div class="li"><span class="dot" style="background:${gl[k][1]}"></span><span class="t"><b>${gl[k][0]}</b><small>${esc(itemTitle(ids[0])).slice(0,80)}${ids.length>1?` + ${ids.length-1} more`:""}</small></span><span class="r">${ids.length}</span></div>`).join("")}</div>
   <button class="btn cta block" id="start" style="margin-top:14px">Start today's ${q.min||""}<span class="kbd">↵</span></button>`:`<p class="mut">Nothing due. Learn a new lesson, or run a timed exam to find weak spots.</p>`}</div>
  ${nextLesson?`<button class="card li" id="cont" style="width:100%;padding:16px 18px;border:1px solid var(--line)"><span class="dot" style="background:${nextLesson.c.color}"></span><span class="t"><small style="margin:0 0 2px">Continue learning · Ch. ${nextLesson.c.num}</small><b>${nextLesson.l.id} ${M(nextLesson.l.title)}</b></span><span class="chev">${ICON.chev}</span></button>`:""}
  <div class="grid2">
   <button class="card li" id="trb" style="width:100%;border:1px solid var(--line);padding:16px 18px"><span class="t"><span class="lab" style="margin:0">Trouble Spots</span><b style="font:800 30px var(--fd);color:${tr.length?"var(--bad)":"var(--good)"}">${tr.length}</b><small>${tr.length?"Missed twice. Three in a row clears one.":"Nothing you've missed twice."}</small></span><span class="chev">${ICON.chev}</span></button>
   <div class="card" style="padding:16px 18px"><span class="lab" style="margin:0">Streak</span><b style="font:800 30px var(--fd);color:var(--acc)">${st}</b><div class="mut" style="font-size:14px">${st?st===1?"Day one. Come back tomorrow to make it two.":"Showing up is the whole trick.":"Any review today starts one."}</div></div></div>
  <div class="card"><span class="lab">Mastery by chapter</span><div class="rings">${CH.map(c=>`<button class="ring ${c.lessons?"":"off"}" data-ch="${c.id}" aria-label="Chapter ${c.num}">${ringSVG(c.lessons?mastery(c.id):0,c.color)}<span class="rl">${c.short}<br><small class="faint">${c.lessons?"":"soon"}</small></span></button>`).join("")}</div></div>
  ${S.badges.length?`<div class="card"><span class="lab">Earned</span><div class="badges">${S.badges.slice(-8).reverse().map(b=>`<span title="${esc(b.body)}">★ ${esc(b.title)}</span>`).join("")}</div></div>`:""}`;
  animateRings(v);
  $("#start",v)?.addEventListener("click",()=>startSession(q.ids,"Today's queue"));
  $("#cont",v)?.addEventListener("click",()=>push({v:"lesson",ch:nextLesson.c.id,id:nextLesson.l.id}));
  $("#trb",v).addEventListener("click",()=>push({v:"trouble"}));
  v.addEventListener("click",e=>{const r=e.target.closest("[data-ch]");if(r){const c=chOf(r.dataset.ch);if(c.lessons){NAV={tab:"learn",stack:[{v:"chapter",ch:c.id}]};render();}else toast("·",`${chl(c)} arrives in the next batch`);}});
  keyHandler=e=>{if(e.key==="Enter"&&q.ids.length){startSession(q.ids,"Today's queue");return true;}};};

/* ---------- LEARN ---------- */
VIEWS.learn=v=>{v.innerHTML=`<h1>Learn</h1><p class="sub">Prather's order: intuition, then the math, then a worked example.</p>
  ${CH.map(c=>`<button class="card li" data-ch="${c.id}" style="width:100%;border:1px solid var(--line);padding:14px 16px;${c.lessons?"":"opacity:.55"}">${ringSVG(c.lessons?mastery(c.id):0,c.color,52)}<span class="t"><small style="margin:0 0 2px">${chl(c)} · ${esc(c.lectures)}</small><b>${esc(c.title)}</b><small>${c.lessons?`${c.lessons.length} lessons · ${ORDER.filter(k=>ITEMS[k].ch===c.id).length} drill items`:esc(c.note||"Coming in the next batch")}</small></span><span class="chev">${ICON.chev}</span></button>`).join("")}`;
  animateRings(v);v.addEventListener("click",e=>{const b=e.target.closest("[data-ch]");if(!b)return;const c=chOf(b.dataset.ch);if(c.lessons)push({v:"chapter",ch:c.id});else toast("·",`${chl(c)} arrives in the next batch`);});};
VIEWS.chapter=(v,p)=>{const c=chOf(p.ch);setAcc(v,c);const done=c.lessons.filter(l=>S.lessons[c.id+":"+l.id]).length;
  v.innerHTML=`<div class="row" style="margin-top:12px">${ringSVG(mastery(c.id),c.color,64)}<div><span class="tag acc">Ch. ${c.num} · ${esc(c.lectures)}</span><h1 style="margin:6px 0 0;font-size:28px">${esc(c.title)}</h1></div></div>
  <div class="grid2" style="margin-top:12px"><button class="btn" data-go="fm">First Move · ${c.fm.length}</button><button class="btn" data-go="prob">Practice · ${c.problems.length}</button></div>
  <div class="card"><span class="lab">Lessons · ${done}/${c.lessons.length}</span><div class="list">${c.lessons.map(l=>{const d=S.lessons[c.id+":"+l.id];return `<button class="li" data-l="${l.id}"><span class="dot" style="background:${d?"var(--good)":"var(--line-2)"}"></span><span class="t"><b>${l.id} ${M(l.title)}</b><small>${MX(l.hook)}${l.tag?` · ${esc(l.tag)}`:""}</small></span><span class="chev">${ICON.chev}</span></button>`;}).join("")}</div></div>`;
  animateRings(v);v.addEventListener("click",e=>{const l=e.target.closest("[data-l]");if(l)push({v:"lesson",ch:c.id,id:l.dataset.l});const g=e.target.closest("[data-go]");if(g)startSession(ORDER.filter(k=>ITEMS[k].ch===c.id&&ITEMS[k].kind===g.dataset.go),g.dataset.go==="fm"?"First Move · Ch. "+c.num:"Practice · Ch. "+c.num);});};

function stepsHTML(steps,shown,numbered){return `<div class="steps">${steps.slice(0,shown).map((s,i)=>`<div class="st"><span class="n">${i+1}</span><div class="mv">${MX(s[0])}</div>${s[1]?block(s[1]):""}${s[2]?`<div class="why">${M(s[2])}</div>`:""}</div>`).join("")}</div>`;}
function exampleBlock(ex,key){return `<div class="card acc" data-ex="${key}"><span class="lab">Worked example</span><b style="font:700 17px var(--fd)">${M(ex.title)}</b><div class="exs"></div>
  <div class="reveal-bar"><button class="btn sm" data-next>Reveal step<span class="kbd">space</span></button><button class="btn sm ghost" data-all>Show all</button><span class="faint num" data-cnt></span></div></div>`;}
function wireExample(root,ex,key){const box=$(`[data-ex="${key}"]`,root);let n=0;const N=ex.steps.length;
  const upd=()=>{$(".exs",box).innerHTML=stepsHTML(ex.steps,n);$("[data-cnt]",box).textContent=`${n}/${N}`;$("[data-next]",box).disabled=n>=N;$("[data-all]",box).style.display=n>=N?"none":"";};
  box.addEventListener("click",e=>{if(e.target.closest("[data-next]")){n=Math.min(N,n+1);upd();}if(e.target.closest("[data-all]")){n=N;upd();}});upd();
  return()=>{if(n<N){n++;upd();return true;}return false;};}
VIEWS.lesson=(v,p)=>{const c=chOf(p.ch);setAcc(v,c);const i=c.lessons.findIndex(l=>l.id===p.id),l=c.lessons[i],nx=c.lessons[i+1];
  const title=l.title;
  v.innerHTML=`<div class="lesson-h" style="margin-top:12px"><span class="tag acc">${l.id} · ${esc(l.lec)}</span>${l.tag?`<span class="tag">${esc(l.tag)}</span>`:""}</div>
  <h1 style="font-size:30px">${M(title)}</h1><div class="hook">${M(l.hook)}</div>
  <div class="card"><span class="lab">Intuition</span><div class="intu"><p>${M(l.intuition)}</p></div>${l.viz?`<div data-viz style="margin-top:12px"></div>`:""}</div>
  <div class="card"><span class="lab">The math</span>${l.math.map(m=>`<div class="mstep"><div class="mt">${MX(m.t)}</div>${block(m.tex)}${m.note?`<div class="note">${M(m.note)}</div>`:""}</div>`).join("")}</div>
  ${l.example?exampleBlock(l.example,"a"):""}${l.example2?exampleBlock(l.example2,"b"):""}
  ${l.aside?`<div class="aside"><span class="lab">${/^Memory hook \(Supplemental\)/.test(l.aside)?"Supplemental":"Prather says"}</span>${M(l.aside.replace(/^Memory hook \(Supplemental\):\s*/,"Memory hook: "))}</div>`:""}
  <div class="grid2" style="margin-top:16px"><button class="btn" data-drill>Drill this chapter</button><button class="btn cta" data-done>${nx?"Done · next lesson":"Done · finish chapter"}<span class="kbd">→</span></button></div>`;
  if(l.viz){const el=$("[data-viz]",v);const vz=typeof l.viz==="string"?{k:l.viz}:l.viz;try{W8[vz.k](el,CTX,vz.init);}catch(err){el.innerHTML=`<p class="faint">diagram failed to load</p>`;console.error(err);}}
  const rev=[];if(l.example)rev.push(wireExample(v,l.example,"a"));if(l.example2)rev.push(wireExample(v,l.example2,"b"));
  const done=()=>{S.lessons[c.id+":"+l.id]=Date.now();markDay();checkMastery();save();if(nx){NAV.stack[NAV.stack.length-1]={v:"lesson",ch:c.id,id:nx.id};render();scrollTo(0,0);}else back();};
  $("[data-done]",v).addEventListener("click",done);$("[data-drill]",v).addEventListener("click",()=>startSession(ORDER.filter(k=>ITEMS[k].ch===c.id&&ITEMS[k].kind!=="prob"),"Ch. "+c.num+" drill"));
  keyHandler=e=>{if(e.key===" "){for(const r of rev)if(r())return true;return true;}if(e.key==="ArrowRight"){done();return true;}};};

/* ---------- DRILL hub ---------- */
VIEWS.drill=v=>{const tr=troubleIds(),lec=CH.filter(c=>c.lessons);
  v.innerHTML=`<h1>Drill</h1><p class="sub">See the problem, name the first move, then execute.</p>
  <button class="card li" data-s="trouble" style="width:100%;border:1px solid ${tr.length?"color-mix(in srgb,var(--bad) 40%,var(--line))":"var(--line)"};padding:16px 18px"><span class="dot" style="background:var(--bad)"></span><span class="t"><b>Trouble Spots</b><small>${tr.length?`${tr.length} item${tr.length>1?"s":""} · each needs 3 correct in a row`:"Empty. Anything you miss twice lands here."}</small></span><span class="r">${tr.length}</span></button>
  ${lec.map(c=>{const n=k=>ORDER.filter(id=>ITEMS[id].ch===c.id&&ITEMS[id].kind===k).length;return `<div class="card" style="--acc:${c.color}"><span class="lab">Ch. ${c.num} · ${esc(c.title)}</span><div class="list">
   <button class="li" data-s="fm" data-c="${c.id}"><span class="dot" style="background:var(--acc)"></span><span class="t"><b>First Move</b><small>Pick the first move from four, then walk the solution</small></span><span class="r">${n("fm")}</span></button>
   <button class="li" data-s="prob" data-c="${c.id}"><span class="dot" style="background:var(--e)"></span><span class="t"><b>Practice (HW)</b><small>Hints unlock one step at a time; boxed answers</small></span><span class="r">${n("prob")}</span></button>

  v.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;const s=b.dataset.s;if(s==="trouble")return push({v:"trouble"});
    const ids=ORDER.filter(id=>ITEMS[id].ch===b.dataset.c&&ITEMS[id].kind===s);startSession(s==="card"?shuffle(ids.slice()):ids,{fm:"First Move",prob:"Practice",card:"Concept checks"}[s]);});};
VIEWS.trouble=v=>{const ids=troubleIds();v.innerHTML=`<h1>Trouble Spots</h1><p class="sub">Anything missed twice. Get it right three times in a row to clear it.</p>
  ${ids.length?`<button class="btn cta block" id="go">Work through ${ids.length}</button><div class="card"><div class="list">${ids.map(id=>`<div class="li"><span class="dot" style="background:${chOf(ITEMS[id].ch).color}"></span><span class="t"><b>${esc(itemTitle(id)).slice(0,90)}</b><small>${kindLabel[ITEMS[id].kind]} · ${S.items[id].run}/3 in a row · missed ${S.items[id].miss}×</small></span></div>`).join("")}</div></div>`
   :`<div class="card empty"><b style="font:700 20px var(--fd);color:var(--good)">All clear.</b><p>${S.trEver?"You've cleared everything you struggled with.":"Nothing here yet. Misses show up after the second one."}</p></div>`}`;
  $("#go",v)?.addEventListener("click",()=>startSession(ids,"Trouble Spots"));};

/* ---------- SESSION (item player) ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startSession(ids,title){if(!ids.length){toast("·","Nothing to drill here yet");return;}SESSION={ids:ids.slice(),i:0,title:typeof title==="string"?title:"",right:0,done:0,perm:{}};push({v:"session"});}
VIEWS.session=v=>{const s=SESSION;if(!s){back();return;}if(s.i>=s.ids.length)return sessionEnd(v);
  const id=s.ids[s.i],it=ITEMS[id],ch=chOf(it.ch);setAcc(v,ch);
  v.innerHTML=`<div class="qhead"><span class="tag acc">${kindLabel[it.kind]}</span><div class="progress"><i style="width:${100*s.i/s.ids.length}%"></i></div><span class="num faint">${s.i+1}/${s.ids.length}</span></div><div data-body></div>`;
  const body=$("[data-body]",v);const next=()=>{s.i++;render();scrollTo(0,0);};
  PLAY[it.kind](body,it,{onGrade:ok=>{s.done++;if(ok)s.right++;grade(id,ok);},next,trouble:!!(S.items[id]&&S.items[id].tr)});};
function sessionEnd(v){const s=SESSION;const pct=s.done?Math.round(100*s.right/s.done):0;markDay();save();
  v.innerHTML=`<div class="card" style="text-align:center;margin-top:24px"><span class="lab">${esc(s.title||"Session")} complete</span><div class="scorebig num" style="color:${pct>=80?"var(--good)":pct>=50?"var(--warn)":"var(--bad)"}">${s.right}/${s.done}</div>
   <p class="mut">${pct>=80?"Strong. The misses are scheduled to come back soon.":"Every miss is now scheduled. It'll come back until it sticks."}</p><button class="btn cta block" id="dn">Done</button></div>`;
  if(pct===100&&s.done>=5)confetti();$("#dn",v).addEventListener("click",()=>go(NAV.tab));keyHandler=e=>{if(e.key==="Enter"||e.key==="ArrowRight"){go(NAV.tab);return true;}};}

/* stable shuffled option order per item view */
function order(n,correct){const idx=shuffle([...Array(n).keys()]);return{idx,ans:idx.indexOf(correct)};}
function verdict(ok){return `<div class="verdict ${ok?"ok":"no"}"><span class="pop">${ok?ICON.ok:ICON.no}</span>${ok?["Exactly.","That's it.","Right move.","Clean."][Math.random()*4|0]:"Not quite. Here's why."}</div>`;}
function mcq(root,opts,correct,onPick){const {idx,ans}=order(opts.length,correct);
  root.innerHTML=`<div class="opts" role="list">${idx.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span class="ot">${opts[oi][0]}${opts[oi][1]?`<div class="ow">${opts[oi][1]}</div>`:""}</span></button>`).join("")}</div>`;
  let picked=null;const pick=k=>{if(picked!=null)return;picked=k;const box=$(".opts",root);box.classList.add("done");$$(".opt",box).forEach((b,j)=>{if(j===ans)b.classList.add("right");else if(j===k)b.classList.add("wrong");});if(k!==ans)$$(".opt",box)[k].classList.add("shake");onPick(k===ans);};
  root.addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.k);});
  return k=>{if(k<idx.length){pick(k);return true;}return false;};}
const PLAY={
 card(b,it,cb){const o=it.o;b.innerHTML=`<div class="q">${TX(o.q)}</div><div data-o></div><div data-v></div>`;let done=false;
  const nextBtn=()=>`<button class="btn cta block" data-n style="margin-top:12px">Next<span class="kbd">→</span></button>`;
  const pk=mcq($("[data-o]",b),o.o.map(t=>[TX(t),""]),o.a,ok=>{done=true;cb.onGrade(ok);$("[data-v]",b).innerHTML=verdict(ok)+`<p>${TX(o.why)}</p>`+nextBtn();$("[data-n]",b).addEventListener("click",cb.next);});
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!done)return pk(+e.key-1);if((e.key==="ArrowRight"||e.key==="Enter")&&done){cb.next();return true;}};},
 fm(b,it,cb){const o=it.o;const sol=solutionFor(o);let done=false,shown=0,rev=null;
  b.innerHTML=`<span class="lab">${esc(o.src)}${o.src.includes("lecture")?"":""}</span><div class="statement card tight" style="margin:0 0 12px">${TX(o.prompt)}</div><div class="q" style="font-size:17px">What's your first move?</div><div data-o></div><div data-v></div><div data-sol></div>`;
  const pk=mcq($("[data-o]",b),o.opts.map(([t,w])=>[TX(t),TX(w)]),o.a,ok=>{done=true;cb.onGrade(ok);
   $("[data-v]",b).innerHTML=verdict(ok)+(sol?`<div class="reveal-bar"><button class="btn sm" data-rs>Walk the solution<span class="kbd">space</span></button><button class="btn cta sm" data-n style="flex:1">Next<span class="kbd">→</span></button></div>`:`<button class="btn cta block" data-n>Next</button>`);
   $("[data-n]",b).addEventListener("click",cb.next);const rs=$("[data-rs]",b);
   if(rs){const upd=()=>{$("[data-sol]",b).innerHTML=`<div class="card acc"><span class="lab">Worked solution · ${shown}/${sol.steps.length}</span><b>${M(sol.title)}</b>${stepsHTML(sol.steps,shown)}${shown>=sol.steps.length&&sol.ans?ansHTML(sol.ans):""}</div>`;rs.textContent=shown>=sol.steps.length?"Solution complete":"Next step";rs.disabled=shown>=sol.steps.length;};
     rev=()=>{if(shown<sol.steps.length){shown++;upd();return true;}return false;};rs.addEventListener("click",rev);}});
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!done)return pk(+e.key-1);if(e.key===" "&&done&&rev){rev();return true;}if((e.key==="ArrowRight"||e.key==="Enter")&&done){cb.next();return true;}};},
 prob(b,it,cb){const o=it.o;let h=0;const N=o.steps.length;let ansShown=false,graded=false;
  const draw=()=>{b.innerHTML=`<span class="lab">${esc(o.src||("HW "+o.id))} · ${esc(o.tag)}</span><div class="statement">${M(o.st)}</div>
   <div class="card tight" style="margin-top:12px"><span class="lab">Hints · ${Math.min(h,N+1)}/${N+1}</span>
    ${h>=1?`<div class="aside" style="margin:0 0 6px"><span class="lab">First move</span>${M(o.first)}</div>`:`<p class="mut" style="margin:0">Try it on paper first. Each hint unlocks one step.</p>`}
    ${h>=2?stepsHTML(o.steps,h-1):""}
    <div class="reveal-bar">${h<=N?`<button class="btn sm" data-h>${h===0?"First move":"Next step"}<span class="kbd">space</span></button>`:""}${!ansShown?`<button class="btn sm ghost" data-a>Show answer</button>`:""}</div></div>
   ${ansShown?`<div class="card acc"><span class="lab">Answer</span>${o.ans&&o.ans.length?ansHTML(o.ans):`<p>Derivation problem. The full worked path is in the steps above.</p>`}${o.trap?`<div class="flag"><b>Trap:</b> ${M(o.trap)}</div>`:""}${o.pic?`<p class="mut"><b>Picture:</b> ${M(o.pic)}</p>`:""}
    ${graded?`<button class="btn cta block" data-n>Next<span class="kbd">→</span></button>`:`<span class="lab" style="margin-top:12px">How did it go?</span><div class="selfgrade"><button class="btn" data-g="1" style="border-color:var(--good)">Got it<span class="kbd">1</span></button><button class="btn" data-g="0" style="border-color:var(--bad)">Missed it<span class="kbd">2</span></button></div>`}</div>`:""}`;};
  const hint=()=>{if(h<=N){h++;draw();return true;}if(!ansShown){ansShown=true;draw();return true;}return false;};
  const gr=ok=>{if(graded)return;graded=true;cb.onGrade(ok);draw();};
  b.addEventListener("click",e=>{if(e.target.closest("[data-h]"))hint();if(e.target.closest("[data-a]")){h=N+1;ansShown=true;draw();}const g=e.target.closest("[data-g]");if(g)gr(g.dataset.g==="1");if(e.target.closest("[data-n]"))cb.next();});
  draw();keyHandler=e=>{if(e.key===" "){hint();return true;}if(ansShown&&!graded&&(e.key==="1"||e.key==="2")){gr(e.key==="1");return true;}if(graded&&(e.key==="ArrowRight"||e.key==="Enter")){cb.next();return true;}};}};
function ansHTML(ans){return `<div class="ansgrid">${ans.map(([l,v,u])=>`<div><small>${TX(l)}</small><b>${typeof v==="number"?v:M(v)}</b><i>${esc(u||"")}</i></div>`).join("")}</div>`;}
function solutionFor(o){for(const c of CH){if(!c.lessons)continue;if(o.prob){const p=c.problems.find(x=>x.id===o.prob);if(p)return{title:p.src||("HW "+p.id),steps:p.steps,ans:p.ans&&p.ans.length?p.ans:null};}
  if(o.ex){const l=c.lessons.find(x=>x.id===o.ex);if(l){const ex=(l.example2&&/8-4/.test(o.src))?l.example2:l.example;if(ex&&!o.useMath)return{title:ex.title,steps:ex.steps};
    return{title:"Lesson "+l.id,steps:l.math.map(m=>[m.t,m.tex,m.note||""])};}}}return null;}

/* ---------- VAULT ---------- */
let VQ={q:"",topic:"all"};
VIEWS.vault=v=>{const all=[];CH.forEach(c=>(c.vault||[]).forEach(e=>all.push(Object.assign({ch:c},e))));
  const topics=[...new Set(all.map(e=>e.topic))];const T=Object.assign({},...CH.map(c=>c.topics||{}));
  v.innerHTML=`<h1>Equation Vault</h1><p class="sub">${all.length} equations: meaning, units, validity, and the trigger that tells you to reach for it.</p>
  <label class="search">${ICON.search}<input type="search" placeholder="Search: cutoff, impedance, v_g, PMC…" value="${esc(VQ.q)}" aria-label="Search equations"></label>
  <div class="chips"><button data-t="all" aria-pressed="${VQ.topic==="all"}">All</button>${topics.map(t=>`<button data-t="${t}" aria-pressed="${VQ.topic===t}">${esc(T[t]||t)}</button>`).join("")}</div><div data-list></div>`;
  const list=$("[data-list]",v);
  const draw=()=>{const q=VQ.q.toLowerCase().trim();const hit=all.filter(e=>(VQ.topic==="all"||e.topic===VQ.topic)&&(!q||[e.name,e.eq,e.means,e.when,e.valid,e.tex,e.topic].join(" ").toLowerCase().includes(q.replace(/_/g,""))||[e.name,e.means,e.when,e.tex].join(" ").toLowerCase().replace(/[\\{}_]/g,"").includes(q.replace(/[_ ]/g,""))));
    list.innerHTML=hit.length?hit.map(e=>`<div class="card eq" style="--acc:${e.ch.color}"><div class="row between"><h4>${esc(e.name)}</h4><span class="tag ${e.supp?"supp":"acc"}">${e.supp?"Supplemental":esc(e.eq)}</span></div>${block(e.tex)}
     <dl class="meta"><dt>Means</dt><dd>${TX(e.means)}</dd>${e.units?`<dt>Units</dt><dd class="num">${esc(e.units)}</dd>`:""}<dt>Valid</dt><dd>${TX(e.valid)}</dd><dt>Use when</dt><dd class="when">${TX(e.when)}</dd></dl></div>`).join(""):`<div class="empty">No match. Try "cutoff", "Z_w" or "power".</div>`;};
  $("input",v).addEventListener("input",e=>{VQ.q=e.target.value;draw();});
  $(".chips",v).addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;VQ.topic=b.dataset.t;$$(".chips button",v).forEach(x=>x.setAttribute("aria-pressed",x===b));draw();});draw();};

/* ---------- EXAM ---------- */
let EX_CFG={chs:null,n:12,timed:true};
VIEWS.exam=v=>{if(EXAM&&!EXAM.over)return examRun(v);if(EXAM&&EXAM.over)return examReview(v);
  const lec=CH.filter(c=>c.lessons);if(!EX_CFG.chs)EX_CFG.chs=lec.map(c=>c.id);
  const pool=()=>ORDER.filter(id=>EX_CFG.chs.includes(ITEMS[id].ch)&&ITEMS[id].kind!=="prob");
  const last=S.exams.slice(-5).reverse();
  v.innerHTML=`<h1>Exam mode</h1><p class="sub">Timed and mixed, graded by topic, then a full review. Misses feed your spaced-repetition queue.</p>
  <div class="card"><span class="lab">Scope: what's been lectured</span><div class="chips" style="flex-wrap:wrap">${CH.map(c=>`<button data-c="${c.id}" ${c.lessons?"":"disabled"} aria-pressed="${EX_CFG.chs.includes(c.id)}" style="${c.lessons?"":"opacity:.4"}">${chl(c)} ${esc(c.short)}${c.lessons?"":" · soon"}</button>`).join("")}</div>
   <span class="lab" style="margin-top:14px">Questions</span>${`<span class="seg">${[8,12,20].map(n=>`<button data-n="${n}" aria-pressed="${EX_CFG.n===n}">${n}</button>`).join("")}</span>`}
   <span class="seg" style="margin-left:6px">${[["1","Timed"],["0","Untimed"]].map(([k,l])=>`<button data-tm="${k}" aria-pressed="${String(+EX_CFG.timed)===k}">${l}</button>`).join("")}</span>
   <p class="mut num" style="font-size:14px;margin-top:12px" data-info></p><button class="btn cta block" data-start>Start exam</button></div>
  ${last.length?`<div class="card"><span class="lab">Recent</span><div class="list">${last.map(x=>`<div class="li"><span class="t"><b class="num">${x.score}%</b><small>${new Date(x.at).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · ${x.n} questions · ${x.scope}</small></span></div>`).join("")}</div></div>`:""}`;
  const info=()=>{const n=Math.min(EX_CFG.n,pool().length);$("[data-info]",v).textContent=`${n} questions from ${pool().length} · ${EX_CFG.timed?`${Math.round(n*75/60)} min (75 s each)`:"no clock"}`;};info();
  v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if(d.c){const i=EX_CFG.chs.indexOf(d.c);if(i>=0&&EX_CFG.chs.length>1)EX_CFG.chs.splice(i,1);else if(i<0)EX_CFG.chs.push(d.c);b.setAttribute("aria-pressed",EX_CFG.chs.includes(d.c));info();}
    if(d.n){EX_CFG.n=+d.n;$$("[data-n]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));info();}
    if(d.tm){EX_CFG.timed=d.tm==="1";$$("[data-tm]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));info();}
    if(d.start!=null){const ids=shuffle(pool()).slice(0,EX_CFG.n);EXAM={ids,i:0,ans:{},start:Date.now(),limit:EX_CFG.timed?ids.length*75e3:0,over:false,scope:EX_CFG.chs.map(c=>"Ch. "+chOf(c).num).join(", ")};render();scrollTo(0,0);}});};
let exTimer=null;
function examRun(v){const E=EXAM,id=E.ids[E.i],it=ITEMS[id];setAcc(v,chOf(it.ch));
  v.innerHTML=`<div class="qhead"><span class="tag acc">Q${E.i+1}/${E.ids.length}</span><div class="progress"><i style="width:${100*E.i/E.ids.length}%"></i></div><span class="timer" data-t></span></div>
  ${it.kind==="fm"?`<span class="lab">${esc(it.o.src)}</span><div class="statement card tight" style="margin:0 0 10px">${TX(it.o.prompt)}</div><div class="q" style="font-size:17px">First move?</div>`:`<div class="q">${TX(it.o.q)}</div>`}
  <div data-o></div><div class="reveal-bar" style="justify-content:space-between"><button class="btn sm ghost" data-end>End exam</button><button class="btn cta sm" data-n disabled>${E.i+1<E.ids.length?"Next":"Finish"}<span class="kbd">→</span></button></div>`;
  const opts=it.kind==="fm"?it.o.opts.map(o=>o[0]):it.o.o,correct=it.o.a;const {idx,ans}=order(opts.length,correct);let sel=null;
  $("[data-o]",v).innerHTML=`<div class="opts">${idx.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span class="ot">${TX(opts[oi])}</span></button>`).join("")}</div>`;
  const pick=k=>{sel=k;$$(".opt",v).forEach((b,j)=>{b.style.borderColor=j===k?"var(--cta)":"";b.style.background=j===k?"color-mix(in srgb,var(--cta) 12%,var(--surface-2))":"";});$("[data-n]",v).disabled=false;};
  const nxt=()=>{if(sel==null)return;E.ans[id]={pick:idx[sel],ok:sel===ans};E.i++;if(E.i>=E.ids.length)finishExam();else{render();scrollTo(0,0);}};
  v.addEventListener("click",e=>{const o=e.target.closest(".opt");if(o)pick(+o.dataset.k);if(e.target.closest("[data-n]"))nxt();if(e.target.closest("[data-end]"))finishExam();});
  const tick=()=>{const el=$("[data-t]",v);if(!el){clearInterval(exTimer);return;}if(!E.limit){el.textContent=Math.floor((Date.now()-E.start)/6e4)+" min";return;}const left=E.limit-(Date.now()-E.start);if(left<=0){finishExam();return;}const m=Math.floor(left/6e4),s=Math.floor(left%6e4/1e3);el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<6e4);};
  clearInterval(exTimer);exTimer=setInterval(tick,1000);tick();
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)){pick(+e.key-1);return true;}if(e.key==="ArrowRight"||e.key==="Enter"){nxt();return true;}};}
function finishExam(){clearInterval(exTimer);const E=EXAM;if(E.over)return;E.over=true;E.end=Date.now();
  const answered=E.ids.filter(id=>E.ans[id]);const right=answered.filter(id=>E.ans[id].ok).length;E.score=Math.round(100*right/E.ids.length);
  E.ids.forEach(id=>grade(id,!!(E.ans[id]&&E.ans[id].ok),true));
  const prev=S.exams.filter(x=>x.scope===E.scope);const best=prev.length?Math.max(...prev.map(x=>x.score)):null;E.prevBest=best;
  S.exams.push({at:Date.now(),score:E.score,n:E.ids.length,scope:E.scope});save();
  if(best!=null&&E.score>best)award("pb-"+Date.now(),"New personal best",`${E.score}% on ${E.scope}, up from ${best}%.`);
  render();scrollTo(0,0);}
function examReview(v){const E=EXAM;const T=Object.assign({},...CH.map(c=>c.topics||{}));const by={};E.ids.forEach(id=>{const t=ITEMS[id].topic;(by[t]=by[t]||{r:0,n:0}).n++;if(E.ans[id]&&E.ans[id].ok)by[t].r++;});
  const mins=Math.max(1,Math.round((E.end-E.start)/6e4));
  v.innerHTML=`<div class="card" style="text-align:center;margin-top:16px"><span class="lab">Exam score · ${esc(E.scope)} · ${mins} min</span><div class="scorebig num" style="color:${E.score>=80?"var(--good)":E.score>=60?"var(--warn)":"var(--bad)"}">${E.score}%</div>
   <p class="mut">${E.prevBest==null?"First run on this scope. This is your baseline.":E.score>E.prevBest?`Up from ${E.prevBest}%. That's real progress.`:`Best so far: ${E.prevBest}%. Misses are now in your queue.`}</p></div>
  <div class="card"><span class="lab">By topic</span><div class="bars-h">${Object.entries(by).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([t,x])=>{const p=Math.round(100*x.r/x.n);return `<div class="bh"><span>${esc(T[t]||t)}</span><span class="num mut">${x.r}/${x.n}</span><div class="tr"><i style="width:0;background:${p>=80?"var(--good)":p>=50?"var(--warn)":"var(--bad)"}" data-w="${p}"></i></div></div>`;}).join("")}</div></div>
  <span class="lab" style="margin-top:18px">Review</span>${E.ids.map((id,k)=>{const it=ITEMS[id],a=E.ans[id];const opts=it.kind==="fm"?it.o.opts:it.o.o.map(t=>[t,""]);const ok=a&&a.ok;
   return `<div class="card tight" style="border-color:${ok?"color-mix(in srgb,var(--good) 35%,var(--line))":"color-mix(in srgb,var(--bad) 35%,var(--line))"}"><div class="row" style="align-items:flex-start"><span style="color:${ok?"var(--good)":"var(--bad)"};width:22px;flex:none">${ok?ICON.ok:ICON.no}</span><div style="flex:1;min-width:0"><b>${k+1}. ${TX(it.kind==="fm"?it.o.prompt:it.o.q)}</b>
    ${!ok?`<p style="margin:6px 0 0;color:var(--bad);font-size:14px">You: ${a?TX(opts[a.pick][0]):"no answer"}</p>`:""}<p style="margin:4px 0 0;color:var(--good);font-size:14px">Answer: ${TX(opts[it.o.a][0])}</p><p class="mut" style="font-size:14px;margin:4px 0 0">${TX(it.kind==="fm"?it.o.opts[it.o.a][1]:it.o.why)}</p></div></div></div>`;}).join("")}
  <div class="grid2"><button class="btn" data-again>New exam</button><button class="btn cta" data-home>Done</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$("[data-w]",v).forEach(i=>i.style.width=i.dataset.w+"%")));
  v.addEventListener("click",e=>{if(e.target.closest("[data-again]")){EXAM=null;render();}if(e.target.closest("[data-home]")){EXAM=null;go("play");}});}

/* ---------------- boot ---------------- */
if(window.__MXGAME)window.__MXGAME({get S(){return S;},save,ITEMS,ORDER,CH,grade,M,TX,tex,block,stepsHTML,esc,$,$$,push,go,back,render,VIEWS,toast,confetti,award,ringSVG,animateRings,setAcc,chOf,mastery,shuffle,markDay,order,ICON,get NAV(){return NAV;},setKey:f=>{keyHandler=f;},queue,troubleIds,streak,nextEvent,until,itemTitle,RM});
chrome();render();fitObs.observe(document.body,{childList:true,subtree:true});let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{$$(".mathbox[data-fit]").forEach(b=>{delete b.dataset.fit;b.innerHTML=tex(b.dataset.t,true);});fitMath(document);},200);});
if(/^https?:/.test(location.protocol)&&"serviceWorker" in navigator&&window.self===window.top){navigator.serviceWorker.register("sw.js").catch(()=>{});}
setInterval(()=>{if(NAV.tab==="play"&&!NAV.stack.length&&!document.hidden&&!document.querySelector(".battle"))render();},60000);
window.MAXWELL={state:()=>S,items:ITEMS};
})();
</script>
