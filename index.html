/* ---------------- math: KaTeX → native MathML ---------------- */
const MC=new Map();
function stripBoxed(t){let out="",i=0,box=false;while(i<t.length){const j=t.indexOf("\\boxed{",i);if(j<0){out+=t.slice(i);break;}out+=t.slice(i,j);box=true;let k=j+7,d=1;while(k<t.length&&d){if(t[k]==="{")d++;else if(t[k]==="}")d--;k++;}out+=t.slice(j+7,k-1);i=k;}return{t:out,box};}
function tex(t,disp){const key=(disp?"D":"I")+t;if(MC.has(key))return MC.get(key);let h;
  try{h=katex.renderToString(t,{displayMode:!!disp,output:"mathml",throwOnError:false,strict:false});}catch(e){h=`<code>${esc(t)}</code>`;}MC.set(key,h);return h;}
function M(s){if(s==null)return"";return String(s).replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>tex(stripBoxed(t).t,true)).replace(/\$([^$]+?)\$/g,(m,t)=>tex(t,false)).replace(/¶/g,"</p><p>");}
function block(t){const s=stripBoxed(t);return `<div class="mathbox${s.box?" ans":""}" data-t="${esc(s.t)}">${tex(s.t,true)}</div>`;}
/* top-level split points (outside braces, \left..\right and environments) */
function topSplit(t,re){const out=[];let d=0,start=0,i=0;while(i<t.length){const ch=t[i];
  if(ch==="\\"){const m=/^\\(left|right|begin|end)\b/.exec(t.slice(i));if(m){d+=(m[1]==="left"||m[1]==="begin")?1:-1;i+=m[0].length;continue;}
    if(d===0){const r=re.exec(t.slice(i));if(r&&r.index===0){out.push(t.slice(start,i));out.push(r[0]);i+=r[0].length;start=i;continue;}}i+=2;continue;}
  if(ch==="{")d++;else if(ch==="}")d--;else if(d===0){const r=re.exec(t.slice(i));if(r&&r.index===0){out.push(t.slice(start,i));out.push(r[0]);i+=r[0].length;start=i;continue;}}i++;}
  out.push(t.slice(start));return out;}
function splitTex(t,level){const sep=/^(\\qquad|,\s*\\quad|;\s*\\quad|\\quad|,\\ \\ )/;const segs=topSplit(t,sep).filter((x,k)=>k%2===0).map(x=>x.trim()).filter(Boolean);
  const eqs=s=>{const p=topSplit(s,/^(=|\\Rightarrow|\\approx|\\simeq|\\le|\\ge)(?![a-zA-Z])/);if(p.length<5)return s;let o=p[0]+"&"+p[1]+p[2];for(let k=3;k<p.length;k+=2)o+="\\\\&"+p[k]+p[k+1];return "\\begin{aligned}"+o+"\\end{aligned}";};
  const lines=level>1?segs.map(eqs):segs;return lines.length>1?"\\begin{gathered}"+lines.join("\\\\")+"\\end{gathered}":lines[0];}
function fitMath(root){$$(".mathbox[data-t]",root).forEach(b=>{if(b.dataset.fit)return;const w=b.clientWidth;if(!w)return;let t=b.dataset.t;
  for(const lv of [1,2]){if(b.scrollWidth<=w+2)break;const nt=splitTex(t,lv);if(nt!==t){b.innerHTML=tex(nt,true);}}
  b.dataset.fit=1;b.classList.toggle("scrolls",b.scrollWidth>w+2);});}
const fitObs=new MutationObserver(()=>requestAnimationFrame(()=>fitMath(document)));
/* plain-text subscripts for option labels like "v_g", "TE₁₀" */

/* ---------------- dates ---------------- */
const DAY=864e5;
const dkey=d=>{d=d?new Date(d):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const sod=d=>{const x=d?new Date(d):new Date();x.setHours(0,0,0,0);return+x;};
function streak(){const set=new Set(S.days);let n=0,d=sod();if(!set.has(dkey(d)))d-=DAY;while(set.has(dkey(d))){n++;d-=DAY;}return n;}
function markDay(){const k=dkey();if(!S.days.includes(k)){S.days.push(k);if(S.days.length>400)S.days=S.days.slice(-400);}}

/* ---------------- item registry ---------------- */
const ITEMS={},ORDER=[];
CH.forEach(ch=>{if(!ch.lessons)return;
  const add=(kind,o,id)=>{const it={kind,ch:ch.id,id,o,topic:o.topic||"general"};ITEMS[id]=it;ORDER.push(id);};
  ch.cards.forEach(o=>add("card",o,o.id));ch.fm.forEach(o=>add("fm",o,o.id));ch.problems.forEach(o=>add("prob",o,"p"+o.id));});
const COST={card:.5,fm:1.5,prob:5};
const chOf=id=>CH.find(c=>c.id===id);
const chl=c=>c.id==="ant"?"ANT":"Ch. "+c.num;

/* ---------------- spaced repetition (Leitner) ---------------- */
const IV=[0,1,2,4,8,16,32];
const rec=id=>S.items[id]||(S.items[id]={b:0,due:0,miss:0,run:0,n:0,tr:false});
function grade(id,ok,quiet){const r=rec(id);const wasTr=troubleIds().length;r.n++;r.last=Date.now();
  if(ok){r.b=Math.min(r.b+1,IV.length-1);r.run++;r.due=sod()+IV[r.b]*DAY;if(r.tr&&r.run>=3){r.tr=false;if(!quiet)toast("✓","Cleared from Trouble Spots: 3 in a row");}}
  else{r.b=0;r.run=0;r.miss++;r.due=Date.now()+10*6e4;if(r.miss>=2&&!r.tr){r.tr=true;S.trEver=(S.trEver||0)+1;}}
  markDay();const nowTr=troubleIds().length;if(wasTr>0&&nowTr===0)award("clear-"+dkey(),"Trouble Spots cleared","Every missed item is back on solid ground.");
  checkMastery();save();}
const troubleIds=()=>Object.keys(S.items).filter(k=>S.items[k].tr&&ITEMS[k]);
function dueIds(){const end=sod()+DAY;return Object.keys(S.items).filter(k=>ITEMS[k]&&S.items[k].due<end).sort((a,b)=>(S.items[b].tr-S.items[a].tr)||(S.items[a].due-S.items[b].due));}
function mastery(chId){const ids=ORDER.filter(k=>ITEMS[k].ch===chId);if(!ids.length)return 0;const ch=chOf(chId);
  const it=ids.reduce((s,k)=>s+Math.min(4,(S.items[k]||{b:0}).b)/4,0)/ids.length;const ls=ch.lessons.filter(l=>S.lessons[ch.id+":"+l.id]).length/ch.lessons.length;return Math.round(100*(.8*it+.2*ls));}
function checkMastery(){CH.forEach(c=>{if(c.lessons&&mastery(c.id)>=90)award("master-"+c.id,`Chapter ${c.num} mastered`,`${c.title}: 90% mastery.`);});}
function award(id,title,body){if(S.badges.find(b=>b.id===id))return;S.badges.push({id,title,body,at:Date.now()});save();toast("★",title,body);confetti();}

/* today's 15 minutes: due/trouble first, then new items in course order */
function queue(){const q=[],used=new Set();let t=0;const cap=15;
  for(const id of dueIds()){if(t+COST[ITEMS[id].kind]>cap+1)continue;q.push(id);used.add(id);t+=COST[ITEMS[id].kind];}
  const lect=new Set(CH.filter(c=>c.status==="lectured").map(c=>c.id));
  const ev=nextEvent(),focus=new Set((ev&&ev.chs)||[]);const fresh=ORDER.filter(id=>!S.items[id]&&lect.has(ITEMS[id].ch)).sort((x,y)=>(focus.has(ITEMS[y].ch)?1:0)-(focus.has(ITEMS[x].ch)?1:0));
  // interleave: 1 first-move, 2 cards, then a problem when time allows
  const by=k=>fresh.filter(id=>ITEMS[id].kind===k);const F=by("fm"),Cd=by("card"),P=by("prob");
  while(t<cap&&(F.length||Cd.length||P.length)){
    for(const [arr,n] of [[F,1],[Cd,2],[P,1]])for(let i=0;i<n&&arr.length;i++){const id=arr.shift();const c=COST[ITEMS[id].kind];if(t+c>cap+.5)continue;q.push(id);t+=c;}
    if(t>=cap-.4)break;if(!F.length&&!Cd.length)break;}
  return{ids:q,min:Math.round(t)};}

function toast(icon,title,body){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML=`<span class="medal">${icon}</span><span><b>${esc(title)}</b>${body?`<br><small class="mut">${esc(body)}</small>`:""}</span>`;document.body.appendChild(t);setTimeout(()=>t.remove(),3600);}
function confetti(){if(RM())return;const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;const c=cv.getContext("2d");c.scale(r,r);
  const cols=["#4FC8D8","#C7B6FF","#FF9F5A","#78D58C","#F2BF4C"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6}));let n=0;
  (function f(){c.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.1;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});if(++n<120)requestAnimationFrame(f);else cv.remove();})();}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startSession(ids,title){if(!ids.length){toast("·","Nothing to drill here yet");return;}SESSION={ids:ids.slice(),i:0,title:typeof title==="string"?title:"",right:0,done:0,perm:{}};push({v:"session"});}
VIEWS.session=v=>{const s=SESSION;if(!s){back();return;}if(s.i>=s.ids.length)return sessionEnd(v);
  const id=s.ids[s.i],it=ITEMS[id],ch=chOf(it.ch);setAcc(v,ch);
  v.innerHTML=`<div class="qhead"><span class="tag acc">${kindLabel[it.kind]}</span><div class="progress"><i style="width:${100*s.i/s.ids.length}%"></i></div><span class="num faint">${s.i+1}/${s.ids.length}</span></div><div data-body></div>`;
  const body=$("[data-body]",v);const next=()=>{s.i++;render();scrollTo(0,0);};
  PLAY[it.kind](body,it,{onGrade:ok=>{s.done++;if(ok)s.right++;grade(id,ok);},next,trouble:!!(S.items[id]&&S.items[id].tr)});};
function sessionEnd(v){const s=SESSION;const pct=s.done?Math.round(100*s.right/s.done):0;markDay();save();

   <p class="mut">${pct>=80?"Strong. The misses are scheduled to come back soon.":"Every miss is now scheduled. It'll come back until it sticks."}</p><button class="btn cta block" id="dn">Done</button></div>`;

/* stable shuffled option order per item view */
function order(n,correct){const idx=shuffle([...Array(n).keys()]);return{idx,ans:idx.indexOf(correct)};}
function verdict(ok){return `<div class="verdict ${ok?"ok":"no"}"><span class="pop">${ok?ICON.ok:ICON.no}</span>${ok?["Exactly.","That's it.","Right move.","Clean."][Math.random()*4|0]:"Not quite. Here's why."}</div>`;}
function mcq(root,opts,correct,onPick){const {idx,ans}=order(opts.length,correct);
  root.innerHTML=`<div class="opts" role="list">${idx.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span class="ot">${opts[oi][0]}${opts[oi][1]?`<div class="ow">${opts[oi][1]}</div>`:""}</span></button>`).join("")}</div>`;
  let picked=null;const pick=k=>{if(picked!=null)return;picked=k;const box=$(".opts",root);box.classList.add("done");$$(".opt",box).forEach((b,j)=>{if(j===ans)b.classList.add("right");else if(j===k)b.classList.add("wrong");});if(k!==ans)$$(".opt",box)[k].classList.add("shake");onPick(k===ans);};
  root.addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.k);});
  return k=>{if(k<idx.length){pick(k);return true;}return false;};}
const PLAY={
 card(b,it,cb){const o=it.o;b.innerHTML=`<div class="q">${TX(o.q)}</div><div data-o></div><div data-v></div>`;let done=false;
  const nextBtn=()=>`<button class="btn cta block" data-n style="margin-top:12px">Next<span class="kbd">→</span></button>`;
  const pk=mcq($("[data-o]",b),o.o.map(t=>[TX(t),""]),o.a,ok=>{done=true;cb.onGrade(ok);$("[data-v]",b).innerHTML=verdict(ok)+`<p>${TX(o.why)}</p>`+nextBtn();$("[data-n]",b).addEventListener("click",cb.next);});
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!done)return pk(+e.key-1);if((e.key==="ArrowRight"||e.key==="Enter")&&done){cb.next();return true;}};},
 fm(b,it,cb){const o=it.o;const sol=solutionFor(o);let done=false,shown=0,rev=null;
  b.innerHTML=`<span class="lab">${esc(o.src)}${o.src.includes("lecture")?"":""}</span><div class="statement card tight" style="margin:0 0 12px">${TX(o.prompt)}</div><div class="q" style="font-size:17px">What's your first move?</div><div data-o></div><div data-v></div><div data-sol></div>`;
  const pk=mcq($("[data-o]",b),o.opts.map(([t,w])=>[TX(t),TX(w)]),o.a,ok=>{done=true;cb.onGrade(ok);
   $("[data-v]",b).innerHTML=verdict(ok)+(sol?`<div class="reveal-bar"><button class="btn sm" data-rs>Walk the solution<span class="kbd">space</span></button><button class="btn cta sm" data-n style="flex:1">Next<span class="kbd">→</span></button></div>`:`<button class="btn cta block" data-n>Next</button>`);
   $("[data-n]",b).addEventListener("click",cb.next);const rs=$("[data-rs]",b);
   if(rs){const upd=()=>{$("[data-sol]",b).innerHTML=`<div class="card acc"><span class="lab">Worked solution · ${shown}/${sol.steps.length}</span><b>${M(sol.title)}</b>${stepsHTML(sol.steps,shown)}${shown>=sol.steps.length&&sol.ans?ansHTML(sol.ans):""}</div>`;rs.textContent=shown>=sol.steps.length?"Solution complete":"Next step";rs.disabled=shown>=sol.steps.length;};
     rev=()=>{if(shown<sol.steps.length){shown++;upd();return true;}return false;};rs.addEventListener("click",rev);}});
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!done)return pk(+e.key-1);if(e.key===" "&&done&&rev){rev();return true;}if((e.key==="ArrowRight"||e.key==="Enter")&&done){cb.next();return true;}};},
 prob(b,it,cb){const o=it.o;let h=0;const N=o.steps.length;let ansShown=false,graded=false;
  const draw=()=>{b.innerHTML=`<span class="lab">${esc(o.src||("HW "+o.id))} · ${esc(o.tag)}</span><div class="statement">${M(o.st)}</div>
   <div class="card tight" style="margin-top:12px"><span class="lab">Hints · ${Math.min(h,N+1)}/${N+1}</span>
    ${h>=1?`<div class="aside" style="margin:0 0 6px"><span class="lab">First move</span>${M(o.first)}</div>`:`<p class="mut" style="margin:0">Try it on paper first. Each hint unlocks one step.</p>`}
    ${h>=2?stepsHTML(o.steps,h-1):""}
    <div class="reveal-bar">${h<=N?`<button class="btn sm" data-h>${h===0?"First move":"Next step"}<span class="kbd">space</span></button>`:""}${!ansShown?`<button class="btn sm ghost" data-a>Show answer</button>`:""}</div></div>
   ${ansShown?`<div class="card acc"><span class="lab">Answer</span>${o.ans&&o.ans.length?ansHTML(o.ans):`<p>Derivation problem. The full worked path is in the steps above.</p>`}${o.trap?`<div class="flag"><b>Trap:</b> ${M(o.trap)}</div>`:""}${o.pic?`<p class="mut"><b>Picture:</b> ${M(o.pic)}</p>`:""}
    ${graded?`<button class="btn cta block" data-n>Next<span class="kbd">→</span></button>`:`<span class="lab" style="margin-top:12px">How did it go?</span><div class="selfgrade"><button class="btn" data-g="1" style="border-color:var(--good)">Got it<span class="kbd">1</span></button><button class="btn" data-g="0" style="border-color:var(--bad)">Missed it<span class="kbd">2</span></button></div>`}</div>`:""}`;};
  const hint=()=>{if(h<=N){h++;draw();return true;}if(!ansShown){ansShown=true;draw();return true;}return false;};
  const gr=ok=>{if(graded)return;graded=true;cb.onGrade(ok);draw();};
  b.addEventListener("click",e=>{if(e.target.closest("[data-h]"))hint();if(e.target.closest("[data-a]")){h=N+1;ansShown=true;draw();}const g=e.target.closest("[data-g]");if(g)gr(g.dataset.g==="1");if(e.target.closest("[data-n]"))cb.next();});
  draw();keyHandler=e=>{if(e.key===" "){hint();return true;}if(ansShown&&!graded&&(e.key==="1"||e.key==="2")){gr(e.key==="1");return true;}if(graded&&(e.key==="ArrowRight"||e.key==="Enter")){cb.next();return true;}};}};
function ansHTML(ans){return `<div class="ansgrid">${ans.map(([l,v,u])=>`<div><small>${TX(l)}</small><b>${typeof v==="number"?v:M(v)}</b><i>${esc(u||"")}</i></div>`).join("")}</div>`;}
function solutionFor(o){for(const c of CH){if(!c.lessons)continue;if(o.prob){const p=c.problems.find(x=>x.id===o.prob);if(p)return{title:p.src||("HW "+p.id),steps:p.steps,ans:p.ans&&p.ans.length?p.ans:null};}
  if(o.ex){const l=c.lessons.find(x=>x.id===o.ex);if(l){const ex=(l.example2&&/8-4/.test(o.src))?l.example2:l.example;if(ex&&!o.useMath)return{title:ex.title,steps:ex.steps};
    return{title:"Lesson "+l.id,steps:l.math.map(m=>[m.t,m.tex,m.note||""])};}}}return null;}

/* ---------- EXAM ---------- */
let EX_CFG={chs:null,n:12,timed:true};
VIEWS.exam=v=>{if(EXAM&&!EXAM.over)return examRun(v);if(EXAM&&EXAM.over)return examReview(v);
  const lec=CH.filter(c=>c.lessons);if(!EX_CFG.chs)EX_CFG.chs=lec.map(c=>c.id);
  const pool=()=>ORDER.filter(id=>EX_CFG.chs.includes(ITEMS[id].ch)&&ITEMS[id].kind!=="prob");
  const last=S.exams.slice(-5).reverse();
  v.innerHTML=`<h1>Exam mode</h1><p class="sub">Timed and mixed, graded by topic, then a full review. Misses feed your spaced-repetition queue.</p>
  <div class="card"><span class="lab">Scope: what's been lectured</span><div class="chips" style="flex-wrap:wrap">${CH.map(c=>`<button data-c="${c.id}" ${c.lessons?"":"disabled"} aria-pressed="${EX_CFG.chs.includes(c.id)}" style="${c.lessons?"":"opacity:.4"}">${chl(c)} ${esc(c.short)}${c.lessons?"":" · soon"}</button>`).join("")}</div>
   <span class="lab" style="margin-top:14px">Questions</span>${`<span class="seg">${[8,12,20].map(n=>`<button data-n="${n}" aria-pressed="${EX_CFG.n===n}">${n}</button>`).join("")}</span>`}
   <span class="seg" style="margin-left:6px">${[["1","Timed"],["0","Untimed"]].map(([k,l])=>`<button data-tm="${k}" aria-pressed="${String(+EX_CFG.timed)===k}">${l}</button>`).join("")}</span>
   <p class="mut num" style="font-size:14px;margin-top:12px" data-info></p><button class="btn cta block" data-start>Start exam</button></div>
  ${last.length?`<div class="card"><span class="lab">Recent</span><div class="list">${last.map(x=>`<div class="li"><span class="t"><b class="num">${x.score}%</b><small>${new Date(x.at).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · ${x.n} questions · ${x.scope}</small></span></div>`).join("")}</div></div>`:""}`;
  const info=()=>{const n=Math.min(EX_CFG.n,pool().length);$("[data-info]",v).textContent=`${n} questions from ${pool().length} · ${EX_CFG.timed?`${Math.round(n*75/60)} min (75 s each)`:"no clock"}`;};info();
  v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if(d.c){const i=EX_CFG.chs.indexOf(d.c);if(i>=0&&EX_CFG.chs.length>1)EX_CFG.chs.splice(i,1);else if(i<0)EX_CFG.chs.push(d.c);b.setAttribute("aria-pressed",EX_CFG.chs.includes(d.c));info();}
    if(d.n){EX_CFG.n=+d.n;$$("[data-n]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));info();}
    if(d.tm){EX_CFG.timed=d.tm==="1";$$("[data-tm]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));info();}
    if(d.start!=null){const ids=shuffle(pool()).slice(0,EX_CFG.n);EXAM={ids,i:0,ans:{},start:Date.now(),limit:EX_CFG.timed?ids.length*75e3:0,over:false,scope:EX_CFG.chs.map(c=>"Ch. "+chOf(c).num).join(", ")};render();scrollTo(0,0);}});};
let exTimer=null;
function examRun(v){const E=EXAM,id=E.ids[E.i],it=ITEMS[id];setAcc(v,chOf(it.ch));
  v.innerHTML=`<div class="qhead"><span class="tag acc">Q${E.i+1}/${E.ids.length}</span><div class="progress"><i style="width:${100*E.i/E.ids.length}%"></i></div><span class="timer" data-t></span></div>
  ${it.kind==="fm"?`<span class="lab">${esc(it.o.src)}</span><div class="statement card tight" style="margin:0 0 10px">${TX(it.o.prompt)}</div><div class="q" style="font-size:17px">First move?</div>`:`<div class="q">${TX(it.o.q)}</div>`}
  <div data-o></div><div class="reveal-bar" style="justify-content:space-between"><button class="btn sm ghost" data-end>End exam</button><button class="btn cta sm" data-n disabled>${E.i+1<E.ids.length?"Next":"Finish"}<span class="kbd">→</span></button></div>`;
  const opts=it.kind==="fm"?it.o.opts.map(o=>o[0]):it.o.o,correct=it.o.a;const {idx,ans}=order(opts.length,correct);let sel=null;
  $("[data-o]",v).innerHTML=`<div class="opts">${idx.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span class="ot">${TX(opts[oi])}</span></button>`).join("")}</div>`;
  const pick=k=>{sel=k;$$(".opt",v).forEach((b,j)=>{b.style.borderColor=j===k?"var(--cta)":"";b.style.background=j===k?"color-mix(in srgb,var(--cta) 12%,var(--surface-2))":"";});$("[data-n]",v).disabled=false;};
  const nxt=()=>{if(sel==null)return;E.ans[id]={pick:idx[sel],ok:sel===ans};E.i++;if(E.i>=E.ids.length)finishExam();else{render();scrollTo(0,0);}};
  v.addEventListener("click",e=>{const o=e.target.closest(".opt");if(o)pick(+o.dataset.k);if(e.target.closest("[data-n]"))nxt();if(e.target.closest("[data-end]"))finishExam();});
  const tick=()=>{const el=$("[data-t]",v);if(!el){clearInterval(exTimer);return;}if(!E.limit){el.textContent=Math.floor((Date.now()-E.start)/6e4)+" min";return;}const left=E.limit-(Date.now()-E.start);if(left<=0){finishExam();return;}const m=Math.floor(left/6e4),s=Math.floor(left%6e4/1e3);el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<6e4);};
  clearInterval(exTimer);exTimer=setInterval(tick,1000);tick();
  keyHandler=e=>{if(/^[1-4]$/.test(e.key)){pick(+e.key-1);return true;}if(e.key==="ArrowRight"||e.key==="Enter"){nxt();return true;}};}
function finishExam(){clearInterval(exTimer);const E=EXAM;if(E.over)return;E.over=true;E.end=Date.now();
  const answered=E.ids.filter(id=>E.ans[id]);const right=answered.filter(id=>E.ans[id].ok).length;E.score=Math.round(100*right/E.ids.length);
  E.ids.forEach(id=>grade(id,!!(E.ans[id]&&E.ans[id].ok),true));
  const prev=S.exams.filter(x=>x.scope===E.scope);const best=prev.length?Math.max(...prev.map(x=>x.score)):null;E.prevBest=best;
  S.exams.push({at:Date.now(),score:E.score,n:E.ids.length,scope:E.scope});save();
  if(best!=null&&E.score>best)award("pb-"+Date.now(),"New personal best",`${E.score}% on ${E.scope}, up from ${best}%.`);
  render();scrollTo(0,0);}
function examReview(v){const E=EXAM;const T=Object.assign({},...CH.map(c=>c.topics||{}));const by={};E.ids.forEach(id=>{const t=ITEMS[id].topic;(by[t]=by[t]||{r:0,n:0}).n++;if(E.ans[id]&&E.ans[id].ok)by[t].r++;});
  const mins=Math.max(1,Math.round((E.end-E.start)/6e4));
  v.innerHTML=`<div class="card" style="text-align:center;margin-top:16px"><span class="lab">Exam score · ${esc(E.scope)} · ${mins} min</span><div class="scorebig num" style="color:${E.score>=80?"var(--good)":E.score>=60?"var(--warn)":"var(--bad)"}">${E.score}%</div>
   <p class="mut">${E.prevBest==null?"First run on this scope. This is your baseline.":E.score>E.prevBest?`Up from ${E.prevBest}%. That's real progress.`:`Best so far: ${E.prevBest}%. Misses are now in your queue.`}</p></div>
  <div class="card"><span class="lab">By topic</span><div class="bars-h">${Object.entries(by).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([t,x])=>{const p=Math.round(100*x.r/x.n);return `<div class="bh"><span>${esc(T[t]||t)}</span><span class="num mut">${x.r}/${x.n}</span><div class="tr"><i style="width:0;background:${p>=80?"var(--good)":p>=50?"var(--warn)":"var(--bad)"}" data-w="${p}"></i></div></div>`;}).join("")}</div></div>
  <span class="lab" style="margin-top:18px">Review</span>${E.ids.map((id,k)=>{const it=ITEMS[id],a=E.ans[id];const opts=it.kind==="fm"?it.o.opts:it.o.o.map(t=>[t,""]);const ok=a&&a.ok;
   return `<div class="card tight" style="border-color:${ok?"color-mix(in srgb,var(--good) 35%,var(--line))":"color-mix(in srgb,var(--bad) 35%,var(--line))"}"><div class="row" style="align-items:flex-start"><span style="color:${ok?"var(--good)":"var(--bad)"};width:22px;flex:none">${ok?ICON.ok:ICON.no}</span><div style="flex:1;min-width:0"><b>${k+1}. ${TX(it.kind==="fm"?it.o.prompt:it.o.q)}</b>
    ${!ok?`<p style="margin:6px 0 0;color:var(--bad);font-size:14px">You: ${a?TX(opts[a.pick][0]):"no answer"}</p>`:""}<p style="margin:4px 0 0;color:var(--good);font-size:14px">Answer: ${TX(opts[it.o.a][0])}</p><p class="mut" style="font-size:14px;margin:4px 0 0">${TX(it.kind==="fm"?it.o.opts[it.o.a][1]:it.o.why)}</p></div></div></div>`;}).join("")}
  <div class="grid2"><button class="btn" data-again>New exam</button><button class="btn cta" data-home>Done</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$("[data-w]",v).forEach(i=>i.style.width=i.dataset.w+"%")));
  v.addEventListener("click",e=>{if(e.target.closest("[data-again]")){EXAM=null;render();}if(e.target.closest("[data-home]")){EXAM=null;go("play");}});}

/* ---------------- boot ---------------- */
if(window.__MXGAME)window.__MXGAME({get S(){return S;},save,ITEMS,ORDER,CH,grade,M,TX,tex,block,stepsHTML,esc,$,$$,push,go,back,render,VIEWS,toast,confetti,award,ringSVG,animateRings,setAcc,chOf,mastery,shuffle,markDay,order,ICON,get NAV(){return NAV;},setKey:f=>{keyHandler=f;},queue,troubleIds,streak,nextEvent,until,itemTitle,RM});
chrome();render();fitObs.observe(document.body,{childList:true,subtree:true});let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{$$(".mathbox[data-fit]").forEach(b=>{delete b.dataset.fit;b.innerHTML=tex(b.dataset.t,true);});fitMath(document);},200);});
if(/^https?:/.test(location.protocol)&&"serviceWorker" in navigator&&window.self===window.top){navigator.serviceWorker.register("sw.js").catch(()=>{});}
setInterval(()=>{if(NAV.tab==="play"&&!NAV.stack.length&&!document.hidden&&!document.querySelector(".battle"))render();},60000);
window.MAXWELL={state:()=>S,items:ITEMS};
})();
</script>
</body></html>
